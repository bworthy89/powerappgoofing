# Component — Version panel
#
# The app's whole reason to exist is "is this machine on the current build?". This is that
# answer, and it is the largest thing on any detail screen.
#
# WHY IT IS A COMPONENT AND WHY IT IS ONLY USED TWICE
#
# Microsoft's documented limitation: "You can't insert a component into a gallery or a
# form." That rules out the unit rows, the solution cards on scrCustomerOverview, and every
# other list in this app - the places a reusable status chip would have earned its keep.
# What is left is scrSolution and scrUnit, which show the identical comparison against a
# different record. Two instances is a thin case for a component, but those two are the
# screens where the logic being wrong matters most, and one definition cannot drift from
# itself. Row-level status is built inline instead; see gen_solution.py.
#
# It was originally a 190x44 pill. That was sized for the gallery rows it turns out it can
# never live in, so it is now a full-width hero: the version numbers are the headline of the
# screen, not a badge in its corner.
#
# FOUR STATES, NOT THREE
#
# "No standard recorded on the product" is a different fact from "no version recorded on the
# machine" - the first is a gap in the catalogue, the second a gap in the survey, and
# different people fix them. The old concatenated string collapsed both into one grey blob.
#
# Colour never carries the state alone. Every state also says it in words, which is the
# accessibility rule most status displays break.
#
# CUSTOM PROPERTY REFERENCES
#
# Always cmpVersionChip.<Name>. The bare name is rejected with "Name isn't valid", and
# Parent.<Name> does not work either - Parent resolves for layout (Parent.Width) but not for
# custom properties. That bakes this component's name into its own children, so renaming it
# in Studio breaks every reference at once.
#
# The rail colour is interpolated into the SVG as a hex STRING, not a Color. Power Fx colours
# are a distinct type with no text conversion, so the state test is duplicated - once
# returning text for the SVG, once returning Color for the labels. They must stay in step.

ComponentDefinitions:
  cmpVersionChip:
    DefinitionType: CanvasComponent
    Description: The installed software version against the product's current standard, as a four-state hero panel with a chamfered surface and a state-coloured rail.
    AccessAppScope: true
    CustomProperties:
      InstalledVersion:
        PropertyKind: Input
        DataType: Text
        Description: The version actually on the machine. Blank means nobody has recorded one.
        Default: |-
          =""
      StandardVersion:
        PropertyKind: Input
        DataType: Text
        Description: The product's current standard version. Blank means the catalogue has no standard for this product.
        Default: |-
          =""
      SourceNote:
        PropertyKind: Input
        DataType: Text
        Description: Where the installed version came from, when it was not the machine's own record. Blank when it was.
        Default: |-
          =""
    Properties:
      Height: =116
      Width: =560
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      # The chamfered surface. Power Apps has no chamfer - only four independent radii - so
      # this is SVG, matching the cut corners of the GLORY wordmark. The 4px rail carries the
      # state as colour; the text below carries it as words.
      - imgChipPanel:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Image: |
              ="data:image/svg+xml;utf8, " & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' width='" & Round(Parent.Width, 0) & "' height='" & Round(Parent.Height, 0) & "' viewBox='0 0 " & Round(Parent.Width, 0) & " " & Round(Parent.Height, 0) & "' preserveAspectRatio='none'>" &
                  "<path d='M0 0 H" & Round(Parent.Width - 20, 0) & " L" & Round(Parent.Width, 0) & " 20 V" & Round(Parent.Height, 0) & " H0 Z' fill='#171A21' stroke='#2A2F3A' stroke-width='1'/>" &
                  "<rect x='0' y='0' width='4' height='" & Round(Parent.Height, 0) & "' fill='" &
                  If(
                      IsBlank(cmpVersionChip.InstalledVersion), "#7F8794",
                      IsBlank(cmpVersionChip.StandardVersion), "#838C9B",
                      cmpVersionChip.InstalledVersion = cmpVersionChip.StandardVersion, "#3DD68C",
                      "#F5B83D"
                  ) & "'/>"
              )

      - lblChipLabel:
          Control: ModernText
          Properties:
            X: =24
            Y: =16
            Width: =Parent.Width - 48
            Height: =18
            PaddingTop: =0
            PaddingBottom: =0
            Text: ="SOFTWARE VERSION"
            Font: =AppFont
            Size: =AppType.Small
            FontWeight: =FontWeight.Bold
            Color: =AppDark.Muted
            Wrap: =false
            AutoHeight: =false

      # The headline. When the machine is behind it carries BOTH numbers and the direction
      # between them, so the comparison needs no second glance. Every other state shows one
      # number, or says plainly that there is not one.
      - lblChipVersion:
          Control: ModernText
          Properties:
            X: =24
            Y: =40
            Width: =Parent.Width - 48
            Height: =41
            PaddingTop: =0
            PaddingBottom: =0
            Font: =AppFont
            Size: =If(IsNarrow, AppType.Title, AppType.Display)
            FontWeight: =FontWeight.Semibold
            Wrap: =false
            AutoHeight: =false
            Text: |
              =If(
                  IsBlank(cmpVersionChip.InstalledVersion),
                  "not recorded",
                  IsBlank(cmpVersionChip.StandardVersion),
                  cmpVersionChip.InstalledVersion,
                  cmpVersionChip.InstalledVersion = cmpVersionChip.StandardVersion,
                  cmpVersionChip.InstalledVersion,
                  cmpVersionChip.InstalledVersion & "   →   " & cmpVersionChip.StandardVersion
              )
            Color: |
              =If(
                  IsBlank(cmpVersionChip.InstalledVersion),
                  AppDark.Faint,
                  IsBlank(cmpVersionChip.StandardVersion),
                  AppDark.Fg,
                  cmpVersionChip.InstalledVersion = cmpVersionChip.StandardVersion,
                  AppDark.Ok,
                  AppDark.Warn
              )

      # The verdict, in words. This is what makes the panel readable to someone who cannot
      # separate the tints, and it is also the line that says what to DO - "update available"
      # is an instruction, "3.4.1 is not 3.6.0" is a riddle.
      - lblChipVerdict:
          Control: ModernText
          Properties:
            X: =24
            Y: =84
            Width: =Parent.Width - 48
            Height: =18
            PaddingTop: =0
            PaddingBottom: =0
            Font: =AppFont
            Size: =AppType.Small
            Wrap: =false
            AutoHeight: =false
            Text: |
              =If(
                  IsBlank(cmpVersionChip.InstalledVersion),
                  "no version on file for this machine",
                  IsBlank(cmpVersionChip.StandardVersion),
                  "no standard set for this model",
                  cmpVersionChip.InstalledVersion = cmpVersionChip.StandardVersion,
                  "on the current standard",
                  "update available"
              ) & cmpVersionChip.SourceNote
            Color: =AppDark.Muted
