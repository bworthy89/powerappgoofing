# Component — Expected version panel
#
# The app does not read machines. Every version it holds is a record of what someone last
# entered, so this panel reports two things it can actually support: the version we expect,
# and how long ago anyone confirmed it. It no longer compares anything.
#
# WHY THE COMPARISON WENT
#
# "update available" reads as a finding derived from knowledge the app does not have. A
# technician who arrives expecting a machine to need updating and finds it already current
# stops trusting the number - and once that trust is gone the app has nothing else to offer.
# "3.4.1, verified 14 months ago" is a weaker claim and a true one, and it points at the
# same action without pretending to know the answer.
#
# WHY THIS COMPONENT IS NEARLY EMPTY
#
# The age wording and the staleness threshold live in scripts/screen_parts.py, not here, and
# arrive as VerifiedNote and IsStale. That is because a component cannot be inserted into a
# gallery or a form (Microsoft's documented limitation), so the unit rows and solution cards
# must compute the same thing inline. One Python helper feeding both is the only arrangement
# where the panel and the rows cannot drift apart; putting the logic in Power Fx here would
# guarantee two copies in two languages.
#
# WHY IT IS STILL A COMPONENT
#
# scrSolution and scrUnit show the identical panel against a different record, and those are
# the screens where being wrong matters most.
#
# CUSTOM PROPERTY REFERENCES
#
# Always cmpVersionChip.<Name>. The bare name is rejected with "Name isn't valid", and
# Parent.<Name> does not work either - Parent resolves for layout (Parent.Width) but not for
# custom properties. That bakes this component's name into its own children, so renaming it
# in Studio breaks every reference at once.
#
# The rail colour is interpolated into the SVG as a hex STRING, not a Color. Power Fx colours
# are a distinct type with no text conversion, so the state test is duplicated - once
# returning text for the SVG, once returning Color for the label. They must stay in step.

ComponentDefinitions:
  cmpVersionChip:
    DefinitionType: CanvasComponent
    Description: The software version expected on a machine and how long ago it was last verified, as a hero panel with a chamfered surface and an age-coloured rail.
    AccessAppScope: true
    CustomProperties:
      ExpectedVersion:
        PropertyKind: Input
        DataType: Text
        Description: The version we expect this machine to be running. Blank means nobody has recorded one.
        Default: |-
          =""
      VerifiedNote:
        PropertyKind: Input
        DataType: Text
        Description: How long ago the version was last confirmed, already worded - "verified 3 weeks ago", or "never verified". Built by screen_parts.verified_note.
        Default: |-
          =""
      IsStale:
        PropertyKind: Input
        DataType: Boolean
        Description: True when the version was last verified over a year ago. False when it was verified recently AND when it was never verified at all - "never" is said in words rather than coloured. Built by screen_parts.verified_is_stale.
        Default: |-
          =false
      SourceNote:
        PropertyKind: Input
        DataType: Text
        Description: Where the expected version came from, when it was not the machine's own record. Blank when it was.
        Default: |-
          =""
    Properties:
      Height: =116
      Width: =560
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      # The chamfered surface. Power Apps has no chamfer - only four independent radii - so
      # this is SVG, matching the cut corners of the GLORY wordmark. The 4px rail carries the
      # verification age as colour; the text below carries it as words.
      - imgChipPanel:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Image: |
              ="data:image/svg+xml;utf8, " & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' width='" & Round(Parent.Width, 0) & "' height='" & Round(Parent.Height, 0) & "' viewBox='0 0 " & Round(Parent.Width, 0) & " " & Round(Parent.Height, 0) & "' preserveAspectRatio='none'>" &
                  "<path d='M0 0 H" & Round(Parent.Width - 20, 0) & " L" & Round(Parent.Width, 0) & " 20 V" & Round(Parent.Height, 0) & " H0 Z' fill='#171A21' stroke='#2A2F3A' stroke-width='1'/>" &
                  "<rect x='0' y='0' width='4' height='" & Round(Parent.Height, 0) & "' fill='" &
                  If(cmpVersionChip.IsStale, "#F5B83D", "#838C9B") & "'/>"
              )

      - lblChipLabel:
          Control: ModernText
          Properties:
            X: =24
            Y: =16
            Width: =Parent.Width - 48
            Height: =18
            PaddingTop: =0
            PaddingBottom: =0
            Text: ="EXPECTED VERSION"
            Font: =AppFont
            Size: =AppType.Small
            FontWeight: =FontWeight.Bold
            Color: =AppDark.Muted
            Wrap: =false
            AutoHeight: =false

      # One number, or the plain statement that there is not one. No arrow, no second
      # version, no verdict - the headline is the record, and the line below dates it.
      - lblChipVersion:
          Control: ModernText
          Properties:
            X: =24
            Y: =40
            Width: =Parent.Width - 48
            Height: =41
            PaddingTop: =0
            PaddingBottom: =0
            Font: =AppFont
            Size: =If(IsNarrow, AppType.Title, AppType.Display)
            FontWeight: =FontWeight.Semibold
            Wrap: =false
            AutoHeight: =false
            Text: |
              =If(
                  IsBlank(cmpVersionChip.ExpectedVersion),
                  "not recorded",
                  cmpVersionChip.ExpectedVersion
              )
            Color: |
              =If(
                  IsBlank(cmpVersionChip.ExpectedVersion),
                  AppDark.Faint,
                  AppDark.Fg
              )

      # The age, in words. This is what turns a number into a claim someone can weigh: the
      # same version is worth acting on at three weeks and worth checking at fourteen months.
      # Colour never carries it alone.
      - lblChipVerdict:
          Control: ModernText
          Properties:
            X: =24
            Y: =84
            Width: =Parent.Width - 48
            Height: =18
            PaddingTop: =0
            PaddingBottom: =0
            Font: =AppFont
            Size: =AppType.Small
            Wrap: =false
            AutoHeight: =false
            Text: |
              =cmpVersionChip.VerifiedNote & cmpVersionChip.SourceNote
            Color: |
              =If(cmpVersionChip.IsStale, AppDark.Warn, AppDark.Muted)
