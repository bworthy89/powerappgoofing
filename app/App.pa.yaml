App:
  Properties:
    Theme: =PowerAppsTheme
    StartScreen: =scrHome
    Formulas: |-
      =AppTheme = {
          Bg:            ColorValue("#F4F6F8"),
          Surface:       ColorValue("#FFFFFF"),
          Sunken:        ColorValue("#E7EBEF"),
          Fg:            ColorValue("#14181C"),
          FgSecondary:   ColorValue("#39424B"),
          Muted:         ColorValue("#66727E"),
          Faint:         ColorValue("#8C97A2"),
          Line:          ColorValue("#DFE4E9"),
          LineSoft:      ColorValue("#EBEEF1"),
          Primary:       ColorValue("#0057B8"),
          PrimaryDark:   ColorValue("#003D82"),
          PrimaryLight:  ColorValue("#E7F0FA"),
          OnPrimary:     ColorValue("#FFFFFF"),
          Ok:            ColorValue("#17795E"),
          OkLight:       ColorValue("#E2F2EC"),
          Warn:          ColorValue("#9A6100"),
          WarnLight:     ColorValue("#FBF0DC"),
          Neutral:       ColorValue("#66727E"),
          NeutralLight:  ColorValue("#EDF0F3")
      };
      AppDark = {
          Brand:         ColorValue("#111987"),
          Bg:            ColorValue("#0F1115"),
          Surface:       ColorValue("#171A21"),
          SurfaceHi:     ColorValue("#1E222B"),
          Line:          ColorValue("#2A2F3A"),
          Fg:            ColorValue("#F2F4F8"),
          FgSecondary:   ColorValue("#B9C0CC"),
          Muted:         ColorValue("#838C9B"),
          Accent:        ColorValue("#6A73E6"),
          AccentSolid:   ColorValue("#2E3AD4"),
          Ok:            ColorValue("#3DD68C"),
          Warn:          ColorValue("#F5B83D"),
          OnBrand:       ColorValue("#FFFFFF"),
          Sunken:        ColorValue("#0A0C0F"),
          SurfaceAlt:    ColorValue("#1E222B"),
          LineSoft:      ColorValue("#21252E"),
          Faint:         ColorValue("#7F8794"),
          AccentTint:    ColorValue("#101326"),
          OkTint:        ColorValue("#102C1E"),
          WarnTint:      ColorValue("#302509"),
          NeutralTint:   ColorValue("#232833"),
          Danger:        ColorValue("#EC6A6E"),
          DangerSolid:   ColorValue("#C0182B")
      };
      AppFont = Font.'Lato';
      AppType = {
          Display:  32,
          Title:    22,
          Heading:  17,
          Body:     14,
          Small:    12,
          Micro:    10
      };
      IsNarrow = App.Width < 640;
      Gutter = If(App.Width < 640, 16, 24);
      ContentWidth = Min(App.Width - (Gutter * 2), 1100)
    OnStart: |-
      =Set(varCustomer, Defaults(TB_Customers));
      Set(varInstallation, Defaults(TB_Installations));
      Set(varExpandedModel, 0);
      Set(varIsAdmin,
          !IsBlank(LookUp(TB_Admins,
              (Lower(Person.Claims) = "i:0#.f|membership|" & Lower(User().Email) || Lower(Person.Email) = Lower(User().Email))
              && Status.Value = "Approved")))
