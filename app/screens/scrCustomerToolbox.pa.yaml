# Screen 2 of 3 — Customer Toolbox
# Paste into: Power Apps Studio > new blank screen > right-click screen > Code view > Paste
Screens:
  scrCustomerToolbox:
    Properties:
      Fill: =AppTheme.Background
    Children:
      - conToolboxHeader:
          Control: GroupContainer
          Variant: ManualLayoutContainer
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =96
            Fill: =AppTheme.Primary
          Children:
            - btnBackToCustomers:
                Control: Classic/Button
                Properties:
                  X: =24
                  Y: =28
                  Width: =100
                  Height: =40
                  Text: ="< Back"
                  Fill: =AppTheme.Secondary
                  Color: =Color.White
                  BorderColor: =AppTheme.Secondary
                  OnSelect: =Navigate(scrCustomers, ScreenTransition.Fade)
            - lblSelectedCustomer:
                Control: Label
                Properties:
                  X: =144
                  Y: =20
                  Width: =Parent.Width - 300
                  Height: =32
                  Text: =varCustomer.Title
                  Color: =Color.White
                  Size: =20
                  FontWeight: =FontWeight.Semibold
            - lblCustomerCodeHeader:
                Control: Label
                Properties:
                  X: =144
                  Y: =52
                  Width: =Parent.Width - 300
                  Height: =26
                  Text: =varCustomer.CustomerCode
                  Color: =ColorValue("#C7D8E3")
                  Size: =12
      - conCustomerSummary:
          Control: GroupContainer
          Variant: ManualLayoutContainer
          Properties:
            X: =32
            Y: =120
            Width: =Parent.Width - 64
            Height: =136
            Fill: =AppTheme.Card
          Children:
            - lblSummaryHeading:
                Control: Label
                Properties:
                  X: =20
                  Y: =12
                  Width: =400
                  Height: =24
                  Text: ="Customer overview"
                  Color: =AppTheme.Text
                  Size: =13
                  FontWeight: =FontWeight.Semibold
            - lblCustomerDescription:
                Control: Label
                Properties:
                  X: =20
                  Y: =40
                  Width: =Parent.Width - 40
                  Height: =40
                  Text: =Coalesce(varCustomer.CustomerDescription, "No description recorded.")
                  Color: =AppTheme.Text
                  Size: =12
            - lblSupportNotes:
                Control: Label
                Properties:
                  X: =20
                  Y: =82
                  Width: =Parent.Width - 40
                  Height: =40
                  Text: =Coalesce(varCustomer.SupportNotes, "No customer-wide support notes recorded.")
                  Color: =AppTheme.MutedText
                  Size: =12
      - lblSolutionsHeading:
          Control: Label
          Properties:
            X: =32
            Y: =272
            Width: =500
            Height: =28
            Text: ="Installed solutions"
            Color: =AppTheme.Text
            Size: =15
            FontWeight: =FontWeight.Semibold
      - galSolutions:
          Control: Gallery
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            X: =32
            Y: =308
            Width: =Parent.Width - 64
            Height: =Parent.Height - 340
            TemplateSize: =96
            TemplatePadding: =8
            Items: |
              =SortByColumns(
                  Filter(
                      TB_CustomerSolutions,
                      Customer.Id = varCustomer.ID &&
                      Active = true
                  ),
                  "SortOrder",
                  SortOrder.Ascending,
                  "SolutionModel",
                  SortOrder.Ascending
              )
            OnSelect: |
              =Set(varSolution, ThisItem);
              Set(varComponent, Blank());
              Set(varSelectedSection, "Overview");
              Navigate(scrSolutionDetails, ScreenTransition.Fade)
          Children:
            - recSolutionCard:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =88
                  Fill: =AppTheme.Card
                  BorderColor: =AppTheme.Border
                  BorderThickness: =1
            - lblSolutionName:
                Control: Label
                Properties:
                  X: =20
                  Y: =12
                  Width: =Parent.TemplateWidth - 260
                  Height: =28
                  Text: =ThisItem.Title
                  Color: =AppTheme.Text
                  Size: =15
                  FontWeight: =FontWeight.Semibold
            - lblSolutionModel:
                Control: Label
                Properties:
                  X: =20
                  Y: =44
                  Width: =Parent.TemplateWidth - 260
                  Height: =26
                  Text: =ThisItem.SolutionModel & If(!IsBlank(ThisItem.SolutionFamily.Value), "  •  " & ThisItem.SolutionFamily.Value)
                  Color: =AppTheme.MutedText
                  Size: =11
            - recStatusBadge:
                Control: Rectangle
                Properties:
                  X: =Parent.TemplateWidth - 230
                  Y: =28
                  Width: =200
                  Height: =32
                  Fill: |
                    =Switch(
                        ThisItem.DeploymentStatus.Value,
                        "Current", AppTheme.SuccessLight,
                        "Upgrade Required", AppTheme.WarningLight,
                        "Mixed Deployment", AppTheme.WarningLight,
                        ColorValue("#EDEBE9")
                    )
            - lblStatusBadge:
                Control: Label
                Properties:
                  X: =Parent.TemplateWidth - 230
                  Y: =28
                  Width: =200
                  Height: =32
                  Text: =ThisItem.DeploymentStatus.Value
                  Color: =AppTheme.Text
                  Size: =11
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
      - lblNoSolutions:
          Control: Label
          Properties:
            X: =32
            Y: =360
            Width: =Parent.Width - 64
            Height: =60
            Text: ="No active solutions are recorded for this customer."
            Color: =AppTheme.MutedText
            Size: =13
            Align: =Align.Center
            Visible: =CountRows(galSolutions.AllItems) = 0
