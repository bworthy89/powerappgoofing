# Screen — Unit
# Answers the question a technician standing in front of a jammed machine actually asks:
# is this specific unit running the firmware the catalogue says it should, and what about
# it is known to be non-standard. Reached from scrSolution's galUnits.OnSelect, which sets
# varInstallation to the tapped child TB_Installations row (Parent set — this is a unit,
# not a solution) before navigating here. varCustomer is already set to the whole
# TB_Customers record from further up the chain.
#
# Structurally this is scrSolution scoped down to one unit: same version-pair card, same
# two document galleries. Two things do NOT carry over:
#   - No nested gallery of child units — a unit contains nothing beneath it.
#   - The config-notes card is tinted AppDark.WarnTint, not AppDark.Surface. A
#     non-standard part or an upgrade-path constraint is exactly what bites mid-job, so
#     it is called out rather than blending into a neutral card.
# A breadcrumb (lblCrumb) is new here — customer, then the parent solution's product
# line, then this unit's own kind — so a technician who navigated in mid-triage still
# knows which system they're standing in front of.
#
# Version pair reads the UNIT own product standard, not the parent solution one. Because
# varInstallation on this screen already IS the unit row, every formula below that reads
# "LookUp(TB_Products, ID = varInstallation.Product.Id)" is resolving the unit own model.
# Inheriting the parent solution standard instead would silently compare, say, a note
# recycler against a cash machine catalogue version, so this screen never reads anything
# through varInstallation.'Parent' except in the breadcrumb, where the parent is exactly
# what is being described.
#
# Version pair uses = or ≠ only — never a directional arrow, never "upgrade to". ≠ is
# U+2260 and may not render in the Power Apps mobile player; if it shows as a box in
# Studio, substitute the literal string "vs" for "≠" in lblSeparatorUnit.Text below.
# lblSeparatorUnit (and rectCurrencyUnit/lblCurrencyUnit beside it) both branch on FOUR states, and
# must agree with each other in all four:
#   1. installed version blank            -> separator "",  badge "not recorded" (neutral)
#   2. catalogue standard blank           -> separator "",  badge hidden entirely
#      (with no standard there is nothing to compare against; showing "≠" here would
#      assert the unit is off standard when no standard exists to be off of)
#   3. installed = standard (both present)-> separator "=", badge "on standard" (ok)
#   4. installed <> standard (both present)-> separator "≠", badge "standard <ver>" (warn)
#
# A row with a blank URL must be visible but not tappable. Gallery.DisplayMode is a
# screen-scoped scalar and the ThisItem token does not resolve inside it (Studio would
# reject it as not recognized), so this is done with two row-scoped constructs instead:
# OnSelect guards the Launch, and the row's title label dims when URL is blank. No
# DisplayMode property appears on either gallery — copied unchanged from scrSolution.
#
# lblChecked and lblException are named per the brief as a role, not a literal single
# control — each gallery needs its own instance, so they appear here as
# lblDocsCheckedUnit/lblDocsExceptionUnit and lblFirmwareCheckedUnit/lblFirmwareExceptionUnit, with the
# brief's formulas carried over unchanged (both read ThisItem, generic to whichever
# gallery hosts them).
#
# lblCrumb.Text nests a LookUp inside a LookUp's ID= predicate: the outer LookUp needs
# the parent solution's Product.Id, which only exists on the parent's own row, which
# itself is only reachable via a LookUp on varInstallation.'Parent'.Id. This is two genuine
# hops (installation -> installation, then installation -> product) so the nesting is
# structural, not incidental — Studio is expected to accept it, but nobody here can
# confirm that in the actual designer.
#
# FALLBACK if Studio rejects the nested LookUp below (apply in minutes, no With/As/
# AddColumns needed): split lblCrumb into two label controls.
#   1. Add a helper label, e.g. lblCrumbParentProductId, anywhere on the canvas, with
#      Text: =LookUp(TB_Installations, ID = varInstallation.'Parent'.Id).Product.Id
#      (SharePoint list item IDs are plain integers, so this round-trips through a Text
#      property safely — unlike a GUID, which would not.)
#   2. Change lblCrumb's middle segment from the nested LookUp to:
#      LookUp(TB_Products, ID = Value(lblCrumbParentProductId.Text)).Title
#      i.e. read the id back out with Value() instead of nesting the LookUp call.
#   Everything else in lblCrumb.Text is unchanged.
#
# Back button resets varInstallation to the parent solution row before navigating to
# scrSolution, since scrSolution formulas assume varInstallation IS the solution (Parent
# blank) — arriving there with varInstallation still pointed at this unit would show the
# unit product and version in the solution own header.
#
# Retired rows are excluded wherever TB_Installations is queried directly (there is no
# such query on this screen beyond the single-row lookups above, which read Status only
# for display, not filtering — this screen shows one already-selected row regardless of
# its status, same as scrSolution shows its own selected row).
Screens:
  scrUnit:
    Properties:
      Fill: =AppDark.Bg
    Children:
      - conRootUnit:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
            Y: =0
            Width: =ContentWidth
            Height: =Parent.Height
            Fill: =AppDark.Bg
          Children:
            # Brand continuity with the band on scrHome. 3px at Y=0, above all screen
            # content, which starts at Y=Gutter - so no existing Y arithmetic moves.
            - recUnitBrandRule:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =3
                  Fill: =AppDark.Accent
            - btnBackUnit:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  X: =Gutter
                  Y: =Gutter
                  Width: =Gutter * 10
                  Height: =28
                  Text: ="Solution"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Accent
                  BorderThickness: =0
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: |
                    =Set(varInstallation, LookUp(TB_Installations, ID = varInstallation.'Parent'.Id));
                    Navigate(scrSolution, ScreenTransition.CoverRight)
            - lblCrumb:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Gutter + 36
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =18
                  Text: |
                    =varCustomer.Title & "  ›  " &
                    LookUp(TB_Products, ID = LookUp(TB_Installations, ID = varInstallation.'Parent'.Id).Product.Id).Title &
                    "  ›  " &
                    Lower(LookUp(TB_Products, ID = varInstallation.Product.Id).'Product Type'.Value)
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Muted
            - lblTitleUnit:
                Control: ModernText
                Properties:
                  Color: =AppDark.Fg
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Gutter + 58
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =32
                  Text: =LookUp(TB_Products, ID = varInstallation.Product.Id).Title
                  Font: =AppFont
                  Size: =AppType.Title
                  FontWeight: =FontWeight.Bold
            - lblSubtitleUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Gutter + 94
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: |
                    =LookUp(TB_Products, ID = varInstallation.Product.Id).Family.Value &
                    If(varInstallation.Status.Value = "In Service", "", "  ·  " & Lower(varInstallation.Status.Value))
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppDark.Muted
            - conVersionUnit:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: =Gutter + 122
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =112
                  Fill: =AppDark.Surface
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                Children:
                  - lblVersionHeadingUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =12
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =16
                        Text: ="FIRMWARE VERSION"
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Bold
                        Color: =AppDark.Muted
                  - lblInstalledUnit:
                      Control: ModernText
                      Properties:
                        Color: =AppDark.Fg
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.4
                        Height: =28
                        Align: =Align.Left
                        VerticalAlign: =VerticalAlign.Middle
                        Text: =Coalesce(varInstallation.'Installed Version', "not recorded")
                        Font: =AppFont
                        Size: =AppType.Heading
                        FontWeight: =FontWeight.Semibold
                  - lblSeparatorUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter + ((Parent.Width - (Gutter * 2)) * 0.4)
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.2
                        Height: =28
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Text: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              "",
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              "",
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              "=",
                              "≠"
                          )
                        Font: =AppFont
                        Size: =AppType.Heading
                        FontWeight: =FontWeight.Bold
                        Color: =AppDark.Muted
                  - lblStandardUnit:
                      Control: ModernText
                      Properties:
                        Color: =AppDark.Fg
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        X: =Gutter + ((Parent.Width - (Gutter * 2)) * 0.6)
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.4
                        Height: =28
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Text: =Coalesce(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version', "—")
                        Font: =AppFont
                        Size: =AppType.Heading
                        FontWeight: =FontWeight.Semibold
                  - rectCurrencyUnit:
                      Control: Rectangle
                      Properties:
                        X: =Gutter
                        Y: =72
                        Width: =Gutter * 9
                        Height: =24
                        BorderThickness: =0
                        Visible: =!IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version')
                        Fill: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              AppDark.NeutralTint,
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              AppDark.NeutralTint,
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              AppDark.OkTint,
                              AppDark.WarnTint
                          )
                  - lblCurrencyUnit:
                      Control: ModernText
                      Properties:
                        Color: =AppDark.Fg
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =72
                        Width: =Gutter * 9
                        Height: =24
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Semibold
                        Visible: =!IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version')
                        Text: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              "not recorded",
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              "",
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              "on standard",
                              "standard " & LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'
                          )
            - conConfigNotesUnit:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: =Gutter + 122 + 112 + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =92
                  Fill: =AppDark.WarnTint
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Visible: =!IsBlank(varInstallation.'Config Notes')
                Children:
                  - lblConfigHeadingUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =12
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =16
                        Text: ="WHAT'S NON-STANDARD"
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Bold
                        Color: =AppDark.Muted
                  - lblConfigNotesUnit:
                      Control: ModernText
                      Properties:
                        Color: =AppDark.Fg
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =32
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =52
                        Text: =varInstallation.'Config Notes'
                        Font: =AppFont
                        Size: =AppType.Small
            - lblDocsHeadingUnit:
                Control: ModernText
                Properties:
                  Color: =AppDark.Fg
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 122 + 112 + Gutter,
                        Gutter + 122 + 112 + Gutter + 92 + Gutter
                    )
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =24
                  Text: ="Documentation"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
            - galDocsUnit:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 122 + 112 + Gutter,
                        Gutter + 122 + 112 + Gutter + 92 + Gutter
                    ) + 32
                  Width: =If(scrUnit.Size >= ScreenSize.Medium, (Parent.Width - (Gutter * 3)) / 2, Parent.Width - (Gutter * 2))
                  Height: =180
                  TemplateSize: =52
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References,
                            Product.Id = varInstallation.Product.Id,
                            Section.Value = "Documentation",
                            Or(IsBlank(Customer), Customer.Id = varCustomer.ID)
                        ),
                        "TBFeatured",
                        SortOrder.Descending
                    )
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - rectDocsRowUnit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =0
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =48
                        BorderThickness: =1
                        Text: =""
                        Fill: =AppDark.Surface
                        HoverFill: =AppDark.Sunken
                        PressedFill: =AppDark.AccentTint
                        BorderColor: =AppDark.LineSoft
                        HoverBorderColor: =AppDark.Line
                        PressedBorderColor: =AppDark.Accent
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  - lblDocsTitleUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =20
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppDark.Faint, AppDark.Fg)
                        Text: =ThisItem.Title
                  - lblDocsTypeUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.4
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Micro
                        Color: =AppDark.Muted
                        Text: =ThisItem.'Reference Type'.Value
                  - lblDocsExceptionUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.4)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.25
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Accent
                        Text: =If(IsBlank(ThisItem.Customer.Value), "", "this customer")
                  - lblDocsCheckedUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.65)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.35
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Micro
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppDark.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppDark.Warn,
                              AppDark.Ok
                          )
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galDocsHitUnit:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(255, 255, 255, 0.06)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblNoDocsUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 122 + 112 + Gutter,
                        Gutter + 122 + 112 + Gutter + 92 + Gutter
                    ) + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppDark.Muted
                  Text: ="No documentation is on file for this unit."
                  Visible: =CountRows(galDocsUnit.AllItems) = 0
            - lblFirmwareHeadingUnit:
                Control: ModernText
                Properties:
                  Color: =AppDark.Fg
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =If(scrUnit.Size >= ScreenSize.Medium, galDocsUnit.X + galDocsUnit.Width + Gutter, Gutter)
                  Y: =If(scrUnit.Size >= ScreenSize.Medium, lblDocsHeadingUnit.Y, galDocsUnit.Y + galDocsUnit.Height + Gutter)
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 122 + 112 + Gutter,
                        Gutter + 122 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 180 + Gutter
                  Width: =If(scrUnit.Size >= ScreenSize.Medium, (Parent.Width - (Gutter * 3)) / 2, Parent.Width - (Gutter * 2))
                  Height: =24
                  Text: ="Firmware & Downloads"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
            - galFirmwareUnit:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =lblFirmwareHeadingUnit.X
                  Y: =lblFirmwareHeadingUnit.Y + lblFirmwareHeadingUnit.Height + 8
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 122 + 112 + Gutter,
                        Gutter + 122 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 180 + Gutter + 32
                  Width: =lblFirmwareHeadingUnit.Width
                  # Floored at 0: conRootUnit is fixed-height with no scroll idiom proven
                  # anywhere in this kit (GroupContainer here is always ManualLayout — see
                  # scrHome's note on why AutoLayout was rejected as unverified), so a
                  # negative height would clip rather than degrade. The gallery's own
                  # ShowScrollbar handles scrolling through however many rows fit the
                  # floored height; on a screen tall enough for the fixed content above,
                  # this evaluates to the same positive value as before.
                  Height: |
                    =Max(
                        Parent.Height - (
                            If(
                                IsBlank(varInstallation.'Config Notes'),
                                Gutter + 122 + 112 + Gutter,
                                Gutter + 122 + 112 + Gutter + 92 + Gutter
                            ) + 32 + 180 + Gutter + 32
                        ) - Gutter,
                        0
                    )
                  TemplateSize: =52
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References,
                            Product.Id = varInstallation.Product.Id,
                            Section.Value = "Firmware & Downloads",
                            Or(IsBlank(Customer), Customer.Id = varCustomer.ID)
                        ),
                        "TBFeatured",
                        SortOrder.Descending
                    )
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - rectFirmwareRowUnit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =0
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =48
                        BorderThickness: =1
                        Text: =""
                        Fill: =AppDark.Surface
                        HoverFill: =AppDark.Sunken
                        PressedFill: =AppDark.AccentTint
                        BorderColor: =AppDark.LineSoft
                        HoverBorderColor: =AppDark.Line
                        PressedBorderColor: =AppDark.Accent
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  - lblFirmwareTitleUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =20
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppDark.Faint, AppDark.Fg)
                        Text: =ThisItem.Title
                  - lblFirmwareTypeUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.4
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Micro
                        Color: =AppDark.Muted
                        Text: =ThisItem.'Reference Type'.Value
                  - lblFirmwareExceptionUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.4)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.25
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Accent
                        Text: =If(IsBlank(ThisItem.Customer.Value), "", "this customer")
                  - lblFirmwareCheckedUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.65)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.35
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Micro
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppDark.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppDark.Warn,
                              AppDark.Ok
                          )
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galFirmwareHitUnit:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(255, 255, 255, 0.06)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblNoFirmwareUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 122 + 112 + Gutter,
                        Gutter + 122 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 180 + Gutter + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppDark.Muted
                  Text: ="No firmware or downloads are on file for this unit."
                  Visible: =CountRows(galFirmwareUnit.AllItems) = 0
