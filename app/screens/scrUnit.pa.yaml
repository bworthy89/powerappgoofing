# Screen — Unit  (GENERATED by scripts/gen_unit.py — edit the generator)
#
# One unit inside a solution: what build it is on, what was noted about it, and its
# documents. Shares its band, version hero, config panel and document lists with
# scrSolution through scripts/screen_parts.py.
#
# varInstallation is the UNIT installation on this screen, not the solution. The back
# button restores the parent before navigating, which is the only state juggling here and
# the easiest thing to break without noticing.

Screens:
  scrUnit:
    Properties:
      Fill: =AppDark.Bg
    Children:
      - conRootUnit:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =AppDark.Bg
          Children:
            - recUnitBand:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =56
                  Fill: =AppDark.Brand
            - imgWordmarkUnit:
                Control: Image
                Properties:
                  X: =Parent.Width - Gutter - 96
                  Y: =20
                  Width: =96
                  Height: =15
                  Image: |
                    ="data:image/png;base64,"
            - btnBackUnit:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  Text: ="Solution"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.OnBrand
                  BorderThickness: =0
                  X: =Gutter - 8
                  Y: =6
                  Width: =140
                  Height: =44
                  OnSelect: |
                    =Set(varInstallation, LookUp(TB_Installations, ID = varInstallation.'Parent'.Id)); Navigate(scrSolution, ScreenTransition.CoverRight)

            # The trail is the only thing on this screen saying which site and which machine
            # this unit belongs to. "SDRB250" on its own could be any of them.
            - lblCrumbUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =56 + 20
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =18
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppDark.Muted
                  Wrap: =false
                  AutoHeight: =false
                  Text: |
                    =varCustomer.Title & "  ›  " & LookUp(TB_Products, ID = LookUp(TB_Installations, ID = varInstallation.'Parent'.Id).Product.Id).Title

            - lblTitleUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =lblCrumbUnit.Y + lblCrumbUnit.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =41
                  Text: =LookUp(TB_Products, ID = varInstallation.Product.Id).Title
                  Font: =AppFont
                  Size: =If(IsNarrow, AppType.Title, AppType.Display)
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Fg
                  Wrap: =false
                  AutoHeight: =false
            - lblSubtitleUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =lblTitleUnit.Y + lblTitleUnit.Height
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =22
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.FgSecondary
                  Wrap: =false
                  AutoHeight: =false
                  Text: |
                    =LookUp(TB_Products, ID = varInstallation.Product.Id).'Product Type'.Value & If(varInstallation.Status.Value = "In Service", "", "  ·  " & Lower(varInstallation.Status.Value))

            - cmpVersionUnit:
                Control: CanvasComponent
                ComponentName: cmpVersionChip
                Properties:
                  X: =Gutter
                  Y: |
                    =lblSubtitleUnit.Y + lblSubtitleUnit.Height + Gutter
                  Width: =Min(Parent.Width - (Gutter * 2), 620)
                  Height: =116
                  InstalledVersion: |
                    =Coalesce(varInstallation.'Installed Version', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Software Version')
                  StandardVersion: =Coalesce(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version', "")
                  SourceNote: |
                    =If(!IsBlank(varInstallation.'Installed Version'), "", !IsBlank(LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Software Version'), "  ·  site default for this model", "")

            - conConfigNotesUnit:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: |
                    =cmpVersionUnit.Y + cmpVersionUnit.Height + Gutter
                  Width: =Min(Parent.Width - (Gutter * 2), 620)
                  Height: =92
                  Fill: =AppDark.Surface
                  Visible: =!IsBlank(varInstallation.'Config Notes')
                Children:
                  - lblConfigHeadingUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =20
                        Y: =14
                        Width: =Parent.Width - 40
                        Height: =18
                        Text: ="CONFIGURATION NOTES"
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Bold
                        Color: =AppDark.Muted
                  - lblConfigNotesUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =20
                        Y: =36
                        Width: =Parent.Width - 40
                        Height: =46
                        Text: =varInstallation.'Config Notes'
                        Font: =AppFont
                        Size: =AppType.Body
                        Color: =AppDark.Fg

            - lblDocsHeadingUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: |
                    =Gutter
                  Y: |
                    =conConfigNotesUnit.Y + If(conConfigNotesUnit.Visible, conConfigNotesUnit.Height + Gutter, 0)
                  Width: |
                    =Parent.Width - (Gutter * 2)
                  Height: =22
                  Wrap: =false
                  AutoHeight: =false
                  Text: |
                    ="DOCUMENTATION"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Bold
                  Color: =AppDark.Muted
            - galDocsUnit:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: |
                    =Gutter
                  Y: =lblDocsHeadingUnit.Y + lblDocsHeadingUnit.Height + 10
                  Width: |
                    =Parent.Width - (Gutter * 2)
                  Height: |
                    =Min(CountRows(galDocsUnit.AllItems), 4) * 60
                  TemplateSize: =60
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: |
                    =CountRows(galDocsUnit.AllItems) > 0
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References,
                            Product.Id = varInstallation.Product.Id,
                            Section.Value = "Documentation",
                            Or(IsBlank(Customer), Customer.Id = varCustomer.ID)
                        ),
                        "TBFeatured",
                        SortOrder.Descending
                    )
                Children:
                  - recDocsRailUnit:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =3
                        Height: =Parent.TemplateHeight - 1
                        Fill: =If(ThisItem.Featured = true, AppDark.Accent, AppDark.Line)
                  - lblDocsTitleUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16
                        Y: =9
                        Width: =Parent.TemplateWidth - 32
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppDark.Faint, AppDark.Fg)
                        Wrap: =false
                        AutoHeight: =false
                  - lblDocsTypeUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16
                        Y: =32
                        Width: =(Parent.TemplateWidth - 32) * 0.6
                        Height: =18
                        Text: |
                          =ThisItem.'Reference Type'.Value & "  ·  " & LookUp(TB_Products, ID = ThisItem.Product.Id).Title & If(IsBlank(ThisItem.Customer.Value), "", "  ·  this customer")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppDark.Muted
                        Wrap: =false
                        AutoHeight: =false
                  - lblDocsCheckedUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16 + ((Parent.TemplateWidth - 32) * 0.6)
                        Y: =32
                        Width: =(Parent.TemplateWidth - 32) * 0.4
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppDark.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppDark.Warn,
                              AppDark.Ok
                          )
                  - recDocsRuleUnit:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =59
                        Width: =Parent.TemplateWidth
                        Height: =1
                        Fill: =AppDark.Line
                  - galDocsHitUnit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Launch(ThisItem.URL)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(255, 255, 255, 0.06)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent
            - lblNoDocsUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: |
                    =Gutter
                  Y: =galDocsUnit.Y
                  Width: |
                    =Parent.Width - (Gutter * 2)
                  Height: =40
                  Text: ="No documentation is on file for this unit."
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.Muted
                  Visible: |
                    =CountRows(galDocsUnit.AllItems) = 0

            - lblFirmwareHeadingUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: |
                    =Gutter
                  Y: |
                    =galDocsUnit.Y + Max(galDocsUnit.Height, 40) + Gutter
                  Width: |
                    =Parent.Width - (Gutter * 2)
                  Height: =22
                  Wrap: =false
                  AutoHeight: =false
                  Text: |
                    ="FIRMWARE & DOWNLOADS"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Bold
                  Color: =AppDark.Muted
            - galFirmwareUnit:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: |
                    =Gutter
                  Y: =lblFirmwareHeadingUnit.Y + lblFirmwareHeadingUnit.Height + 10
                  Width: |
                    =Parent.Width - (Gutter * 2)
                  Height: |
                    =Min(CountRows(galFirmwareUnit.AllItems), 4) * 60
                  TemplateSize: =60
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: |
                    =CountRows(galFirmwareUnit.AllItems) > 0
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References,
                            Product.Id = varInstallation.Product.Id,
                            Section.Value = "Firmware & Downloads",
                            Or(IsBlank(Customer), Customer.Id = varCustomer.ID)
                        ),
                        "TBFeatured",
                        SortOrder.Descending
                    )
                Children:
                  - recFirmwareRailUnit:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =3
                        Height: =Parent.TemplateHeight - 1
                        Fill: =If(ThisItem.Featured = true, AppDark.Accent, AppDark.Line)
                  - lblFirmwareTitleUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16
                        Y: =9
                        Width: =Parent.TemplateWidth - 32
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppDark.Faint, AppDark.Fg)
                        Wrap: =false
                        AutoHeight: =false
                  - lblFirmwareTypeUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16
                        Y: =32
                        Width: =(Parent.TemplateWidth - 32) * 0.6
                        Height: =18
                        Text: |
                          =ThisItem.'Reference Type'.Value & "  ·  " & LookUp(TB_Products, ID = ThisItem.Product.Id).Title & If(IsBlank(ThisItem.Customer.Value), "", "  ·  this customer")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppDark.Muted
                        Wrap: =false
                        AutoHeight: =false
                  - lblFirmwareCheckedUnit:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16 + ((Parent.TemplateWidth - 32) * 0.6)
                        Y: =32
                        Width: =(Parent.TemplateWidth - 32) * 0.4
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppDark.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppDark.Warn,
                              AppDark.Ok
                          )
                  - recFirmwareRuleUnit:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =59
                        Width: =Parent.TemplateWidth
                        Height: =1
                        Fill: =AppDark.Line
                  - galFirmwareHitUnit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Launch(ThisItem.URL)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(255, 255, 255, 0.06)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent
            - lblNoFirmwareUnit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: |
                    =Gutter
                  Y: =galFirmwareUnit.Y
                  Width: |
                    =Parent.Width - (Gutter * 2)
                  Height: =40
                  Text: ="No firmware or downloads are on file for this unit."
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.Muted
                  Visible: |
                    =CountRows(galFirmwareUnit.AllItems) = 0
