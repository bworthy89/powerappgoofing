# Screen — Customer overview  (GENERATED by scripts/gen_customer_overview.py)
#
# What a site has. See the generator docstring for the one real design change: the nested
# per-card unit gallery is replaced by a summary line, trading one tap for the ability to
# see every solution at a site at once.
#
# varCustomer is set by whoever navigated here. Solutions are installations with no Parent;
# units are installations whose Parent is a solution.

Screens:
  scrCustomerOverview:
    Properties:
      Fill: =AppDark.Bg
    Children:
      - conRootOvw:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =AppDark.Bg
          Children:
            - recOvwBand:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =56
                  Fill: =AppDark.Brand
            - imgWordmarkOvw:
                Control: Image
                Properties:
                  X: =Parent.Width - Gutter - 96
                  Y: =20
                  Width: =96
                  Height: =15
                  Image: |
                    ="data:image/png;base64,"
            - btnBackOvw:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  Text: ="Customers"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.OnBrand
                  BorderThickness: =0
                  X: =Gutter - 8
                  Y: =6
                  Width: =140
                  Height: =44
                  OnSelect: |
                    =Navigate(scrCustomers, ScreenTransition.CoverRight)

            - lblTitleOvw:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =56 + 24
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =41
                  Text: =varCustomer.Title
                  Font: =AppFont
                  Size: =If(IsNarrow, AppType.Title, AppType.Display)
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Fg
                  Wrap: =false
                  AutoHeight: =false
            # The count is the first thing worth knowing about a site and it was not shown
            # anywhere before - you had to scroll the cards and add them up yourself.
            - lblSubtitleOvw:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =lblTitleOvw.Y + lblTitleOvw.Height
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =22
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.FgSecondary
                  Wrap: =false
                  AutoHeight: =false
                  Text: |
                    =CountRows(Filter(TB_Installations, Customer.Id = varCustomer.ID, IsBlank(ThisRecord.'Parent'), Status.Value <> "Retired")) & " solution(s) on site" & If(IsBlank(varCustomer.Description), "", "  ·  " & varCustomer.Description)

            - conSupportNotes:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: =lblSubtitleOvw.Y + lblSubtitleOvw.Height + Gutter
                  Width: =Min(Parent.Width - (Gutter * 2), 620)
                  Height: =92
                  Fill: =AppDark.Surface
                  Visible: =!IsBlank(varCustomer.'Support Notes')
                Children:
                  - lblSupportNotesHeading:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =20
                        Y: =14
                        Width: =Parent.Width - 40
                        Height: =18
                        Text: ="SUPPORT NOTES"
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Bold
                        Color: =AppDark.Muted
                  - lblSupportNotes:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =20
                        Y: =36
                        Width: =Parent.Width - 40
                        Height: =46
                        Text: =varCustomer.'Support Notes'
                        Font: =AppFont
                        Size: =AppType.Body
                        Color: =AppDark.Fg

            - lblSolutionsHeading:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =conSupportNotes.Y + If(conSupportNotes.Visible, conSupportNotes.Height + Gutter, 0)
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =22
                  Text: ="SOLUTIONS"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Bold
                  Color: =AppDark.Muted
            - galSolutions:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: =lblSolutionsHeading.Y + lblSolutionsHeading.Height + 10
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =Max(Parent.Height - (lblSolutionsHeading.Y + lblSolutionsHeading.Height + 10) - Gutter, 88)
                  TemplateSize: =100
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_Installations,
                            Customer.Id = varCustomer.ID,
                            IsBlank(ThisRecord.'Parent'),
                            Status.Value <> "Retired"
                        ),
                        "Title",
                        SortOrder.Ascending
                    )
                  OnSelect: |
                    =Set(varInstallation, ThisItem);
                    Navigate(scrSolution, ScreenTransition.Cover)
                Children:
                  # The chamfered card. Its width is interpolated into the SVG twice - once
                  # for the attributes, once for the path - because a viewBox that does not
                  # track the rendered box smears the chamfer as the window resizes.
                  - imgCardOvw:
                      Control: Image
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =88
                        Image: |
                          ="data:image/svg+xml;utf8, " & EncodeUrl(
                              "<svg xmlns='http://www.w3.org/2000/svg' width='" & Round(Parent.TemplateWidth, 0) & "' height='88' viewBox='0 0 " & Round(Parent.TemplateWidth, 0) & " 88' preserveAspectRatio='none'>" &
                              "<path d='M0 0 H" & Round(Parent.TemplateWidth - 16, 0) & " L" & Round(Parent.TemplateWidth, 0) & " 16 V88 H0 Z' fill='#171A21' stroke='#2A2F3A' stroke-width='1'/>" &
                              "</svg>"
                          )
                  # The effective version is a non-delegable LookUp per row, and the card
                  # formulas below reference it a dozen times. Evaluated once here and read
                  # back, the same parking idiom scrCustomers uses for its check count.
                  - lblEffVerOvw:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =1
                        Height: =1
                        Visible: =false
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppDark.Muted
                        Text: |
                          =Coalesce(ThisItem.'Installed Version', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Software Version')

                  - recCardRailOvw:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =4
                        Height: =88
                        Fill: |
                          =If(
                              IsBlank(lblEffVerOvw.Text),
                              AppDark.Line,
                              (!IsBlank(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified')) && RoundDown(DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) >= 12),
                              AppDark.Warn,
                              AppDark.Muted
                          )
                  - lblModel:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =20
                        Y: =18
                        Width: =(Parent.TemplateWidth - 40) * 0.55
                        Height: =26
                        Text: =LookUp(TB_Products, ID = ThisItem.Product.Id).Title
                        Font: =AppFont
                        Size: =AppType.Heading
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Fg
                        Wrap: =false
                        AutoHeight: =false
                  # Family, unit count, and how many of those units nobody has confirmed
                  # lately. That count is the only thing on this screen not derivable by
                  # looking, so it is the only part allowed to shout.
                  - lblCardMetaOvw:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =20
                        Y: =46
                        Width: =(Parent.TemplateWidth - 40) * 0.62
                        Height: =20
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =LookUp(TB_Products, ID = ThisItem.Product.Id).Family.Value & "  ·  " & CountRows(Filter(TB_Installations As U, U.'Parent'.Id = ThisItem.ID, U.Status.Value <> "Retired")) & " unit(s)" & If(CountRows(Filter(TB_Installations As U, U.'Parent'.Id = ThisItem.ID, U.Status.Value <> "Retired", (IsBlank(If(!IsBlank(U.'Installed Version'), U.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = U.Product.Id).'Last Verified')) || RoundDown(DateDiff(If(!IsBlank(U.'Installed Version'), U.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = U.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) >= 12))) > 0, "  ·  " & CountRows(Filter(TB_Installations As U, U.'Parent'.Id = ThisItem.ID, U.Status.Value <> "Retired", (IsBlank(If(!IsBlank(U.'Installed Version'), U.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = U.Product.Id).'Last Verified')) || RoundDown(DateDiff(If(!IsBlank(U.'Installed Version'), U.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = U.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) >= 12))) & " to check", "") & If(ThisItem.Status.Value = "In Service", "", "  ·  " & Lower(ThisItem.Status.Value))
                        Color: |
                          =If(CountRows(Filter(TB_Installations As U, U.'Parent'.Id = ThisItem.ID, U.Status.Value <> "Retired", (IsBlank(If(!IsBlank(U.'Installed Version'), U.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = U.Product.Id).'Last Verified')) || RoundDown(DateDiff(If(!IsBlank(U.'Installed Version'), U.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = U.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) >= 12))) > 0, AppDark.Warn, AppDark.Muted)
                  # Right-aligned so versions form one column down the list, the same
                  # treatment as the unit rows on scrSolution.
                  - lblCardVerOvw:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =20 + ((Parent.TemplateWidth - 40) * 0.55)
                        Y: =30
                        Width: =(Parent.TemplateWidth - 40) * 0.45 - 12
                        Height: =26
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =If(
                              IsBlank(lblEffVerOvw.Text),
                              "not recorded",
                              lblEffVerOvw.Text
                          )
                        Color: |
                          =If(
                              IsBlank(lblEffVerOvw.Text),
                              AppDark.Faint,
                              AppDark.Fg
                          )
                  # The date under the number, matching the unit rows on scrSolution.
                  - lblCardAgeOvw:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =20 + ((Parent.TemplateWidth - 40) * 0.55)
                        Y: =58
                        Width: =(Parent.TemplateWidth - 40) * 0.45 - 12
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =If(IsBlank(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified')), "never verified", DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) < 1, "verified today", DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) < 2, "verified yesterday", DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) < 14, "verified " & DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) & " days ago", DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) < 61, "verified " & RoundDown(DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 7, 0) & " weeks ago", "verified " & RoundDown(DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) & " months ago")
                        Color: |
                          =If((!IsBlank(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified')) && RoundDown(DateDiff(If(!IsBlank(ThisItem.'Installed Version'), ThisItem.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = ThisItem.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) >= 12), AppDark.Warn, AppDark.Muted)
                  - galSolutionsHit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =88
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(106, 115, 230, 0.10)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent
            - lblNoSolutions:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =galSolutions.Y
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Text: ="No active solutions are recorded for this customer."
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.Muted
                  Visible: =CountRows(galSolutions.AllItems) = 0
