            - btnSaveEdit:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  Icon: ="Save"
                  Layout: =ButtonLayout.IconBefore
                  OnSelect: |
                    =IfError(
                        If(varAdminList = "Cust",
                            Patch(TB_Customers,
                                If(varAdminNew, Defaults(TB_Customers), varRecCust),
                                {
                                    Title: txtTitleCust.Text,
                                    Description: txtDescriptionCust.Text,
                                    'Support Notes': txtSupportNotesCust.Text,
                                    Active: tglActiveCust.Checked
                                }
                            )
                        );
                        If(varAdminList = "Prod",
                            Set(varSavedProd, Patch(TB_Products,
                                If(varAdminNew, Defaults(TB_Products), varRecProd),
                                {
                                    Title: txtTitleProd.Text,
                                    'Product Type': { Value: ddProductTypeProd.Selected.Value },
                                    Family: { Value: ddFamilyProd.Selected.Value },
                                    'Current Standard Version': txtStdVersionProd.Text,
                                    Description: txtDescriptionProd.Text,
                                    Active: tglActiveProd.Checked
                                }
                            ))
                        );
                        If(varAdminList = "Inst",
                            Set(varSavedInst, Patch(TB_Installations,
                                If(varAdminNew, Defaults(TB_Installations), varRecInst),
                                {
                                    Title: txtTitleInst.Text,
                                    Customer: If(IsBlank(ddCustomerInst.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddCustomerInst.Selected.ID, Value: ddCustomerInst.Selected.Title }),
                                    Product: If(IsBlank(ddProductInst.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddProductInst.Selected.ID, Value: ddProductInst.Selected.Title }),
                                    'Parent': If(IsBlank(ddParentInst.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddParentInst.Selected.ID, Value: ddParentInst.Selected.Title }),
                                    'Installed Version': txtInstVersionInst.Text,
                                    Status: { Value: ddStatusInst.Selected.Value },
                                    'Config Notes': txtConfigNotesInst.Text,
                                    'Last Verified': dtpLastVerifiedInst.SelectedDate
                                }
                            ))
                        );
                        If(varAdminList = "SolU",
                            Patch(TB_SolutionUnits,
                                If(varAdminNew, Defaults(TB_SolutionUnits), varRecSolU),
                                {
                                    Title: txtTitleSolU.Text,
                                    Solution: If(IsBlank(ddSolutionSolU.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddSolutionSolU.Selected.ID, Value: ddSolutionSolU.Selected.Title }),
                                    Unit: If(IsBlank(ddUnitSolU.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddUnitSolU.Selected.ID, Value: ddUnitSolU.Selected.Title }),
                                    Standard: tglStandardSolU.Checked
                                }
                            )
                        );
                        If(varAdminList = "SwVer",
                            Patch(TB_SoftwareVersions,
                                If(varAdminNew, Defaults(TB_SoftwareVersions), varRecSwVer),
                                {
                                    Title: txtTitleSwVer.Text,
                                    Customer: If(IsBlank(ddCustomerSwVer.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddCustomerSwVer.Selected.ID, Value: ddCustomerSwVer.Selected.Title }),
                                    Product: If(IsBlank(ddProductSwVer.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddProductSwVer.Selected.ID, Value: ddProductSwVer.Selected.Title }),
                                    'Software Version': txtSwVersionSwVer.Text,
                                    'Last Verified': dtpLastVerifiedSwVer.SelectedDate
                                }
                            )
                        );
                        If(varAdminList = "Ref",
                            Patch(TB_References,
                                If(varAdminNew, Defaults(TB_References), varRecRef),
                                {
                                    Title: txtTitleRef.Text,
                                    Product: If(IsBlank(ddProductRef.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddProductRef.Selected.ID, Value: ddProductRef.Selected.Title }),
                                    Customer: If(IsBlank(ddCustomerRef.Selected), Blank(), { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: ddCustomerRef.Selected.ID, Value: ddCustomerRef.Selected.Title }),
                                    Section: { Value: ddSectionRef.Selected.Value },
                                    'Reference Type': { Value: ddRefTypeRef.Selected.Value },
                                    URL: txtURLRef.Text,
                                    Version: txtVersionRef.Text,
                                    Featured: tglFeaturedRef.Checked,
                                    'Last Checked': dtpLastCheckedRef.SelectedDate
                                }
                            )
                        );
