            - btnSaveEdit:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  Icon: ="Save"
                  Layout: =ButtonLayout.IconBefore
                  OnSelect: |
                    =IfError(
                        If(varAdminList = "Cust",
                            Patch(TB_Customers,
                                If(varAdminNew, Defaults(TB_Customers), varRecCust),
                                {
                                    Title: txtTitleCust.Text,
                                    Description: txtDescriptionCust.Text,
                                    'Support Notes': txtSupportNotesCust.Text,
                                    Active: tglActiveCust.Checked
                                }
                            )
                        );
                        If(varAdminList = "Prod",
                            Patch(TB_Products,
                                If(varAdminNew, Defaults(TB_Products), varRecProd),
                                {
                                    Title: txtTitleProd.Text,
                                    'Product Type': { Value: ddProductTypeProd.Selected.Value },
                                    Family: { Value: ddFamilyProd.Selected.Value },
                                    'Current Standard Version': txtStdVersionProd.Text,
                                    Description: txtDescriptionProd.Text,
                                    Active: tglActiveProd.Checked
                                }
                            )
                        );
                        If(varAdminList = "Inst",
                            Patch(TB_Installations,
                                If(varAdminNew, Defaults(TB_Installations), varRecInst),
                                {
                                    Title: txtTitleInst.Text,
                                    Customer: If(IsBlank(ddCustomerInst.Selected), Blank(), ddCustomerInst.Selected),
                                    Product: If(IsBlank(ddProductInst.Selected), Blank(), ddProductInst.Selected),
                                    'Parent': If(IsBlank(ddParentInst.Selected), Blank(), ddParentInst.Selected),
                                    'Installed Version': txtInstVersionInst.Text,
                                    Status: { Value: ddStatusInst.Selected.Value },
                                    'Config Notes': txtConfigNotesInst.Text
                                }
                            )
                        );
                        If(varAdminList = "SolU",
                            Patch(TB_SolutionUnits,
                                If(varAdminNew, Defaults(TB_SolutionUnits), varRecSolU),
                                {
                                    Title: txtTitleSolU.Text,
                                    Solution: If(IsBlank(ddSolutionSolU.Selected), Blank(), ddSolutionSolU.Selected),
                                    Unit: If(IsBlank(ddUnitSolU.Selected), Blank(), ddUnitSolU.Selected),
                                    Standard: tglStandardSolU.Checked
                                }
                            )
                        );
                        If(varAdminList = "Ref",
                            Patch(TB_References,
                                If(varAdminNew, Defaults(TB_References), varRecRef),
                                {
                                    Title: txtTitleRef.Text,
                                    Product: If(IsBlank(ddProductRef.Selected), Blank(), ddProductRef.Selected),
                                    Customer: If(IsBlank(ddCustomerRef.Selected), Blank(), ddCustomerRef.Selected),
                                    Section: { Value: ddSectionRef.Selected.Value },
                                    'Reference Type': { Value: ddRefTypeRef.Selected.Value },
                                    URL: txtURLRef.Text,
                                    Version: txtVersionRef.Text,
                                    Featured: tglFeaturedRef.Checked
                                }
                            )
                        );
                        Set(varEditError, "");
                        Navigate(scrAdmin, ScreenTransition.UnCoverRight),
                        Set(varEditError, FirstError.Message)
                    )
