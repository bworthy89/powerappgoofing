# Generated by scripts/gen_form.py - create / edit any TB_* record.
# Deliberately built from Classic inputs + Patch(), NOT Form + SubmitForm:
# describe_control returns HTTP 500 for Form and DataCard, so their
# properties cannot be verified and must not be guessed at.
Screens:
  scrEditForm:
    Properties:
      Fill: =AppDark.Bg
      OnVisible: =Set(varConfirmDelete, false)
    Children:
      - conRootEdit:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =AppDark.Bg
            Height: =Parent.Height
            Width: =ContentWidth
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
          Children:
            # Brand continuity with the band on scrHome. 3px at Y=0, above all screen
            # content, which starts at Y=Gutter - so no existing Y arithmetic moves.
            - recEditBrandRule:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =3
                  Fill: =AppDark.Accent
            - btnBackEdit:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="Cancel"
                  Layout: =ButtonLayout.IconBefore
                  BorderThickness: =0
                  Color: =AppDark.Accent
                  Font: =AppFont
                  Height: =28
                  OnSelect: =Navigate(scrAdmin, ScreenTransition.CoverRight)
                  Size: =AppType.Small
                  Text: ="Cancel"
                  Width: =Gutter * 8
                  X: =Gutter
                  Y: =Gutter
            - lblTitleEdit:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Font: =AppFont
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =AppType.Title
                  Text: =If(varAdminNew, "New ", "Edit ") & Switch(varAdminList, "Cust", "customer", "Prod", "product", "Inst", "installation", "SolU", "solution unit", "Ref", "reference", "record")
                  Wrap: =false
                  AutoHeight: =false
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =Gutter + 34
            - lblCapTitleCust:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Name"
                  Color: =AppDark.Muted
                  Font: =AppFont
