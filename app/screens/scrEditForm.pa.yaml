                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =16
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =552
                  Visible: =varAdminList = "Ref"
            - txtVersionRef:
                Control: Classic/TextInput
                Properties:
                  Default: =If(varAdminNew, "", varRecRef.Version)
                  Mode: =TextMode.SingleLine
                  HintText: =""
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Color: =AppTheme.Fg
                  Fill: =AppTheme.Surface
                  Font: =AppFont
                  Size: =AppType.Body
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =570
                  Visible: =varAdminList = "Ref"
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblCapFeaturedRef:
                Control: Label
                Properties:
                  Text: ="Featured"
                  Color: =AppTheme.Muted
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =16
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =624
                  Visible: =varAdminList = "Ref"
            - tglFeaturedRef:
                Control: Classic/Toggle
                Properties:
                  Default: =If(varAdminNew, false, varRecRef.Featured)
                  Font: =AppFont
                  Size: =AppType.Body
                  Height: =36
                  Width: =110
                  X: =Gutter
                  Y: =642
                  Visible: =varAdminList = "Ref"
                  TrueFill: =AppTheme.Ok
                  FalseFill: =AppTheme.Faint
            - btnSaveEdit:
                Control: Classic/Button
                Properties:
                  OnSelect: |
                    =IfError(
                        If(varAdminList = "Cust",
                            Patch(TB_Customers,
                                If(varAdminNew, Defaults(TB_Customers), varRecCust),
                                {
                                    Title: txtTitleCust.Text,
                                    Description: txtDescriptionCust.Text,
                                    'Support Notes': txtSupportNotesCust.Text,
                                    Active: tglActiveCust.Value
                                }
                            )
                        );
                        If(varAdminList = "Prod",
                            Patch(TB_Products,
                                If(varAdminNew, Defaults(TB_Products), varRecProd),
                                {
                                    Title: txtTitleProd.Text,
                                    'Product Type': { Value: ddProductTypeProd.Selected.Value },
                                    Family: { Value: ddFamilyProd.Selected.Value },
                                    'Current Standard Version': txtStdVersionProd.Text,
                                    Description: txtDescriptionProd.Text,
                                    Active: tglActiveProd.Value
                                }
                            )
                        );
                        If(varAdminList = "Inst",
                            Patch(TB_Installations,
                                If(varAdminNew, Defaults(TB_Installations), varRecInst),
                                {
                                    Title: txtTitleInst.Text,
                                    Customer: If(IsBlank(ddCustomerInst.Selected), Blank(), ddCustomerInst.Selected),
                                    Product: If(IsBlank(ddProductInst.Selected), Blank(), ddProductInst.Selected),
                                    'Parent': If(IsBlank(ddParentInst.Selected), Blank(), ddParentInst.Selected),
                                    'Installed Version': txtInstVersionInst.Text,
                                    Status: { Value: ddStatusInst.Selected.Value },
                                    'Config Notes': txtConfigNotesInst.Text
                                }
                            )
                        );
                        If(varAdminList = "Ref",
                            Patch(TB_References,
                                If(varAdminNew, Defaults(TB_References), varRecRef),
                                {
                                    Title: txtTitleRef.Text,
                                    Product: If(IsBlank(ddProductRef.Selected), Blank(), ddProductRef.Selected),
                                    Customer: If(IsBlank(ddCustomerRef.Selected), Blank(), ddCustomerRef.Selected),
                                    Section: { Value: ddSectionRef.Selected.Value },
                                    'Reference Type': { Value: ddRefTypeRef.Selected.Value },
                                    URL: txtURLRef.Text,
                                    Version: txtVersionRef.Text,
                                    Featured: tglFeaturedRef.Value
                                }
                            )
                        );
                        Set(varEditError, "");
                        Navigate(scrAdmin, ScreenTransition.UnCoverRight),
                        Set(varEditError, FirstError.Message)
                    )
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  Text: ="Save"
                  Fill: =AppTheme.Primary
                  Color: =AppTheme.OnPrimary
                  HoverFill: =AppTheme.PrimaryDark
                  BorderThickness: =0
                  Height: =44
                  Width: =160
                  X: =Gutter
                  Y: =Parent.Height - Gutter - 44
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
            - lblEditError:
                Control: Label
                Properties:
                  Text: =varEditError
                  Color: =RGBA(176, 0, 32, 1)
                  Font: =AppFont
                  Size: =AppType.Small
                  Wrap: =true
                  AutoHeight: =false
                  Height: =44
                  Width: =ContentWidth - (Gutter * 2) - 176
                  X: =Gutter + 176
                  Y: =Parent.Height - Gutter - 44
                  Visible: =!IsBlank(varEditError)
