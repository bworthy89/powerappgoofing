                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =16
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =120
                  Visible: =varAdminList = "Cust"
            - txtTitleCust:
                Control: ModernTextInput
                Properties:
                  Default: =If(varAdminNew, "", varRecCust.Title)
                  Type: =TextInputType.SingleLine
                  Placeholder: =""
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Font: =AppFont
                  Size: =AppType.Body
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =138
