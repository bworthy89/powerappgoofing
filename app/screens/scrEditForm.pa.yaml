            - lblDeleteBlocked:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: |
                    ="Cannot delete: " & (Switch(varAdminList, "Cust", CountRows(Filter(TB_Installations, Customer.Id = varRecCust.ID)) + CountRows(Filter(TB_References, Customer.Id = varRecCust.ID)), "Prod", CountRows(Filter(TB_Installations, Product.Id = varRecProd.ID)) + CountRows(Filter(TB_References, Product.Id = varRecProd.ID)) + CountRows(Filter(TB_SolutionUnits, Solution.Id = varRecProd.ID)) + CountRows(Filter(TB_SolutionUnits, Unit.Id = varRecProd.ID)), "Inst", CountRows(Filter(TB_Installations, 'Parent'.Id = varRecInst.ID)), 0)) & " " & (Switch(varAdminList, "Cust", "installations or documents", "Prod", "installations, documents or solution-unit rows", "Inst", "units attached to it", "")) & " still reference this. Remove those first."
                  Color: =AppDark.Danger
                  Font: =AppFont
                  Size: =AppType.Small
                  Wrap: =true
                  AutoHeight: =false
                  Align: =Align.Right
                  Height: =36
                  Width: =ContentWidth - (Gutter * 2) - 360
                  X: =Gutter + 360
                  Y: =Parent.Height - Gutter - 88
                  Visible: =!varAdminNew && (Switch(varAdminList, "Cust", CountRows(Filter(TB_Installations, Customer.Id = varRecCust.ID)) + CountRows(Filter(TB_References, Customer.Id = varRecCust.ID)), "Prod", CountRows(Filter(TB_Installations, Product.Id = varRecProd.ID)) + CountRows(Filter(TB_References, Product.Id = varRecProd.ID)) + CountRows(Filter(TB_SolutionUnits, Solution.Id = varRecProd.ID)) + CountRows(Filter(TB_SolutionUnits, Unit.Id = varRecProd.ID)), "Inst", CountRows(Filter(TB_Installations, 'Parent'.Id = varRecInst.ID)), 0)) > 0
            - btnDeleteEdit:
                Control: ModernButton
                Properties:
                  Appearance: =If(varConfirmDelete, ButtonAppearance.Primary, ButtonAppearance.Outline)
                  BasePaletteColor: =AppDark.DangerSolid
                  OnSelect: |
                    =If(!varConfirmDelete,
                        Set(varConfirmDelete, true),
                        IfError(
                            Switch(varAdminList,
                                "Cust", Remove(TB_Customers, varRecCust); Refresh(TB_Customers),
                                "Prod", Remove(TB_Products, varRecProd); Refresh(TB_Products),
                                "Inst", Remove(TB_Installations, varRecInst); Refresh(TB_Installations),
                                "SolU", Remove(TB_SolutionUnits, varRecSolU); Refresh(TB_SolutionUnits),
                                "Ref", Remove(TB_References, varRecRef); Refresh(TB_References),
                                Notify("Nothing was selected to delete.", NotificationType.Error)
                            );
                            Set(varConfirmDelete, false);
                            Notify("Deleted.", NotificationType.Success);
                            Navigate(scrAdmin, ScreenTransition.UnCoverRight),
                            Notify("Could not delete: " & FirstError.Message, NotificationType.Error);
                            Set(varConfirmDelete, false)
                        )
                    )
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  Text: =If(varConfirmDelete, "Confirm delete", "Delete")
