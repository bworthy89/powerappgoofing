# Generated by scripts/gen_form.py - create / edit any TB_* record.
# Deliberately built from Classic inputs + Patch(), NOT Form + SubmitForm:
# describe_control returns HTTP 500 for Form and DataCard, so their
# properties cannot be verified and must not be guessed at.
Screens:
  scrEditForm:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRootEdit:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =AppTheme.Bg
            Height: =Parent.Height
            Width: =ContentWidth
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
          Children:
            - btnBackEdit:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =AppTheme.Primary
                  Fill: =AppTheme.Bg
                  Font: =AppFont
                  Height: =28
                  HoverColor: =AppTheme.PrimaryDark
                  HoverFill: =AppTheme.Sunken
                  OnSelect: =Navigate(scrAdmin, ScreenTransition.CoverRight)
                  Size: =AppType.Small
                  Text: ="<  Cancel"
                  Width: =Gutter * 8
                  X: =Gutter
                  Y: =Gutter
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
            - lblTitleEdit:
                Control: Label
                Properties:
                  Color: =AppTheme.Fg
                  Font: =AppFont
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =AppType.Title
                  Text: =If(varAdminNew, "New ", "Edit ") & Switch(varAdminList, "Cust", "customer", "Prod", "product", "Inst", "installation", "Ref", "reference", "record")
                  Wrap: =false
                  AutoHeight: =false
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =Gutter + 34
            - lblCapTitleCust:
                Control: Label
                Properties:
                  Text: ="Name"
                  Color: =AppTheme.Muted
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =16
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =120
                  Visible: =varAdminList = "Cust"
            - txtTitleCust:
                Control: Classic/TextInput
                Properties:
                  Default: =If(varAdminNew, "", varRecCust.Title)
                  Mode: =TextMode.SingleLine
                  HintText: =""
                  BorderColor: =AppTheme.Line
