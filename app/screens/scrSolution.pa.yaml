# Screen — Solution
# Answers one question: how is this solution running compared to catalogue. Reached from
# scrCustomerOverview with varInstallation already set to a TB_Installations row whose
# Parent is blank (a solution, not a unit) and varCustomer already set to the whole
# TB_Customers record it belongs to. Shows, top to bottom: the installed version against
# the catalogue's current standard version for this product, what is non-standard about
# how this customer runs it (Config Notes, card hidden when blank), the units inside the
# solution (child TB_Installations rows, tapping one hands off to scrUnit), and the
# documents that cover the system — split into Documentation and Firmware & Downloads,
# each gallery showing universal references (no Customer set) together with this
# customer's own exceptions in one list.
#
# Version pair uses = or ≠ only — never a directional arrow, never "upgrade to". ≠ is
# U+2260 and may not render in the Power Apps mobile player; if it shows as a box in
# Studio, substitute the literal string "vs" for "≠" in lblSeparator.Text below. A blank
# installed version is a third state, "not recorded" — never counted as current or off
# standard. A blank catalogue standard suppresses the currency badge (rectCurrency /
# lblCurrency) entirely, the same way scrCustomerOverview suppresses its card badge.
#
# A row with a blank URL must be visible but not tappable. Gallery.DisplayMode is a
# screen-scoped scalar and the ThisItem token does not resolve inside it (Studio would
# reject it as not recognized), so this is done with two row-scoped constructs instead:
# OnSelect guards the Launch, and the row's title label dims when URL is blank. No
# DisplayMode property appears on either gallery.
#
# lblChecked and lblException are named per the brief as a role, not a literal single
# control — each gallery needs its own instance (a screen cannot have two controls named
# lblChecked), so they appear here as lblDocsChecked/lblDocsException and
# lblFirmwareChecked/lblFirmwareException, with the brief's formulas carried over
# unchanged (both read ThisItem, generic to whichever gallery hosts them).
#
# Tapping a unit sets varInstallation to that unit row and navigates to scrUnit. scrUnit
# does not exist until Task 6 — this reference errors in Studio until then, the same
# accepted condition documented in scrCustomerOverview for its own galUnits.OnSelect.
Screens:
  scrSolution:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRoot:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
            Y: =0
            Width: =ContentWidth
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - btnBack:
                Control: Classic/Button
                Properties:
                  X: =Gutter
                  Y: =Gutter
                  Width: =Gutter * 10
                  Height: =28
                  Text: ="<  Overview"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Fill: =AppTheme.Bg
                  HoverFill: =AppTheme.Sunken
                  PressedFill: =AppTheme.Sunken
                  Color: =AppTheme.Primary
                  HoverColor: =AppTheme.PrimaryDark
                  BorderThickness: =0
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Navigate(scrCustomerOverview, ScreenTransition.CoverRight)
            - lblTitle:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =Gutter + 36
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =32
                  Text: =LookUp(TB_Products, ID = varInstallation.Product.Id).Title
                  Font: =AppFont
                  Size: =AppType.Title
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Fg
            - lblSubtitle:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =Gutter + 72
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: |
                    =LookUp(TB_Products, ID = varInstallation.Product.Id).Family.Value &
                    If(varInstallation.Status.Value = "In Service", "", "  ·  " & Lower(varInstallation.Status.Value))
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
            - conVersion:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: =Gutter + 100
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =112
                  Fill: =AppTheme.Surface
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                Children:
                  - lblVersionHeading:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =12
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =16
                        Text: ="SOFTWARE VERSION"
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Bold
                        Color: =AppTheme.Muted
                  - lblInstalled:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.4
                        Height: =28
                        Align: =Align.Left
                        VerticalAlign: =VerticalAlign.Middle
                        Text: =Coalesce(varInstallation.'Installed Version', "not recorded")
                        Font: =AppFont
                        Size: =AppType.Heading
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Fg
                  - lblSeparator:
                      Control: Label
                      Properties:
                        X: =Gutter + ((Parent.Width - (Gutter * 2)) * 0.4)
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.2
                        Height: =28
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Text: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              "",
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              "",
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              "=",
                              "≠"
                          )
                        Font: =AppFont
                        Size: =AppType.Heading
                        FontWeight: =FontWeight.Bold
                        Color: =AppTheme.Muted
                  - lblStandard:
                      Control: Label
                      Properties:
                        X: =Gutter + ((Parent.Width - (Gutter * 2)) * 0.6)
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.4
                        Height: =28
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Text: =Coalesce(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version', "—")
                        Font: =AppFont
                        Size: =AppType.Heading
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Fg
                  - rectCurrency:
                      Control: Rectangle
                      Properties:
                        X: =Gutter
                        Y: =72
                        Width: =Gutter * 9
                        Height: =24
                        BorderThickness: =0
                        Visible: =!IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version')
                        Fill: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              AppTheme.NeutralLight,
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              AppTheme.NeutralLight,
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              AppTheme.OkLight,
                              AppTheme.WarnLight
                          )
                  - lblCurrency:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =72
                        Width: =Gutter * 9
                        Height: =24
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Fg
                        Visible: =!IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version')
                        Text: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              "not recorded",
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              "",
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              "on standard",
                              "standard " & LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'
                          )
            - conConfigNotes:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: =Gutter + 100 + 112 + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =92
                  Fill: =AppTheme.Surface
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Visible: =!IsBlank(varInstallation.'Config Notes')
                Children:
                  - lblConfigHeading:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =12
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =16
                        Text: ="WHAT'S NON-STANDARD"
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Bold
                        Color: =AppTheme.Muted
                  - lblConfigNotes:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =32
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =52
                        Text: =varInstallation.'Config Notes'
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Fg
            - lblUnitsHeading:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    )
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =24
                  Text: ="Units"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Fg
            - galUnits:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =160
                  TemplateSize: =32
                  TemplatePadding: =4
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(TB_Installations, Parent.Id = varInstallation.ID, Status.Value <> "Retired"),
                        "Title",
                        SortOrder.Ascending
                    )
                  OnSelect: |
                    =Set(varInstallation, ThisItem);
                    Navigate(scrUnit, ScreenTransition.Cover)
                Children:
                  - lblUnitLine:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =24
                        Font: =AppFont
                        Size: =AppType.Small
                        # The "  —  " separator is itself conditional: when Installed Version
                        # is set but the catalogue standard is blank, the badge segment below
                        # evaluates to "" and an unconditional separator would dangle
                        # ("RBW 100  —  "). Suppressed for exactly that case.
                        Text: |
                          =LookUp(TB_Products, ID = ThisItem.Product.Id).Title &
                          If(
                              !IsBlank(ThisItem.'Installed Version') && IsBlank(LookUp(TB_Products, ID = ThisItem.Product.Id).'Current Standard Version'),
                              "",
                              "  —  "
                          ) &
                          If(
                              IsBlank(ThisItem.'Installed Version'),
                              "not recorded",
                              IsBlank(LookUp(TB_Products, ID = ThisItem.Product.Id).'Current Standard Version'),
                              "",
                              ThisItem.'Installed Version' = LookUp(TB_Products, ID = ThisItem.Product.Id).'Current Standard Version',
                              "on standard",
                              "standard " & LookUp(TB_Products, ID = ThisItem.Product.Id).'Current Standard Version'
                          ) &
                          If(ThisItem.Status.Value = "In Service", "", "  ·  " & Lower(ThisItem.Status.Value))
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Installed Version'),
                              AppTheme.Muted,
                              IsBlank(LookUp(TB_Products, ID = ThisItem.Product.Id).'Current Standard Version'),
                              AppTheme.Muted,
                              ThisItem.'Installed Version' = LookUp(TB_Products, ID = ThisItem.Product.Id).'Current Standard Version',
                              AppTheme.Ok,
                              AppTheme.Warn
                          )
            - lblNoUnits:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No units are recorded for this solution."
                  Visible: =CountRows(galUnits.AllItems) = 0
            - lblDocsHeading:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =24
                  Text: ="Documentation"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Fg
            - galDocs:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32
                  Width: =If(scrSolution.Size >= ScreenSize.Medium, (Parent.Width - (Gutter * 3)) / 2, Parent.Width - (Gutter * 2))
                  Height: =180
                  TemplateSize: =52
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References,
                            Product.Id = varInstallation.Product.Id,
                            Section.Value = "Documentation",
                            Or(IsBlank(Customer.Value), IsBlank(Customer.Id), Customer.Id = 0, Customer.Id = varCustomer.ID)
                        ),
                        "Featured",
                        SortOrder.Descending
                    )
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - rectDocsRow:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =0
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =48
                        BorderThickness: =1
                        Text: =""
                        Fill: =If(ThisItem.IsSelected, AppTheme.PrimaryLight, AppTheme.Surface)
                        HoverFill: =AppTheme.Sunken
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =If(ThisItem.IsSelected, AppTheme.Primary, AppTheme.LineSoft)
                        HoverBorderColor: =AppTheme.Line
                        PressedBorderColor: =AppTheme.Primary
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  - lblDocsTitle:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =20
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppTheme.Faint, AppTheme.Fg)
                        Text: =ThisItem.Title
                  - lblDocsType:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.4
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Micro
                        Color: =AppTheme.Muted
                        Text: =ThisItem.'Reference Type'.Value
                  - lblDocsException:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.4)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.25
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Primary
                        Text: =If(IsBlank(ThisItem.Customer.Value), "", "this customer")
                  - lblDocsChecked:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.65)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.35
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Micro
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppTheme.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppTheme.Warn,
                              AppTheme.Ok
                          )
            - lblNoDocs:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No documentation is on file for this system."
                  Visible: =CountRows(galDocs.AllItems) = 0
            - lblFirmwareHeading:
                Control: Label
                Properties:
                  X: =If(scrSolution.Size >= ScreenSize.Medium, galDocs.X + galDocs.Width + Gutter, Gutter)
                  Y: =If(scrSolution.Size >= ScreenSize.Medium, lblDocsHeading.Y, galDocs.Y + galDocs.Height + Gutter)
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32 + 180 + Gutter
                  Width: =If(scrSolution.Size >= ScreenSize.Medium, (Parent.Width - (Gutter * 3)) / 2, Parent.Width - (Gutter * 2))
                  Height: =24
                  Text: ="Firmware & Downloads"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Fg
            - galFirmware:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =lblFirmwareHeading.X
                  Y: =lblFirmwareHeading.Y + lblFirmwareHeading.Height + 8
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32 + 180 + Gutter + 32
                  Width: =lblFirmwareHeading.Width
                  # Floored at 0: conRoot is fixed-height with no scroll idiom proven
                  # anywhere in this kit (GroupContainer here is always ManualLayout — see
                  # scrHome's note on why AutoLayout was rejected as unverified), so a
                  # negative height would clip rather than degrade. The gallery's own
                  # ShowScrollbar handles scrolling through however many rows fit the
                  # floored height; on a screen tall enough for the fixed content above,
                  # this evaluates to the same positive value as before.
                  Height: |
                    =Max(
                        Parent.Height - (
                            If(
                                IsBlank(varInstallation.'Config Notes'),
                                Gutter + 100 + 112 + Gutter,
                                Gutter + 100 + 112 + Gutter + 92 + Gutter
                            ) + 32 + 160 + Gutter + 32 + 180 + Gutter + 32
                        ) - Gutter,
                        0
                    )
                  TemplateSize: =52
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References,
                            Product.Id = varInstallation.Product.Id,
                            Section.Value = "Firmware & Downloads",
                            Or(IsBlank(Customer.Value), IsBlank(Customer.Id), Customer.Id = 0, Customer.Id = varCustomer.ID)
                        ),
                        "Featured",
                        SortOrder.Descending
                    )
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - rectFirmwareRow:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =0
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =48
                        BorderThickness: =1
                        Text: =""
                        Fill: =If(ThisItem.IsSelected, AppTheme.PrimaryLight, AppTheme.Surface)
                        HoverFill: =AppTheme.Sunken
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =If(ThisItem.IsSelected, AppTheme.Primary, AppTheme.LineSoft)
                        HoverBorderColor: =AppTheme.Line
                        PressedBorderColor: =AppTheme.Primary
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  - lblFirmwareTitle:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =20
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppTheme.Faint, AppTheme.Fg)
                        Text: =ThisItem.Title
                  - lblFirmwareType:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.4
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Micro
                        Color: =AppTheme.Muted
                        Text: =ThisItem.'Reference Type'.Value
                  - lblFirmwareException:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.4)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.25
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Primary
                        Text: =If(IsBlank(ThisItem.Customer.Value), "", "this customer")
                  - lblFirmwareChecked:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.65)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.35
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Micro
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppTheme.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppTheme.Warn,
                              AppTheme.Ok
                          )
            - lblNoFirmware:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32 + 180 + Gutter + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No firmware or downloads are on file for this system."
                  Visible: =CountRows(galFirmware.AllItems) = 0
