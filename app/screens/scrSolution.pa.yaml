                    =Max(Parent.Height - (conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0) + 44 + 12) - Gutter, 120)
                  TemplateSize: =60
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: |
                    =varSolTab = "Firmware"
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References As R,
                            R.Section.Value = "Firmware & Downloads",
                            Or(IsBlank(R.Customer), R.Customer.Id = varCustomer.ID),
                            R.Product.Id = varInstallation.Product.Id
                            || CountRows(
                                   Filter(
                                       TB_Installations,
                                       'Parent'.Id = varInstallation.ID,
                                       Status.Value <> "Retired",
