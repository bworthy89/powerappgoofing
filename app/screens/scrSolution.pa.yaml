# Screen — Solution  (GENERATED by scripts/gen_solution.py — edit the generator)
#
# The machine detail screen. See the generator docstring for what was rebuilt and why: the
# version answer is now the headline rather than a footnote, unit rows are scannable columns
# rather than sentences, and vertical positions chain through control references instead of
# repeating a hand-copied arithmetic sum in six places.
#
# varInstallation is the solution installation; varCustomer is the site. Both are set by
# whoever navigated here and are never re-derived on this screen.

Screens:
  scrSolution:
    Properties:
      Fill: =AppDark.Bg
      OnVisible: =Set(varSolTab, "Units")
    Children:
      - conRootSol:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =AppDark.Bg
          Children:
            - recSolBand:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =56
                  Fill: =AppDark.Brand
            - imgWordmarkSol:
                Control: Image
                Properties:
                  X: =Parent.Width - Gutter - 96
                  Y: =20
                  Width: =96
                  Height: =15
                  Image: |
                    ="data:image/png;base64,"
            - btnBackSol:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  Text: ="Back"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.OnBrand
                  BorderThickness: =0
                  X: =Gutter - 8
                  Y: =6
                  Width: =140
                  Height: =44
                  OnSelect: |
                    =Navigate(scrCustomerOverview, ScreenTransition.UnCover)

            - btnEditSol:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Outline
                  Text: ="Edit"
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Accent
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  X: |
                    =If(IsNarrow, Gutter + 0, Gutter + (Parent.Width - (Gutter * 2)) - 236)
                  Y: |
                    =lblTitleSol.Y + If(IsNarrow, 41, 0)
                  Width: |
                    =84
                  Height: =40
                  Visible: |
                    =varIsAdmin
                  OnSelect: |
                    =Set(varStCustomerInst, Blank()); Set(varStProductInst, Blank()); Set(varStParentInst, Blank()); Set(varStSolutionSolU, Blank()); Set(varStUnitSolU, Blank()); Set(varStCustomerSwVer, Blank()); Set(varStProductSwVer, Blank()); Set(varStProductRef, Blank()); Set(varStCustomerRef, Blank()); Set(varRecInst, varInstallation); Set(varAdminList, "Inst"); Set(varAdminNew, false); Set(varAdminReturn, scrSolution); Navigate(scrEditForm, ScreenTransition.Cover)
            - btnAddUnitSol:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Outline
                  Text: ="+  Add a unit"
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Accent
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  X: |
                    =If(IsNarrow, Gutter + 92, Gutter + (Parent.Width - (Gutter * 2)) - 144)
                  Y: |
                    =lblTitleSol.Y + If(IsNarrow, 41, 0)
                  Width: |
                    =136
                  Height: =40
                  Visible: |
                    =varIsAdmin
                  OnSelect: |
                    =Set(varStCustomerInst, Blank()); Set(varStProductInst, Blank()); Set(varStParentInst, Blank()); Set(varStSolutionSolU, Blank()); Set(varStUnitSolU, Blank()); Set(varStCustomerSwVer, Blank()); Set(varStProductSwVer, Blank()); Set(varStProductRef, Blank()); Set(varStCustomerRef, Blank()); Set(varStCustomerInst, LookUp(TB_Customers, ID = varCustomer.ID)); Set(varStParentInst, varInstallation); Set(varRecInst, Defaults(TB_Installations)); Set(varAdminList, "Inst"); Set(varAdminNew, true); Set(varAdminReturn, scrSolution); Navigate(scrEditForm, ScreenTransition.Cover)
            - lblTitleSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =56 + 24
                  Width: =(Parent.Width - (Gutter * 2)) - If(varIsAdmin && !IsNarrow, 244, 0)
                  Height: =41 + If(varIsAdmin && IsNarrow, 48, 0)
                  Text: =LookUp(TB_Products, ID = varInstallation.Product.Id).Title
                  Font: =AppFont
                  Size: =If(IsNarrow, AppType.Title, AppType.Display)
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Fg
                  Wrap: =false
                  AutoHeight: =false
            - lblSubtitleSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =lblTitleSol.Y + lblTitleSol.Height
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =22
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.FgSecondary
                  Wrap: =false
                  AutoHeight: =false
                  Text: |
                    =LookUp(TB_Products, ID = varInstallation.Product.Id).Family.Value & "  ·  " & varCustomer.Title & If(varInstallation.Status.Value = "In Service", "", "  ·  " & Lower(varInstallation.Status.Value))

            - cmpVersionSol:
                Control: CanvasComponent
                ComponentName: cmpVersionChip
                Properties:
                  X: =Gutter
                  Y: |
                    =lblSubtitleSol.Y + lblSubtitleSol.Height + Gutter
                  Width: =Min(Parent.Width - (Gutter * 2), 620)
                  Height: =116
                  ExpectedVersion: |
                    =Coalesce(varInstallation.'Installed Version', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Software Version')
                  VerifiedNote: |
                    =If(IsBlank(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified')), "never verified", DateDiff(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified'), Today(), TimeUnit.Days) < 1, "verified today", DateDiff(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified'), Today(), TimeUnit.Days) < 2, "verified yesterday", DateDiff(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified'), Today(), TimeUnit.Days) < 14, "verified " & DateDiff(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified'), Today(), TimeUnit.Days) & " days ago", DateDiff(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified'), Today(), TimeUnit.Days) < 61, "verified " & RoundDown(DateDiff(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 7, 0) & " weeks ago", "verified " & RoundDown(DateDiff(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) & " months ago")
                  IsStale: |
                    =(!IsBlank(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified')) && RoundDown(DateDiff(If(!IsBlank(varInstallation.'Installed Version'), varInstallation.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) >= 12)
                  SourceNote: |
                    =If(!IsBlank(varInstallation.'Installed Version'), "", !IsBlank(LookUp(TB_SoftwareVersions, Customer.Id = varCustomer.ID && Product.Id = varInstallation.Product.Id).'Software Version'), "  ·  site default for this model", "")

            - conConfigNotesSol:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: |
                    =cmpVersionSol.Y + cmpVersionSol.Height + Gutter
                  Width: =Min(Parent.Width - (Gutter * 2), 620)
                  Height: =92
                  Fill: =AppDark.Surface
                  Visible: =!IsBlank(varInstallation.'Config Notes')
                Children:
                  - lblConfigHeadingSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =20
                        Y: =14
                        Width: =Parent.Width - 40
                        Height: =18
                        Text: ="CONFIGURATION NOTES"
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Bold
                        Color: =AppDark.Muted
                  - lblConfigNotesSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =20
                        Y: =36
                        Width: =Parent.Width - 40
                        Height: =46
                        Text: =varInstallation.'Config Notes'
                        Font: =AppFont
                        Size: =AppType.Body
                        Color: =AppDark.Fg

            - btnTabUnitsSol:
                Control: ModernButton
                Properties:
                  Appearance: |
                    =If(varSolTab = "Units", ButtonAppearance.Primary, ButtonAppearance.Outline)
                  Text: ="Units"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =If(varSolTab = "Units", AppDark.OnBrand, AppDark.Fg)
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Height: =44
                  Width: =(Min(Parent.Width - (Gutter * 2), 620) - 16) / 3
                  X: =Gutter + ((Min(Parent.Width - (Gutter * 2), 620) - 16) / 3 + 8) * 0
                  Y: |
                    =conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varSolTab, "Units")
            - btnTabDocsSol:
                Control: ModernButton
                Properties:
                  Appearance: |
                    =If(varSolTab = "Docs", ButtonAppearance.Primary, ButtonAppearance.Outline)
                  Text: ="Documents"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =If(varSolTab = "Docs", AppDark.OnBrand, AppDark.Fg)
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Height: =44
                  Width: =(Min(Parent.Width - (Gutter * 2), 620) - 16) / 3
                  X: =Gutter + ((Min(Parent.Width - (Gutter * 2), 620) - 16) / 3 + 8) * 1
                  Y: |
                    =conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varSolTab, "Docs")
            - btnTabFirmwareSol:
                Control: ModernButton
                Properties:
                  Appearance: |
                    =If(varSolTab = "Firmware", ButtonAppearance.Primary, ButtonAppearance.Outline)
                  Text: ="Firmware"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =If(varSolTab = "Firmware", AppDark.OnBrand, AppDark.Fg)
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Height: =44
                  Width: =(Min(Parent.Width - (Gutter * 2), 620) - 16) / 3
                  X: =Gutter + ((Min(Parent.Width - (Gutter * 2), 620) - 16) / 3 + 8) * 2
                  Y: |
                    =conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varSolTab, "Firmware")

            # ---- units
            # A row is a unit the MODEL takes, so it may have nothing behind it. That is the
            # point: "do they have a barcode scanner" was unanswerable when the list only
            # showed what happened to be attached, because absent and uncatalogued looked
            # identical.
            # The tab names the section, so this line carries only the exception worth
            # knowing about: something attached here that the model does not list.
            - lblUnitsHeading:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0) + 44 + 12
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppDark.Warn
                  Wrap: =false
                  AutoHeight: =false
                  Visible: |
                    =varSolTab = "Units" && CountRows(Filter(TB_Installations As I, I.'Parent'.Id = varInstallation.ID, I.Status.Value <> "Retired", CountRows(Filter(TB_SolutionUnits, Solution.Id = varInstallation.Product.Id, Unit.Id = I.Product.Id)) = 0)) > 0
                  Text: |
                    =CountRows(Filter(TB_Installations As I, I.'Parent'.Id = varInstallation.ID, I.Status.Value <> "Retired", CountRows(Filter(TB_SolutionUnits, Solution.Id = varInstallation.Product.Id, Unit.Id = I.Product.Id)) = 0)) & " also attached, not on the model's list"
            - galUnitsSol:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: |
                    =conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0) + 44 + 12 + If(lblUnitsHeading.Visible, 26, 0)
                  Width: =Parent.Width - (Gutter * 2)
                  Visible: =varSolTab = "Units"
                  Height: |
                    =Max(Parent.Height - (conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0) + 44 + 12) - Gutter, 120) - If(lblUnitsHeading.Visible, 26, 0)
                  TemplateSize: =56
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  Items: |
                    =Sort(
                        Filter(TB_SolutionUnits, Solution.Id = varInstallation.Product.Id),
                        Unit.Value,
                        SortOrder.Ascending
                    )
                Children:
                  # The rail is the whole point of the row. Four states, same order and same
                  # meaning as the component - change both together.
                  - recUnitRailSol:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =3
                        Height: =Parent.TemplateHeight - 1
                        Fill: |
                          =If(
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)),
                              AppDark.Line,
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version'),
                              AppDark.Muted,
                              (!IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified') && RoundDown(DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) / 30.4375, 0) >= 12),
                              AppDark.Warn,
                              AppDark.Muted
                          )
                  - lblUnitTypeSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16
                        Y: =8
                        Width: =(Parent.TemplateWidth - 32) * 0.55
                        Height: =18
                        Text: =Upper(LookUp(TB_Products, ID = ThisItem.Unit.Id).'Product Type'.Value)
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Muted
                        Wrap: =false
                        AutoHeight: =false
                  - lblUnitModelSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16
                        Y: =27
                        Width: =(Parent.TemplateWidth - 32) * 0.55
                        Height: =22
                        Text: =ThisItem.Unit.Value
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)), AppDark.Faint, AppDark.Fg)
                        Wrap: =false
                        AutoHeight: =false
                  # Right-aligned so the versions form one column down the list, with the
                  # date they were last confirmed directly beneath each one.
                  - lblUnitVerSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16 + ((Parent.TemplateWidth - 32) * 0.55)
                        Y: =10
                        Width: =(Parent.TemplateWidth - 32) * 0.45
                        Height: =22
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =If(
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)),
                              "not recorded",
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version'),
                              "version not recorded",
                              LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version'
                          )
                        Color: |
                          =If(
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)),
                              AppDark.Faint,
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version'),
                              AppDark.Muted,
                              AppDark.Fg
                          )
                  # The date under the number. Without it the version is a bare
                  # assertion; with it a reader can weigh how far to trust it before
                  # driving out. Blank when nothing is fitted - there is no record to date,
                  # and "never verified" would read as a finding about a machine that is
                  # not there.
                  - lblUnitAgeSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16 + ((Parent.TemplateWidth - 32) * 0.55)
                        Y: =32
                        Width: =(Parent.TemplateWidth - 32) * 0.45
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =If(IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)), "", If(IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified'), "never verified", DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) < 1, "verified today", DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) < 2, "verified yesterday", DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) < 14, "verified " & DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) & " days ago", DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) < 61, "verified " & RoundDown(DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) / 7, 0) & " weeks ago", "verified " & RoundDown(DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) / 30.4375, 0) & " months ago"))
                        Color: |
                          =If((!IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified') && RoundDown(DateDiff(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Last Verified', Today(), TimeUnit.Days) / 30.4375, 0) >= 12), AppDark.Warn, AppDark.Muted)
                  - recUnitRuleSol:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =55
                        Width: =Parent.TemplateWidth
                        Height: =1
                        Fill: =AppDark.Line
                  - galUnitsHitSol:
                      Control: Classic/Button
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(255, 255, 255, 0.06)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent
                        OnSelect: |
                          =If(
                              !IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)),
                              Set(varInstallation, LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id));
                              Navigate(scrUnit, ScreenTransition.Cover)
                          )
            - lblNoUnits:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =galUnitsSol.Y
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Text: ="No units are on file for this model. Add them under Admin, Solution units."
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.Muted
                  Visible: |
                    =varSolTab = "Units" && CountRows(Filter(TB_SolutionUnits, Solution.Id = varInstallation.Product.Id)) = 0

            - lblDocsHeadingSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: |
                    =Gutter
                  Y: |
                    =conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0) + 44 + 12
                  Width: |
                    =Parent.Width - (Gutter * 2)
                  Height: =0
                  Visible: =false
                  Wrap: =false
                  AutoHeight: =false
                  Text: |
                    =""
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Bold
                  Color: =AppDark.Muted
            - galDocsSol:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: |
                    =Gutter
                  Y: =lblDocsHeadingSol.Y + 0 + 0
                  Width: |
                    =Parent.Width - (Gutter * 2)
                  Height: |
                    =Max(Parent.Height - (conConfigNotesSol.Y + If(conConfigNotesSol.Visible, conConfigNotesSol.Height + Gutter, 0) + 44 + 12) - Gutter, 120)
                  TemplateSize: =60
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: |
                    =varSolTab = "Docs"
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References As R,
                            R.Section.Value = "Documentation",
                            Or(IsBlank(R.Customer), R.Customer.Id = varCustomer.ID),
                            R.Product.Id = varInstallation.Product.Id
                            || CountRows(
                                   Filter(
                                       TB_Installations,
                                       'Parent'.Id = varInstallation.ID,
                                       Status.Value <> "Retired",
                                       Product.Id = R.Product.Id
                                   )
                               ) > 0
                        ),
                        "TBFeatured",
                        SortOrder.Descending
                    )
                Children:
                  - recDocsRailSol:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =3
                        Height: =Parent.TemplateHeight - 1
                        Fill: =If(ThisItem.Featured = true, AppDark.Accent, AppDark.Line)
                  - lblDocsTitleSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =16
                        Y: =9
                        Width: =Parent.TemplateWidth - 32
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppDark.Faint, AppDark.Fg)
                        Wrap: =false
                        AutoHeight: =false
