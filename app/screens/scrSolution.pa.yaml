                        Height: =18
                        Text: |
                          =ThisItem.'Reference Type'.Value & "  ·  " & LookUp(TB_Products, ID = ThisItem.Product.Id).Title & If(IsBlank(ThisItem.Customer.Value), "", "  ·  this customer")
