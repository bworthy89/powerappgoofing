# Screen — Solution
# Answers one question: how is this solution running compared to catalogue. Reached from
# scrCustomerOverview with varInstallation already set to a TB_Installations row whose
# Parent is blank (a solution, not a unit) and varCustomer already set to the whole
# TB_Customers record it belongs to. Shows, top to bottom: the installed version against
# the catalogue's current standard version for this product, what is non-standard about
# how this customer runs it (Config Notes, card hidden when blank), the units inside the
# solution (child TB_Installations rows, tapping one hands off to scrUnit), and the
# documents that cover the system — split into Documentation and Firmware & Downloads,
# each gallery showing universal references (no Customer set) together with this
# customer's own exceptions in one list.
#
# Version pair uses = or ≠ only — never a directional arrow, never "upgrade to". ≠ is
# U+2260 and may not render in the Power Apps mobile player; if it shows as a box in
# Studio, substitute the literal string "vs" for "≠" in lblSeparatorSol.Text below. A blank
# installed version is a third state, "not recorded" — never counted as current or off
# standard. A blank catalogue standard suppresses the currency badge (rectCurrencySol /
# lblCurrencySol) entirely, the same way scrCustomerOverview suppresses its card badge.
#
# A row with a blank URL must be visible but not tappable. Gallery.DisplayMode is a
# screen-scoped scalar and the ThisItem token does not resolve inside it (Studio would
# reject it as not recognized), so this is done with two row-scoped constructs instead:
# OnSelect guards the Launch, and the row's title label dims when URL is blank. No
# DisplayMode property appears on either gallery.
#
# lblChecked and lblException are named per the brief as a role, not a literal single
# control — each gallery needs its own instance (a screen cannot have two controls named
# lblChecked), so they appear here as lblDocsCheckedSol/lblDocsExceptionSol and
# lblFirmwareCheckedSol/lblFirmwareExceptionSol, with the brief's formulas carried over
# unchanged (both read ThisItem, generic to whichever gallery hosts them).
#
# Tapping a unit sets varInstallation to that unit row and navigates to scrUnit. scrUnit
# does not exist until Task 6 — this reference errors in Studio until then, the same
# accepted condition documented in scrCustomerOverview for its own galUnitsSol.OnSelect.
Screens:
  scrSolution:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRootSol:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
            Y: =0
            Width: =ContentWidth
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - btnBackSol:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  X: =Gutter
                  Y: =Gutter
                  Width: =Gutter * 10
                  Height: =44
                  Text: ="Overview"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppTheme.Primary
                  BorderThickness: =0
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Navigate(scrCustomerOverview, ScreenTransition.CoverRight)
            - lblTitleSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Gutter + 36
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =32
                  Text: =LookUp(TB_Products, ID = varInstallation.Product.Id).Title
                  Font: =AppFont
                  Size: =AppType.Title
                  FontWeight: =FontWeight.Bold
            - lblSubtitleSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Gutter + 72
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =22
                  Text: |
                    =LookUp(TB_Products, ID = varInstallation.Product.Id).Family.Value &
                    If(varInstallation.Status.Value = "In Service", "", "  ·  " & Lower(varInstallation.Status.Value))
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppTheme.FgSecondary
            - conVersionSol:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: =Gutter + 100
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =112
                  Fill: =AppTheme.Surface
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                Children:
                  - lblVersionHeadingSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =12
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =18
                        Text: ="SOFTWARE VERSION"
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Bold
                        Color: =AppTheme.Muted
                  - lblInstalledSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.4
                        Height: =29
                        Align: =Align.Left
                        VerticalAlign: =VerticalAlign.Middle
                        Text: =Coalesce(varInstallation.'Installed Version', "not recorded")
                        Font: =AppFont
                        Size: =AppType.Title
                        FontWeight: =FontWeight.Semibold
                  - lblSeparatorSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter + ((Parent.Width - (Gutter * 2)) * 0.4)
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.2
                        Height: =29
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Text: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              "",
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              "",
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              "=",
                              "≠"
                          )
                        Font: =AppFont
                        Size: =AppType.Title
                        FontWeight: =FontWeight.Bold
                        Color: =AppTheme.Muted
                  - lblStandardSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        X: =Gutter + ((Parent.Width - (Gutter * 2)) * 0.6)
                        Y: =34
                        Width: =(Parent.Width - (Gutter * 2)) * 0.4
                        Height: =29
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Text: =Coalesce(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version', "—")
                        Font: =AppFont
                        Size: =AppType.Title
                        FontWeight: =FontWeight.Semibold
                  - rectCurrencySol:
                      Control: Rectangle
                      Properties:
                        X: =Gutter
                        Y: =72
                        Width: =Gutter * 9
                        Height: =24
                        BorderThickness: =0
                        Visible: =!IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version')
                        Fill: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              AppTheme.NeutralLight,
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              AppTheme.NeutralLight,
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              AppTheme.OkLight,
                              AppTheme.WarnLight
                          )
                  - lblCurrencySol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =72
                        Width: =Gutter * 9
                        Height: =24
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Visible: =!IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version')
                        Text: |
                          =If(
                              IsBlank(varInstallation.'Installed Version'),
                              "not recorded",
                              IsBlank(LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'),
                              "",
                              varInstallation.'Installed Version' = LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version',
                              "on standard",
                              "standard " & LookUp(TB_Products, ID = varInstallation.Product.Id).'Current Standard Version'
                          )
            - conConfigNotesSol:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Gutter
                  Y: =Gutter + 100 + 112 + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =92
                  Fill: =AppTheme.Surface
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Visible: =!IsBlank(varInstallation.'Config Notes')
                Children:
                  - lblConfigHeadingSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =12
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =18
                        Text: ="WHAT'S NON-STANDARD"
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Bold
                        Color: =AppTheme.Muted
                  - lblConfigNotesSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        X: =Gutter
                        Y: =32
                        Width: =Parent.Width - (Gutter * 2)
                        Height: =52
                        Text: =varInstallation.'Config Notes'
                        Font: =AppFont
                        Size: =AppType.Body
            - lblUnitsHeading:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    )
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =24
                  Text: |
                    ="Units" & If(CountRows(Filter(TB_Installations As I, I.'Parent'.Id = varInstallation.ID, I.Status.Value <> "Retired", CountRows(Filter(TB_SolutionUnits, Solution.Id = varInstallation.Product.Id, Unit.Id = I.Product.Id)) = 0)) > 0, "   (" & CountRows(Filter(TB_Installations As I, I.'Parent'.Id = varInstallation.ID, I.Status.Value <> "Retired", CountRows(Filter(TB_SolutionUnits, Solution.Id = varInstallation.Product.Id, Unit.Id = I.Product.Id)) = 0)) & " also attached, not on the model's list)", "")
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
            - galUnitsSol:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =160
                  TemplateSize: =48
                  TemplatePadding: =4
                  ShowScrollbar: =true
                  Items: |
                    =Sort(
                        Filter(TB_SolutionUnits, Solution.Id = varInstallation.Product.Id),
                        Unit.Value,
                        SortOrder.Ascending
                    )
                  # A row is a unit the model can take, so it may have nothing behind it.
                  # Opening one only makes sense when something is installed.
                  OnSelect: |
                    =If(
                        !IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)),
                        Set(varInstallation, LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id));
                        Navigate(scrUnit, ScreenTransition.Cover)
                    )
                Children:
                  - lblUnitLineSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =24
                        Font: =AppFont
                        Size: =AppType.Body
                        # Category first, because the question being asked is usually
                        # "do they have a scanner" rather than "what is an SC 200".
                        # A row with nothing installed says so rather than going blank -
                        # absent and uncatalogued have to look different.
                        Text: |
                          =LookUp(TB_Products, ID = ThisItem.Unit.Id).'Product Type'.Value & "   " &
                          ThisItem.Unit.Value & "   " &
                          If(
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)),
                              "not recorded",
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version'),
                              "version not recorded",
                              IsBlank(LookUp(TB_Products, ID = ThisItem.Unit.Id).'Current Standard Version'),
                              LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version',
                              LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version' = LookUp(TB_Products, ID = ThisItem.Unit.Id).'Current Standard Version',
                              LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version' & "  ·  on standard",
                              LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version' & "  ·  standard " & LookUp(TB_Products, ID = ThisItem.Unit.Id).'Current Standard Version'
                          )
                        Color: |
                          =If(
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id)),
                              AppTheme.Faint,
                              IsBlank(LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version'),
                              AppTheme.Muted,
                              IsBlank(LookUp(TB_Products, ID = ThisItem.Unit.Id).'Current Standard Version'),
                              AppTheme.Muted,
                              LookUp(TB_Installations, 'Parent'.Id = varInstallation.ID && Product.Id = ThisItem.Unit.Id).'Installed Version' = LookUp(TB_Products, ID = ThisItem.Unit.Id).'Current Standard Version',
                              AppTheme.Ok,
                              AppTheme.Warn
                          )
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galUnitsHitSol:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblNoUnits:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppTheme.Muted
                  Text: ="No units are on file for this model. Add them under Admin, Solution units."
                  Visible: =CountRows(Filter(TB_SolutionUnits, Solution.Id = varInstallation.Product.Id)) = 0
            - lblDocsHeadingSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =24
                  Text: ="Documentation"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
            - galDocsSol:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32
                  Width: =If(scrSolution.Size >= ScreenSize.Medium, (Parent.Width - (Gutter * 3)) / 2, Parent.Width - (Gutter * 2))
                  Height: =180
                  TemplateSize: =52
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References As R,
                            R.Section.Value = "Documentation",
                            Or(IsBlank(R.Customer), R.Customer.Id = varCustomer.ID),
                            R.Product.Id = varInstallation.Product.Id
                            || CountRows(
                                   Filter(
                                       TB_Installations,
                                       'Parent'.Id = varInstallation.ID,
                                       Status.Value <> "Retired",
                                       Product.Id = R.Product.Id
                                   )
                               ) > 0
                        ),
                        "TBFeatured",
                        SortOrder.Descending
                    )
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - rectDocsRowSol:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =0
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =48
                        BorderThickness: =1
                        Text: =""
                        Fill: =AppTheme.Surface
                        HoverFill: =AppTheme.Sunken
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =AppTheme.LineSoft
                        HoverBorderColor: =AppTheme.Line
                        PressedBorderColor: =AppTheme.Primary
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  - lblDocsTitleSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =21
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppTheme.Faint, AppTheme.Fg)
                        Text: =ThisItem.Title
                  - lblDocsTypeSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.4
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                        Text: |
                          =ThisItem.'Reference Type'.Value & "  ·  " &
                          LookUp(TB_Products, ID = ThisItem.Product.Id).Title
                  - lblDocsExceptionSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.4)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.25
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Primary
                        Text: =If(IsBlank(ThisItem.Customer.Value), "", "this customer")
                  - lblDocsCheckedSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.65)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.35
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Small
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppTheme.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppTheme.Warn,
                              AppTheme.Ok
                          )
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galDocsHitSol:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblNoDocsSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppTheme.Muted
                  Text: ="No documentation is on file for this system."
                  Visible: =CountRows(galDocsSol.AllItems) = 0
            - lblFirmwareHeadingSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =If(scrSolution.Size >= ScreenSize.Medium, galDocsSol.X + galDocsSol.Width + Gutter, Gutter)
                  Y: =If(scrSolution.Size >= ScreenSize.Medium, lblDocsHeadingSol.Y, galDocsSol.Y + galDocsSol.Height + Gutter)
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32 + 180 + Gutter
                  Width: =If(scrSolution.Size >= ScreenSize.Medium, (Parent.Width - (Gutter * 3)) / 2, Parent.Width - (Gutter * 2))
                  Height: =24
                  Text: ="Firmware & Downloads"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
            - galFirmwareSol:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =lblFirmwareHeadingSol.X
                  Y: =lblFirmwareHeadingSol.Y + lblFirmwareHeadingSol.Height + 8
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32 + 180 + Gutter + 32
                  Width: =lblFirmwareHeadingSol.Width
                  # Floored at 0: conRootSol is fixed-height with no scroll idiom proven
                  # anywhere in this kit (GroupContainer here is always ManualLayout — see
                  # scrHome's note on why AutoLayout was rejected as unverified), so a
                  # negative height would clip rather than degrade. The gallery's own
                  # ShowScrollbar handles scrolling through however many rows fit the
                  # floored height; on a screen tall enough for the fixed content above,
                  # this evaluates to the same positive value as before.
                  Height: |
                    =Max(
                        Parent.Height - (
                            If(
                                IsBlank(varInstallation.'Config Notes'),
                                Gutter + 100 + 112 + Gutter,
                                Gutter + 100 + 112 + Gutter + 92 + Gutter
                            ) + 32 + 160 + Gutter + 32 + 180 + Gutter + 32
                        ) - Gutter,
                        0
                    )
                  TemplateSize: =52
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_References As R,
                            R.Section.Value = "Firmware & Downloads",
                            Or(IsBlank(R.Customer), R.Customer.Id = varCustomer.ID),
                            R.Product.Id = varInstallation.Product.Id
                            || CountRows(
                                   Filter(
                                       TB_Installations,
                                       'Parent'.Id = varInstallation.ID,
                                       Status.Value <> "Retired",
                                       Product.Id = R.Product.Id
                                   )
                               ) > 0
                        ),
                        "TBFeatured",
                        SortOrder.Descending
                    )
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - rectFirmwareRowSol:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =0
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =48
                        BorderThickness: =1
                        Text: =""
                        Fill: =AppTheme.Surface
                        HoverFill: =AppTheme.Sunken
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =AppTheme.LineSoft
                        HoverBorderColor: =AppTheme.Line
                        PressedBorderColor: =AppTheme.Primary
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  - lblFirmwareTitleSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =21
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppTheme.Faint, AppTheme.Fg)
                        Text: =ThisItem.Title
                  - lblFirmwareTypeSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.4
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                        Text: |
                          =ThisItem.'Reference Type'.Value & "  ·  " &
                          LookUp(TB_Products, ID = ThisItem.Product.Id).Title
                  - lblFirmwareExceptionSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.4)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.25
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Primary
                        Text: =If(IsBlank(ThisItem.Customer.Value), "", "this customer")
                  - lblFirmwareCheckedSol:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.65)
                        Y: =24
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.35
                        Height: =18
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Small
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppTheme.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppTheme.Warn,
                              AppTheme.Ok
                          )
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galFirmwareHitSol:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblNoFirmwareSol:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =If(
                        IsBlank(varInstallation.'Config Notes'),
                        Gutter + 100 + 112 + Gutter,
                        Gutter + 100 + 112 + Gutter + 92 + Gutter
                    ) + 32 + 160 + Gutter + 32 + 180 + Gutter + 32
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppTheme.Muted
                  Text: ="No firmware or downloads are on file for this system."
                  Visible: =CountRows(galFirmwareSol.AllItems) = 0
