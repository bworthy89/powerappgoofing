# Screen 3 of 3 — Solution Details
# Same visual language as the guide-viewer Playbooks pages: centered column, white surface,
# hairline cards, tinted pill badges, uppercase section labels, subtle link-style buttons.
# Bound to the exported schema - see 00_Schema_Reference.md. TB_CustomerReferences is a junction
# list, so galSIA and galFirmware join each mapping row to its TB_ProductReferences record with
# a per-row LookUp. Every LookUp aliases the inner list (TB_ProductReferences As Ref) and reaches
# the outer row through an explicit ThisRecord. or ThisItem. qualifier - never an implicit outer
# scope reference, and never AddColumns. Both of those were tried and both failed paste validation.
Screens:
  scrSolutionDetails:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conSolutionPage:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - 1100) / 2, 0)
            Y: =0
            Width: =Min(Parent.Width, 1100)
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - btnBackToToolbox:
                Control: Classic/Button
                Properties:
                  X: =26
                  Y: =28
                  Width: =180
                  Height: =32
                  Text: ="<  Back to solutions"
                  Fill: =AppTheme.Bg
                  HoverFill: =AppTheme.Muted
                  PressedFill: =AppTheme.Muted
                  Color: =AppTheme.Primary
                  HoverColor: =AppTheme.PrimaryDark
                  BorderThickness: =0
                  Size: =11
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: |
                    =Set(varComponent, Blank());
                    Navigate(scrCustomerToolbox, ScreenTransition.Fade)
            - lblSolutionTitle:
                Control: Label
                Properties:
                  X: =32
                  Y: =68
                  Width: =Parent.Width - 64
                  Height: =34
                  Text: =varSolution.Title
                  Color: =AppTheme.Fg
                  Size: =20
                  FontWeight: =FontWeight.Bold
            - lblSolutionSubtitle:
                Control: Label
                Properties:
                  X: =32
                  Y: =102
                  Width: =Parent.Width - 64
                  Height: =22
                  Text: =varCustomer.Title & "  •  " & varSolution.'Deployment Status'.Value
                  Color: =AppTheme.MutedFg
                  Size: =12

            # ---------------- section tabs ----------------
            - btnSecOverview:
                Control: Classic/Button
                Properties:
                  X: =32
                  Y: =138
                  Width: =130
                  Height: =36
                  Text: ="Overview"
                  Fill: =If(varSelectedSection = "Overview", AppTheme.PrimaryLight, AppTheme.Bg)
                  HoverFill: =AppTheme.Muted
                  Color: =If(varSelectedSection = "Overview", AppTheme.PrimaryDark, AppTheme.MutedFg)
                  BorderThickness: =0
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varSelectedSection, "Overview")
            - btnSecSoftware:
                Control: Classic/Button
                Properties:
                  X: =170
                  Y: =138
                  Width: =130
                  Height: =36
                  Text: ="Software"
                  Fill: =If(varSelectedSection = "Software", AppTheme.PrimaryLight, AppTheme.Bg)
                  HoverFill: =AppTheme.Muted
                  Color: =If(varSelectedSection = "Software", AppTheme.PrimaryDark, AppTheme.MutedFg)
                  BorderThickness: =0
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varSelectedSection, "Software")
            - btnSecGuides:
                Control: Classic/Button
                Properties:
                  X: =308
                  Y: =138
                  Width: =130
                  Height: =36
                  Text: ="Guides"
                  Fill: =If(varSelectedSection = "Guides", AppTheme.PrimaryLight, AppTheme.Bg)
                  HoverFill: =AppTheme.Muted
                  Color: =If(varSelectedSection = "Guides", AppTheme.PrimaryDark, AppTheme.MutedFg)
                  BorderThickness: =0
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varSelectedSection, "Guides")
            - btnSecSIA:
                Control: Classic/Button
                Properties:
                  X: =446
                  Y: =138
                  Width: =150
                  Height: =36
                  Text: ="SIA Documents"
                  Fill: =If(varSelectedSection = "SIA", AppTheme.PrimaryLight, AppTheme.Bg)
                  HoverFill: =AppTheme.Muted
                  Color: =If(varSelectedSection = "SIA", AppTheme.PrimaryDark, AppTheme.MutedFg)
                  BorderThickness: =0
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varSelectedSection, "SIA")
            - btnSecFirmware:
                Control: Classic/Button
                Properties:
                  X: =604
                  Y: =138
                  Width: =130
                  Height: =36
                  Text: ="Firmware"
                  Fill: =If(varSelectedSection = "Firmware", AppTheme.PrimaryLight, AppTheme.Bg)
                  HoverFill: =AppTheme.Muted
                  Color: =If(varSelectedSection = "Firmware", AppTheme.PrimaryDark, AppTheme.MutedFg)
                  BorderThickness: =0
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varSelectedSection, "Firmware")

            # ---------------- component rail ----------------
            - lblComponentsLabel:
                Control: Label
                Properties:
                  X: =32
                  Y: =192
                  Width: =260
                  Height: =18
                  Text: ="COMPONENTS"
                  Color: =AppTheme.MutedFg
                  Size: =10
                  FontWeight: =FontWeight.Bold
            - galComponents:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =32
                  Y: =214
                  Width: =260
                  Height: =Parent.Height - 246
                  TemplateSize: =72
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_SolutionComponents,
                            'Customer Solution'.Id = varSolution.ID &&
                            Installed = true
                        ),
                        "Title",
                        SortOrder.Ascending
                    )
                  OnSelect: =Set(varComponent, ThisItem)
                Children:
                  - lblComponentCard:
                      Control: Label
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =64
                        Text: =""
                        Fill: =If(!IsBlank(varComponent) && ThisItem.ID = varComponent.ID, AppTheme.PrimaryLight, AppTheme.Card)
                        BorderColor: =If(!IsBlank(varComponent) && ThisItem.ID = varComponent.ID, AppTheme.Primary, AppTheme.Border)
                        BorderThickness: =1
                  - lblComponentModel:
                      Control: Label
                      Properties:
                        X: =14
                        Y: =10
                        Width: =Parent.TemplateWidth - 28
                        Height: =22
                        Text: =ThisItem.'Component Model'
                        Color: =AppTheme.Fg
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                  - lblComponentRole:
                      Control: Label
                      Properties:
                        X: =14
                        Y: =32
                        Width: =Parent.TemplateWidth - 28
                        Height: =20
                        Text: =ThisItem.'Component Role'
                        Color: =AppTheme.MutedFg
                        Size: =10
            - lblNoComponents:
                Control: Label
                Properties:
                  X: =32
                  Y: =240
                  Width: =260
                  Height: =40
                  Text: ="No installed components recorded."
                  Color: =AppTheme.MutedFg
                  Size: =11
                  Align: =Align.Center
                  Visible: =CountRows(galComponents.AllItems) = 0

            # ---------------- component filter banner ----------------
            - lblFilterBanner:
                Control: Label
                Properties:
                  X: =316
                  Y: =186
                  Width: =Parent.Width - 348
                  Height: =36
                  Text: ="    Filtered by " & varComponent.'Component Model'
                  Fill: =AppTheme.PrimaryLight
                  Color: =AppTheme.PrimaryDark
                  Size: =11
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =!IsBlank(varComponent)
            - btnClearComponent:
                Control: Classic/Button
                Properties:
                  X: =Parent.Width - 452
                  Y: =192
                  Width: =104
                  Height: =24
                  Text: ="Clear filter"
                  Fill: =AppTheme.PrimaryLight
                  HoverFill: =AppTheme.Card
                  Color: =AppTheme.PrimaryDark
                  BorderThickness: =0
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  Visible: =!IsBlank(varComponent)
                  OnSelect: =Set(varComponent, Blank())

            # ---------------- Overview ----------------
            - lblOverviewCard:
                Control: Label
                Properties:
                  X: =316
                  Y: =232
                  Width: =Parent.Width - 348
                  Height: =240
                  Text: =""
                  Fill: =AppTheme.Card
                  BorderColor: =AppTheme.Border
                  BorderThickness: =1
                  Visible: =varSelectedSection = "Overview"
            - lblOverviewScopeLabel:
                Control: Label
                Properties:
                  X: =340
                  Y: =252
                  Width: =Parent.Width - 396
                  Height: =18
                  Text: ="DEPLOYMENT SCOPE"
                  Color: =AppTheme.MutedFg
                  Size: =9
                  FontWeight: =FontWeight.Bold
                  Visible: =varSelectedSection = "Overview"
            - lblOverviewScope:
                Control: Label
                Properties:
                  X: =340
                  Y: =272
                  Width: =Parent.Width - 396
                  Height: =72
                  Text: =Coalesce(varSolution.'Deployment Scope', "No deployment scope recorded.")
                  Color: =AppTheme.Fg
                  Size: =11
                  Visible: =varSelectedSection = "Overview"
            - lblOverviewConfigLabel:
                Control: Label
                Properties:
                  X: =340
                  Y: =352
                  Width: =Parent.Width - 396
                  Height: =18
                  Text: ="CUSTOMER CONFIGURATION"
                  Color: =AppTheme.MutedFg
                  Size: =9
                  FontWeight: =FontWeight.Bold
                  Visible: =varSelectedSection = "Overview"
            - lblOverviewConfig:
                Control: Label
                Properties:
                  X: =340
                  Y: =372
                  Width: =Parent.Width - 396
                  Height: =84
                  Text: =Coalesce(varSolution.'Customer Configuration', "No configuration summary recorded.")
                  Color: =AppTheme.Fg
                  Size: =11
                  Visible: =varSelectedSection = "Overview"

            # ---------------- Software ----------------
            - galSoftware:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =316
                  Y: =232
                  Width: =Parent.Width - 348
                  Height: =Parent.Height - 264
                  TemplateSize: =88
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: =varSelectedSection = "Software"
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_SoftwareInstallations,
                            Customer.Id = varCustomer.ID &&
                            (
                                'Applies To'.Value = "Customer" ||
                                'Customer Solution'.Id = varSolution.ID ||
                                (
                                    'Applies To'.Value = "Component" &&
                                    'Solution Component'.Id = varComponent.ID
                                )
                            ) &&
                            (
                                IsBlank(varComponent) ||
                                'Solution Component'.Id = Blank() ||
                                'Solution Component'.Id = varComponent.ID
                            )
                        ),
                        "Software Name",
                        SortOrder.Ascending,
                        "Software Version",
                        SortOrder.Descending
                    )
                Children:
                  - lblSoftwareCard:
                      Control: Label
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =80
                        Text: =""
                        Fill: =If(ThisItem.'Deployment Status'.Value = "Current Standard", AppTheme.SuccessLight, AppTheme.Card)
                        BorderColor: =If(ThisItem.'Deployment Status'.Value = "Current Standard", AppTheme.Success, AppTheme.Border)
                        BorderThickness: =1
                  - lblSoftwareName:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =12
                        Width: =Parent.TemplateWidth - 200
                        Height: =22
                        Text: =ThisItem.'Software Name' & "   " & ThisItem.'Software Version'
                        Color: =AppTheme.Fg
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                  - lblSoftwareDetail:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =34
                        Width: =Parent.TemplateWidth - 200
                        Height: =18
                        Text: |
                          =Concat(
                              Filter(
                                  [
                                      If(!IsBlank(ThisItem.'Windows Version'), "Windows " & ThisItem.'Windows Version'),
                                      If(!IsBlank(ThisItem.'Deployment Scope'), ThisItem.'Deployment Scope')
                                  ],
                                  !IsBlank(Value)
                              ),
                              Value,
                              "   •   "
                          )
                        Color: =AppTheme.MutedFg
                        Size: =10
                  - lblBadgeAppliesTo:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =52
                        Width: =92
                        Height: =22
                        Text: =ThisItem.'Applies To'.Value
                        Fill: =AppTheme.GrayLight
                        Color: =AppTheme.GrayDark
                        Size: =9
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                  - lblBadgeDeploymentStatus:
                      Control: Label
                      Properties:
                        X: =Parent.TemplateWidth - 176
                        Y: =28
                        Width: =160
                        Height: =24
                        Text: =ThisItem.'Deployment Status'.Value
                        Fill: |
                          =Switch(
                              ThisItem.'Deployment Status'.Value,
                              "Current Standard", AppTheme.SuccessLight,
                              "Installed", AppTheme.SuccessLight,
                              "Upgrade Planned", AppTheme.WarningLight,
                              "Upgrade Required", AppTheme.WarningLight,
                              AppTheme.GrayLight
                          )
                        Color: |
                          =Switch(
                              ThisItem.'Deployment Status'.Value,
                              "Current Standard", AppTheme.SuccessDark,
                              "Installed", AppTheme.SuccessDark,
                              "Upgrade Planned", AppTheme.WarningDark,
                              "Upgrade Required", AppTheme.WarningDark,
                              AppTheme.GrayDark
                          )
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =!IsBlank(ThisItem.'Deployment Status'.Value)
            - lblNoSoftware:
                Control: Label
                Properties:
                  X: =316
                  Y: =300
                  Width: =Parent.Width - 348
                  Height: =24
                  Text: ="No software matches this customer, solution, and component."
                  Color: =AppTheme.MutedFg
                  Size: =11
                  Align: =Align.Center
                  Visible: =varSelectedSection = "Software" && CountRows(galSoftware.AllItems) = 0

            # ---------------- Guides ----------------
            - galGuides:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =316
                  Y: =232
                  Width: =Parent.Width - 348
                  Height: =Parent.Height - 264
                  TemplateSize: =84
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: =varSelectedSection = "Guides"
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_CustomerGuides,
                            Customer.Id = varCustomer.ID &&
                            Active = true &&
                            (
                                'Applies To'.Value = "Customer" ||
                                'Customer Solution'.Id = varSolution.ID ||
                                (
                                    'Applies To'.Value = "Component" &&
                                    'Solution Component'.Id = varComponent.ID
                                )
                            ) &&
                            (
                                IsBlank(varComponent) ||
                                'Solution Component'.Id = Blank() ||
                                'Solution Component'.Id = varComponent.ID
                            )
                        ),
                        "Title",
                        SortOrder.Ascending
                    )
                Children:
                  - lblGuideCard:
                      Control: Label
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =76
                        Text: =""
                        Fill: =AppTheme.Card
                        BorderColor: =AppTheme.Border
                        BorderThickness: =1
                  - lblGuideTitle:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =12
                        Width: =Parent.TemplateWidth - 130
                        Height: =22
                        Text: =ThisItem.Title
                        Color: =AppTheme.Fg
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                  - lblGuideBadgeType:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =40
                        Width: =140
                        Height: =22
                        Text: =ThisItem.'Guide Type'.Value
                        Fill: =AppTheme.PrimaryLight
                        Color: =AppTheme.PrimaryDark
                        Size: =9
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                  - lblGuideBadgeStatus:
                      Control: Label
                      Properties:
                        X: =162
                        Y: =40
                        Width: =128
                        Height: =22
                        Text: =ThisItem.'Document Status '.Value
                        Fill: =If(ThisItem.'Document Status '.Value = "Current", AppTheme.SuccessLight, AppTheme.GrayLight)
                        Color: =If(ThisItem.'Document Status '.Value = "Current", AppTheme.SuccessDark, AppTheme.GrayDark)
                        Size: =9
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                  - btnOpenGuide:
                      Control: Classic/Button
                      Properties:
                        X: =Parent.TemplateWidth - 110
                        Y: =24
                        Width: =92
                        Height: =30
                        Text: ="Open"
                        Fill: =AppTheme.Card
                        HoverFill: =AppTheme.PrimaryLight
                        Color: =AppTheme.Primary
                        BorderColor: =AppTheme.BorderStrong
                        BorderThickness: =1
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        OnSelect: |
                          =If(
                              IsBlank(ThisItem.'Document URL'),
                              Notify(
                                  "No document URL is saved on this guide.",
                                  NotificationType.Warning
                              ),
                              Launch(ThisItem.'Document URL')
                          )
            - lblNoGuides:
                Control: Label
                Properties:
                  X: =316
                  Y: =300
                  Width: =Parent.Width - 348
                  Height: =24
                  Text: ="No guides match this customer, solution, and component."
                  Color: =AppTheme.MutedFg
                  Size: =11
                  Align: =Align.Center
                  Visible: =varSelectedSection = "Guides" && CountRows(galGuides.AllItems) = 0

            # ---------------- SIA documentation ----------------
            - galSIA:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =316
                  Y: =232
                  Width: =Parent.Width - 348
                  Height: =Parent.Height - 264
                  TemplateSize: =84
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: =varSelectedSection = "SIA"
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_CustomerReferences,
                            Customer.Id = varCustomer.ID &&
                            Active = true &&
                            (
                                'Applies To'.Value = "Customer" ||
                                'Customer Solution'.Id = varSolution.ID ||
                                (
                                    'Applies To'.Value = "Component" &&
                                    'Solution Component'.Id = varComponent.ID
                                )
                            ) &&
                            (
                                IsBlank(varComponent) ||
                                'Solution Component'.Id = Blank() ||
                                'Solution Component'.Id = varComponent.ID
                            ) &&
                            LookUp(
                                TB_ProductReferences As Ref,
                                Ref.ID = ThisRecord.'Product Reference'.Id,
                                Ref.Restricted
                            ) <> true &&
                            LookUp(
                                TB_ProductReferences As Ref,
                                Ref.ID = ThisRecord.'Product Reference'.Id,
                                Ref.'Release Status'.Value
                            ) <> "Retired" &&
                            LookUp(
                                TB_ProductReferences As Ref,
                                Ref.ID = ThisRecord.'Product Reference'.Id,
                                Ref.'Reference Type'.Value
                            ) in [
                                "SIA Product Page",
                                "SIA Documantation",
                                "Installation Manual",
                                "Service Manual",
                                "Troubleshooting Guide",
                                "Technical Bulletin",
                                "Technical Alert",
                                "Product Specification"
                            ]
                        ),
                        "Display Order",
                        SortOrder.Ascending
                    )
                Children:
                  - lblSIACard:
                      Control: Label
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =76
                        Text: =""
                        Fill: =If(ThisItem.Featured, AppTheme.WarningLight, AppTheme.Card)
                        BorderColor: =If(ThisItem.Featured, AppTheme.Warning, AppTheme.Border)
                        BorderThickness: =1
                  - lblSIATitle:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =12
                        Width: =Parent.TemplateWidth - 130
                        Height: =22
                        Text: =ThisItem.Title
                        Color: =AppTheme.Fg
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                  - lblSIABadgeStatus:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =40
                        Width: =120
                        Height: =22
                        Text: |
                          =LookUp(
                              TB_ProductReferences As Ref,
                              Ref.ID = ThisItem.'Product Reference'.Id,
                              Ref.'Release Status'.Value
                          )
                        Fill: =If(Self.Text = "Current", AppTheme.SuccessLight, AppTheme.GrayLight)
                        Color: =If(Self.Text = "Current", AppTheme.SuccessDark, AppTheme.GrayDark)
                        Size: =9
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                  - lblSIANotes:
                      Control: Label
                      Properties:
                        X: =144
                        Y: =40
                        Width: =Parent.TemplateWidth - 258
                        Height: =22
                        Text: |
                          =Coalesce(
                              LookUp(
                                  TB_ProductReferences As Ref,
                                  Ref.ID = ThisItem.'Product Reference'.Id,
                                  Ref.Description
                              ),
                              ""
                          )
                        Color: =AppTheme.MutedFg
                        Size: =10
                        VerticalAlign: =VerticalAlign.Middle
                  - btnOpenSIA:
                      Control: Classic/Button
                      Properties:
                        X: =Parent.TemplateWidth - 110
                        Y: =24
                        Width: =92
                        Height: =30
                        Text: ="Open"
                        Fill: =AppTheme.Card
                        HoverFill: =AppTheme.PrimaryLight
                        Color: =AppTheme.Primary
                        BorderColor: =AppTheme.BorderStrong
                        BorderThickness: =1
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        OnSelect: |
                          =With(
                              {
                                  RefURL: LookUp(
                                      TB_ProductReferences As Ref,
                                      Ref.ID = ThisItem.'Product Reference'.Id,
                                      Ref.'Reference URL'
                                  )
                              },
                              If(
                                  IsBlank(RefURL),
                                  Notify(
                                      "No reference URL is saved for this item.",
                                      NotificationType.Warning
                                  ),
                                  Launch(RefURL)
                              )
                          )
            - lblNoSIA:
                Control: Label
                Properties:
                  X: =316
                  Y: =300
                  Width: =Parent.Width - 348
                  Height: =24
                  Text: ="No SIA documentation matches this customer, solution, and component."
                  Color: =AppTheme.MutedFg
                  Size: =11
                  Align: =Align.Center
                  Visible: =varSelectedSection = "SIA" && CountRows(galSIA.AllItems) = 0

            # ---------------- Firmware and downloads ----------------
            - galFirmware:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =316
                  Y: =232
                  Width: =Parent.Width - 348
                  Height: =Parent.Height - 264
                  TemplateSize: =84
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: =varSelectedSection = "Firmware"
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_CustomerReferences,
                            Customer.Id = varCustomer.ID &&
                            Active = true &&
                            (
                                'Applies To'.Value = "Customer" ||
                                'Customer Solution'.Id = varSolution.ID ||
                                (
                                    'Applies To'.Value = "Component" &&
                                    'Solution Component'.Id = varComponent.ID
                                )
                            ) &&
                            (
                                IsBlank(varComponent) ||
                                'Solution Component'.Id = Blank() ||
                                'Solution Component'.Id = varComponent.ID
                            ) &&
                            LookUp(
                                TB_ProductReferences As Ref,
                                Ref.ID = ThisRecord.'Product Reference'.Id,
                                Ref.Restricted
                            ) <> true &&
                            LookUp(
                                TB_ProductReferences As Ref,
                                Ref.ID = ThisRecord.'Product Reference'.Id,
                                Ref.'Release Status'.Value
                            ) <> "Retired" &&
                            LookUp(
                                TB_ProductReferences As Ref,
                                Ref.ID = ThisRecord.'Product Reference'.Id,
                                Ref.'Reference Type'.Value
                            ) in [
                                "Machine Firmware",
                                "BV Firmware",
                                "Software Download",
                                "Driver",
                                "Support Tool"
                            ]
                        ),
                        "Display Order",
                        SortOrder.Ascending
                    )
                Children:
                  - lblFirmwareCard:
                      Control: Label
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =76
                        Text: =""
                        Fill: =If(ThisItem.Featured, AppTheme.WarningLight, AppTheme.Card)
                        BorderColor: =If(ThisItem.Featured, AppTheme.Warning, AppTheme.Border)
                        BorderThickness: =1
                  - lblFirmwareTitle:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =12
                        Width: =Parent.TemplateWidth - 130
                        Height: =22
                        Text: =ThisItem.Title
                        Color: =AppTheme.Fg
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                  - lblFirmwareBadgeStatus:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =40
                        Width: =120
                        Height: =22
                        Text: |
                          =LookUp(
                              TB_ProductReferences As Ref,
                              Ref.ID = ThisItem.'Product Reference'.Id,
                              Ref.'Release Status'.Value
                          )
                        Fill: =If(Self.Text = "Current", AppTheme.SuccessLight, AppTheme.GrayLight)
                        Color: =If(Self.Text = "Current", AppTheme.SuccessDark, AppTheme.GrayDark)
                        Size: =9
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                  - lblFirmwareNotes:
                      Control: Label
                      Properties:
                        X: =144
                        Y: =40
                        Width: =Parent.TemplateWidth - 258
                        Height: =22
                        Text: |
                          =Coalesce(
                              LookUp(
                                  TB_ProductReferences As Ref,
                                  Ref.ID = ThisItem.'Product Reference'.Id,
                                  Ref.Description
                              ),
                              ""
                          )
                        Color: =AppTheme.MutedFg
                        Size: =10
                        VerticalAlign: =VerticalAlign.Middle
                  - btnOpenFirmware:
                      Control: Classic/Button
                      Properties:
                        X: =Parent.TemplateWidth - 110
                        Y: =24
                        Width: =92
                        Height: =30
                        Text: ="Open"
                        Fill: =AppTheme.Card
                        HoverFill: =AppTheme.PrimaryLight
                        Color: =AppTheme.Primary
                        BorderColor: =AppTheme.BorderStrong
                        BorderThickness: =1
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        OnSelect: |
                          =With(
                              {
                                  RefURL: LookUp(
                                      TB_ProductReferences As Ref,
                                      Ref.ID = ThisItem.'Product Reference'.Id,
                                      Ref.'Reference URL'
                                  )
                              },
                              If(
                                  IsBlank(RefURL),
                                  Notify(
                                      "No reference URL is saved for this item.",
                                      NotificationType.Warning
                                  ),
                                  Launch(RefURL)
                              )
                          )
            - lblNoFirmware:
                Control: Label
                Properties:
                  X: =316
                  Y: =300
                  Width: =Parent.Width - 348
                  Height: =24
                  Text: ="No firmware or downloads match this customer, solution, and component."
                  Color: =AppTheme.MutedFg
                  Size: =11
                  Align: =Align.Center
                  Visible: =varSelectedSection = "Firmware" && CountRows(galFirmware.AllItems) = 0
