# scrOnboard.pa.yaml - the new-customer wizard.
# Generated by scripts/gen_onboard.py - do not hand-edit.
Screens:
  scrOnboard:
    Properties:
      Fill: =AppDark.Bg
      OnVisible: |
        =Set(varWizStep, 1);
        Set(varWizError, "");
        Set(varWizParent, Defaults(TB_Installations));
        Clear(colWizFitted);
        Set(varWizSolProdName, "")
    Children:
      - conRootWiz:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =AppDark.Bg
            Height: =Parent.Height
            Width: =ContentWidth
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
          Children:
            - recWizBand:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =56
                  Fill: =AppDark.Brand
            - imgWordmarkWiz:
                Control: Image
                Properties:
                  X: =Parent.Width - Gutter - 96
                  Y: =20
                  Width: =96
                  Height: =15
                  Image: |
                    ="data:image/png;base64,"
            - btnBackWiz:
                Control: ModernButton
                Properties:
                  Color: =AppDark.Fg
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  Text: ="Admin"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  BorderThickness: =0
                  X: =Gutter - 8
                  Y: =6
                  Width: =140
                  Height: =44
                  OnSelect: |
                    =Navigate(scrAdmin, ScreenTransition.UnCoverRight)
            - btnWizCancel:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  BorderThickness: =0
                  Color: =AppDark.Accent
                  Font: =AppFont
                  Height: =44
                  OnSelect: =Navigate(scrHome, ScreenTransition.CoverRight)
                  Size: =AppType.Small
                  Text: ="Home"
                  Width: =Gutter * 8
                  X: =Gutter
                  Y: =56 + Gutter
            - lblWizTitle:
                Control: ModernText
                Properties:
                  Color: =AppDark.Fg
                  PaddingTop: =0
                  PaddingBottom: =0
                  Font: =AppFont
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =AppType.Title
                  Wrap: =false
                  AutoHeight: =false
                  Text: ="New customer"
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =56 + Gutter + 34
            - lblWizStep:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  Wrap: =false
                  AutoHeight: =false
                  Text: =Switch(varWizStep, 1, "Step 1 of 3  -  the customer", 2, "Step 2 of 3  -  the machines on site", 3, "Step 3 of 3  -  what is attached to each machine", "")
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =56 + Gutter + 72
            - lblCapCustName:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Customer name"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =112
                  Visible: =varWizStep = 1
            - txtWizCustName:
                Control: ModernTextInput
                Properties:
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Default: =""
                  Type: =TextInputType.SingleLine
                  Placeholder: =""
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =130
                  Visible: =varWizStep = 1
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Font: =AppFont
                  Size: =AppType.Body
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblCapCustDesc:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Description"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =184
                  Visible: =varWizStep = 1
            - txtWizCustDesc:
                Control: ModernTextInput
                Properties:
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Default: =""
                  Type: =TextInputType.Multiline
                  Placeholder: =""
                  Height: =64
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =202
                  Visible: =varWizStep = 1
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Font: =AppFont
                  Size: =AppType.Body
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblCapCustNotes:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Support notes"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =280
                  Visible: =varWizStep = 1
            - txtWizCustNotes:
                Control: ModernTextInput
                Properties:
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Default: =""
                  Type: =TextInputType.Multiline
                  Placeholder: =""
                  Height: =64
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =298
                  Visible: =varWizStep = 1
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Font: =AppFont
                  Size: =AppType.Body
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblCapWizCustActive:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Active"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =376
                  Visible: =varWizStep = 1
            - tglWizCustActive:
                Control: ModernToggle
                Properties:
                  Color: =AppDark.Fg
                  Default: =true
                  Font: =AppFont
                  Size: =AppType.Body
                  Height: =36
                  Width: =110
                  X: =Gutter
                  Y: =394
                  Visible: =varWizStep = 1
            - btnWizStep1Next:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  OnSelect: |
                    =IfError(
                        Set(varWizCust,
                            Patch(TB_Customers, Defaults(TB_Customers),
                                {
                                    Title: txtWizCustName.Text,
                                    Description: txtWizCustDesc.Text,
                                    'Support Notes': txtWizCustNotes.Text,
                                    Active: tglWizCustActive.Checked
                                }
                            )
                        );
                        Set(varWizError, "");
                        Set(varWizStep, 2),
                        Set(varWizError, FirstError.Message)
                    )
                  Text: ="Create customer  >"
                  Width: =210
                  X: =Gutter
                  Y: =Parent.Height - Gutter - 44
                  Visible: =varWizStep = 1 && Len(Trim(txtWizCustName.Text)) > 0
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  BorderThickness: =0
                  Height: =44
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblCapWizSolProduct:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Product"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =112
                  Visible: =varWizStep = 2
            - ddWizSolProduct:
                Control: ModernDropdown
                Properties:
                  Items: |
                    =Choices(TB_Installations.Product)
                  ItemDisplayText: =ThisItem.Value
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =130
                  Visible: =varWizStep = 2
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Font: =AppFont
                  Size: =AppType.Body
            - lblCapWizSolVersion:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Installed software version"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =184
                  Visible: =varWizStep = 2
            - txtWizSolVersion:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  Mode: =TextMode.SingleLine
                  HintText: =""
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =202
                  Visible: =varWizStep = 2
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Font: =AppFont
                  Size: =AppType.Body
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblHintWizSolVersion:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: =If(IsBlank(ddWizSolProduct.Selected), "The software build running on the machine, not the model number.", "Standard for " & ddWizSolProduct.Selected.Value & " is " & Coalesce(LookUp(TB_Products, ID = ddWizSolProduct.Selected.Id, 'Current Standard Version'), "not recorded"))
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =244
                  Visible: =varWizStep = 2
            - lblCapWizSolStatus:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Status"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =276
                  Visible: =varWizStep = 2
            - ddWizSolStatus:
                Control: ModernDropdown
                Properties:
                  Items: |
                    =Choices(TB_Installations.Status)
                  ItemDisplayText: =ThisItem.Value
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =294
                  Visible: =varWizStep = 2
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Font: =AppFont
                  Size: =AppType.Body
            - lblCapWizSolNotes:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Config notes"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =348
                  Visible: =varWizStep = 2
            - txtWizSolNotes:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  Mode: =TextMode.MultiLine
                  HintText: =""
                  Height: =64
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =366
                  Visible: =varWizStep = 2
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Font: =AppFont
                  Size: =AppType.Body
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - btnWizAddSolution:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =AppDark.Ok
                  Icon: ="Add"
                  Layout: =ButtonLayout.IconBefore
                  OnSelect: |
                    =IfError(
                        Patch(TB_Installations, Defaults(TB_Installations),
                            {
                                Title: varWizCust.Title & " - " & ddWizSolProduct.Selected.Value,
                                Customer:
                                    { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                      Id: varWizCust.ID, Value: varWizCust.Title },
                                Product: ddWizSolProduct.Selected,
                                'Installed Version': txtWizSolVersion.Text,
                                Status: If(IsBlank(ddWizSolStatus.Selected), Blank(), { Value: ddWizSolStatus.Selected.Value }),
                                'Config Notes': txtWizSolNotes.Text
                            }
                        );
                        Set(varWizError, "");
                        Reset(txtWizSolVersion);
                        Reset(txtWizSolNotes);
                        Reset(ddWizSolProduct),
                        Set(varWizError, FirstError.Message)
                    )
                  Text: ="+  Add machine"
                  Width: =190
                  X: =Gutter
                  Y: =444
                  Visible: =varWizStep = 2 && !IsBlank(ddWizSolProduct.Selected)
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  BorderThickness: =0
                  Height: =44
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - galWizSolutions:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =Filter(TB_Installations, Customer.Id = varWizCust.ID, IsBlank('Parent'))
                  Visible: =varWizStep = 2
                  X: =Gutter
                  Y: =504
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - 504 - Gutter - 60
                  TemplateSize: =48
                  TemplatePadding: =4
                  ShowScrollbar: =true
                Children:
                  - lblWizSolRow:
                      Control: ModernText
                      Properties:
                        Color: =AppDark.Fg
                        PaddingTop: =0
                        PaddingBottom: =0
                        Text: |
                          =ThisItem.Title & "   " & Coalesce(ThisItem.'Installed Version', "no version")
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                        PaddingLeft: =10
                        Fill: =AppDark.Sunken
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =36
            - lblWizSolCount:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: =If(CountRows(Filter(TB_Installations, Customer.Id = varWizCust.ID, IsBlank('Parent'))) = 0, "No machines added yet.", CountRows(Filter(TB_Installations, Customer.Id = varWizCust.ID, IsBlank('Parent'))) = 1, "1 machine added.", CountRows(Filter(TB_Installations, Customer.Id = varWizCust.ID, IsBlank('Parent'))) & " machines added.")
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =20
                  Width: =360
                  X: =Gutter + 210
                  Y: =456
                  Visible: =varWizStep = 2
            - btnWizStep2Next:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  Text: |
                    ="Next: what is attached  >"
                  Width: =260
                  X: =ContentWidth - Gutter - 260
                  Y: =Parent.Height - Gutter - 44
                  OnSelect: =Set(varWizStep, 3)
                  Visible: =varWizStep = 2
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  BorderThickness: =0
                  Height: =44
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblCapWizUnitParent:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Which machine are these attached to"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =112
                  Visible: =varWizStep = 3
            - ddWizUnitParent:
                Control: ModernDropdown
                Properties:
                  Items: |
                    =Sort(Filter(TB_Installations, Customer.Id = varWizCust.ID, IsBlank('Parent')), Title, SortOrder.Ascending)
                  OnChange: |
                    =Set(varWizParent, ddWizUnitParent.Selected);
                    Set(varWizSolProdName,
                        LookUp(TB_Products, ID = varWizParent.Product.Id, Title));
                    ClearCollect(colWizFitted, Filter(TB_Installations, 'Parent'.Id = varWizParent.ID))
                  ItemDisplayText: =ThisItem.Title
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =130
                  Visible: =varWizStep = 3
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Font: =AppFont
                  Size: =AppType.Body
            - lblWizNoSolutions:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="No machines on this customer yet - go back a step and add one."
                  Color: =AppDark.Danger
                  Font: =AppFont
                  Size: =AppType.Small
                  Wrap: =true
                  AutoHeight: =false
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =112
                  Visible: =varWizStep = 3 && CountRows(Sort(Filter(TB_Installations, Customer.Id = varWizCust.ID, IsBlank('Parent')), Title, SortOrder.Ascending)) = 0
            - lblWizCompHead:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: =If(IsBlank(ddWizUnitParent.Selected), "", "Units for a " & varWizSolProdName & "  -  the standard build is ticked")
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =((ContentWidth - (Gutter * 2) - 24) / 2)
                  X: =Gutter
                  Y: =188
                  Visible: =varWizStep = 3
            - lblWizAddedHead:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Already added"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =((ContentWidth - (Gutter * 2) - 24) / 2)
                  X: =(Gutter + ((ContentWidth - (Gutter * 2) - 24) / 2) + 24)
                  Y: =188
                  Visible: =varWizStep = 3
            - galWizComponents:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =Filter(TB_SolutionUnits As S, S.Solution.Id = varWizParent.Product.Id, CountRows(Filter(colWizFitted, Product.Id = S.Unit.Id)) = 0)
                  Visible: =varWizStep = 3
                  X: =Gutter
                  Y: =210
                  Width: =((ContentWidth - (Gutter * 2) - 24) / 2)
                  Height: =Parent.Height - 210 - Gutter - 120
                  TemplateSize: =48
                  TemplatePadding: =4
                  ShowScrollbar: =true
                Children:
                  - chkWizComp:
                      Control: Classic/CheckBox
                      Properties:
                        Text: |
                          =ThisItem.Unit.Value & "   " & LookUp(TB_Products, ID = ThisItem.Unit.Id).'Product Type'.Value
                        Default: =ThisItem.Standard
                        Reset: =varWizCompReset
                        Color: =AppDark.Fg
                        Font: =AppFont
                        Size: =AppType.Small
                        Fill: =AppDark.Sunken
                        CheckmarkFill: =AppDark.Accent
                        CheckboxBorderColor: =AppDark.Line
                        PaddingLeft: =8
                        X: =0
                        Y: =2
                        Height: =44
                        Width: =Parent.TemplateWidth - 128
                  - lblWizCompId:
                      Control: ModernText
                      Properties:
                        Color: =AppDark.Fg
                        PaddingTop: =0
                        PaddingBottom: =0
                        Text: =ThisItem.Unit.Id
                        Visible: =false
                        X: =0
                        Y: =0
                        Width: =1
                        Height: =17
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                  - lblWizCompName:
                      Control: ModernText
                      Properties:
                        Color: =AppDark.Fg
                        PaddingTop: =0
                        PaddingBottom: =0
                        Text: =ThisItem.Unit.Value
                        Visible: =false
                        X: =0
                        Y: =0
                        Width: =1
                        Height: =17
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                  - txtWizCompVersion:
                      Control: Classic/TextInput
                      Properties:
                        Default: =LookUp(TB_Products, ID = ThisItem.Unit.Id).'Current Standard Version'
                        Reset: =varWizCompReset
                        Mode: =TextMode.SingleLine
                        HintText: ="software"
                        X: =Parent.TemplateWidth - 124
                        Y: =2
                        Height: =40
                        Width: =120
                        BorderColor: =AppDark.Line
                        BorderThickness: =1
                        Color: =AppDark.Fg
                        Fill: =AppDark.Surface
                        Font: =AppFont
                        Size: =AppType.Body
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
            - lblWizCompEmpty:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: =If(IsBlank(ddWizUnitParent.Selected), "Pick a machine above and its units appear here.", CountRows(Filter(TB_SolutionUnits, Solution.Id = varWizParent.Product.Id)) = 0, "A " & varWizSolProdName & " has no attached units on file. If that is wrong, add them under Admin.", "Everything on file for a " & varWizSolProdName & " is already added.")
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  Wrap: =true
                  AutoHeight: =false
                  Height: =80
                  Width: =((ContentWidth - (Gutter * 2) - 24) / 2)
                  X: =Gutter
                  Y: =218
                  Visible: =varWizStep = 3 && CountRows(Filter(TB_SolutionUnits As S, S.Solution.Id = varWizParent.Product.Id, CountRows(Filter(colWizFitted, Product.Id = S.Unit.Id)) = 0)) = 0
            - galWizUnits:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =Filter(TB_Installations, Customer.Id = varWizCust.ID, !IsBlank('Parent'))
                  Visible: =varWizStep = 3
                  X: =(Gutter + ((ContentWidth - (Gutter * 2) - 24) / 2) + 24)
                  Y: =210
                  Width: =((ContentWidth - (Gutter * 2) - 24) / 2)
                  Height: =Parent.Height - 210 - Gutter - 120
                  TemplateSize: =48
                  TemplatePadding: =4
                  ShowScrollbar: =true
                Children:
                  - lblWizUnitRow:
                      Control: ModernText
                      Properties:
                        Color: =AppDark.Fg
                        PaddingTop: =0
                        PaddingBottom: =0
                        Text: |
                          =ThisItem.Title & "   under " & Coalesce(ThisItem.'Parent'.Value, "?")
                        Font: =AppFont
                        Size: =AppType.Small
                        Wrap: =false
                        AutoHeight: =false
                        PaddingLeft: =10
                        Fill: =AppDark.Sunken
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =36
            - lblCapWizUnitStatus:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Status for the ticked units"
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =18
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =Parent.Height - Gutter - 112
                  Visible: =varWizStep = 3
            - ddWizUnitStatus:
                Control: ModernDropdown
                Properties:
                  Items: |
                    =Choices(TB_Installations.Status)
                  ItemDisplayText: =ThisItem.Value
                  Height: =40
                  Width: =260
                  X: =Gutter
                  Y: =Parent.Height - Gutter - 94
                  Visible: =varWizStep = 3
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  Font: =AppFont
                  Size: =AppType.Body
            - btnWizAddUnits:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =AppDark.Ok
                  Icon: ="Add"
                  Layout: =ButtonLayout.IconBefore
                  OnSelect: |
                    =IfError(
                        ForAll(
                            Filter(galWizComponents.AllItems, chkWizComp.Value = true),
                            Patch(TB_Installations, Defaults(TB_Installations),
                                {
                                    Title: varWizCust.Title & " - " & lblWizCompName.Text,
                                    Customer:
                                        { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                          Id: varWizCust.ID, Value: varWizCust.Title },
                                    Product:
                                        { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                          Id: Value(lblWizCompId.Text), Value: lblWizCompName.Text },
                                    'Parent':
                                        { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                          Id: varWizParent.ID, Value: varWizParent.Title },
                                    'Installed Version': txtWizCompVersion.Text,
                                    Status: If(IsBlank(ddWizUnitStatus.Selected), Blank(), { Value: ddWizUnitStatus.Selected.Value })
                                }
                            )
                        );
                        Set(varWizError, "");
                        ClearCollect(colWizFitted, Filter(TB_Installations, 'Parent'.Id = varWizParent.ID));
                        Set(varWizCompReset, true);
                        Set(varWizCompReset, false),
                        Set(varWizError, FirstError.Message)
                    )
                  Text: =If(CountRows(Filter(galWizComponents.AllItems, chkWizComp.Value = true)) = 1, "+  Add 1 ticked unit", "+  Add " & CountRows(Filter(galWizComponents.AllItems, chkWizComp.Value = true)) & " ticked units")
                  Width: =260
                  X: =Gutter + 280
                  Y: =Parent.Height - Gutter - 94
                  Visible: =varWizStep = 3 && CountRows(Filter(galWizComponents.AllItems, chkWizComp.Value = true)) > 0
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  BorderThickness: =0
                  Height: =44
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - btnWizFinish:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  OnSelect: |
                    =Set(varCustomer, varWizCust);
                    Navigate(scrCustomerOverview, ScreenTransition.Cover)
                  Text: ="Finish"
                  Width: =190
                  X: =ContentWidth - Gutter - 190
                  Y: =Parent.Height - Gutter - 44
                  Visible: =varWizStep = 3
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  BorderThickness: =0
                  Height: =44
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblWizError:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: =varWizError
                  Color: =AppDark.Danger
                  Font: =AppFont
                  Size: =AppType.Small
                  Wrap: =true
                  AutoHeight: =false
                  Height: =44
                  Width: =ContentWidth - (Gutter * 2) - 420
                  X: =Gutter + 220
                  Y: =Parent.Height - Gutter - 44
                  Visible: =!IsBlank(varWizError)
