# Screen — Catalogue
# The only route to a document without a customer in context: a technician who knows the
# machine but not the site. Reached with no varCustomer and no varInstallation set — this
# screen never reads either variable. A search box filters TB_Products by Title; the gallery
# below sorts by Product Type then Title. Selecting a model expands its documents inline
# instead of navigating, because a seventh screen would carry no information this one cannot
# show, and the screen count stays at six: galModels.OnSelect sets varExpandedModel to the
# tapped row's ID. varExpandedModel starts at 0 in App.OnStart, so nothing is expanded on
# entry.
#
# galModelDocs is a SIBLING of galModels, not nested inside its row template. A first attempt
# nested it, keyed off ThisItem.ID, and TemplateSize — a single scalar evaluated once for the
# whole gallery, not per row — had to reserve the expanded height on every row whether or not
# that row was expanded: ~200px of dead space per row, leaving roughly two of thirty-eight
# models visible on a phone. That defeats the only job this screen has, so it was flattened on
# review. galModelDocs now filters on the variable directly — Product.Id = varExpandedModel —
# rather than on ThisItem, and its Visible test is =!IsBlank(varExpandedModel) &&
# varExpandedModel <> 0 rather than a per-row comparison. galModels.Height still grows to fill
# the screen when nothing is expanded (collapsedCondition below) and only gives up room at the
# bottom, once, when a model is actually selected — not per row, and not permanently.
#
# Because the document panel is no longer physically attached to the row that opened it, the
# row itself carries the indicator: rectModelCard.Fill highlights AppTheme.PrimaryLight when
# ThisItem.ID = varExpandedModel, AppTheme.Surface otherwise. Exactly one row is ever tinted,
# because varExpandedModel holds exactly one ID.
#
# lblStandardCat.Text is Coalesce(ThisItem.'Current Standard Version', "no standard set") with
# no comparison alongside it — this screen has no installed version to compare against, only
# the catalogue's own claim of what standard is. Showing "no standard set" rather than hiding
# the row is deliberate: this is the screen that lets the maintainer audit the catalogue while
# populating it, so a gap in the data must be visible here, not swallowed.
#
# The document panel filters IsBlank(Customer.Value) with no Or(...) — universal documents
# only. Customer-specific references are excluded on purpose: without a customer in context
# they carry no meaning, and surfacing one customer's bespoke procedure to every technician
# browsing the catalogue is a real disclosure problem, not a hypothetical one. This did not
# change when the gallery was flattened, and it was re-checked after the edit.
#
# A row with a blank URL is visible but not tappable, the same two-part idiom as scrSolution:
# OnSelect guards the Launch, and the row's title label dims when URL is blank. No DisplayMode
# property appears on either gallery — it is a screen-scoped scalar and ThisItem does not
# resolve inside it.
#
# lblNoModelDocs now references galModelDocs.AllItems as an ordinary top-level sibling, the
# same shape already proven in scrCustomers and scrSolution — no self-reference inside a
# shared row template, which the nested version required and which was flagged as unverified.
Screens:
  scrCatalogue:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRootCat:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
            Y: =0
            Width: =ContentWidth
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - btnBackCat:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  X: =Gutter
                  Y: =Gutter
                  Width: =Gutter * 10
                  Height: =28
                  Text: ="Home"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppTheme.Primary
                  BorderThickness: =0
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Navigate(scrHome, ScreenTransition.CoverRight)
            - lblTitleCat:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Gutter + 36
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Text: ="Catalogue"
                  Font: =AppFont
                  Size: =AppType.Title
                  FontWeight: =FontWeight.Bold
            - txtSearchCat:
                Control: ModernTextInput
                Properties:
                  Type: =TextInputType.Search
                  X: =Gutter
                  Y: =Gutter + 84
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =44
                  Default: =""
                  Placeholder: ="Search models"
                  Font: =AppFont
                  Size: =AppType.Body
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - galModels:
                Control: Gallery
                Variant: Vertical
                Properties:
                  WrapCount: =Switch(scrCatalogue.Size, ScreenSize.Small, 1, ScreenSize.Medium, 1, ScreenSize.Large, 2, 2)
                  X: =Gutter
                  Y: =Gutter + 140
                  Width: =If(scrCatalogue.Size >= ScreenSize.Large, (Parent.Width - (Gutter * 3)) * 0.55, Parent.Width - (Gutter * 2))
                  Height: |
                    =If(
                        IsBlank(varExpandedModel) || varExpandedModel = 0,
                        Parent.Height - (Gutter + 140) - Gutter,
                        Parent.Height - (Gutter + 140) - (Gutter * 2) - 240
                    )
                  TemplateSize: =92
                  TemplatePadding: =8
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_Products,
                            Active = true,
                            StartsWith(Title, Trim(txtSearchCat.Text))
                        ),
                        "Title",
                        SortOrder.Ascending
                    )
                  OnSelect: =Set(varExpandedModel, ThisItem.ID)
                Children:
                  - rectModelCard:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =0
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =92
                        BorderThickness: =1
                        Text: =""
                        Fill: =AppTheme.Surface
                        HoverFill: =AppTheme.Sunken
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =AppTheme.LineSoft
                        HoverBorderColor: =AppTheme.Line
                        PressedBorderColor: =AppTheme.Primary
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  - lblModelTitle:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =10
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =21
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                  - lblModelType:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =32
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =17
                        Text: =ThisItem.'Product Type'.Value
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                  - lblStandardCaption:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =52
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.3
                        Wrap: =false
                        AutoHeight: =false
                        Height: =16
                        Text: ="Standard"
                        Font: =AppFont
                        Size: =AppType.Micro
                        Color: =AppTheme.Muted
                  - lblStandardCat:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.3)
                        Y: =52
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.7
                        Height: =17
                        Text: =Coalesce(ThisItem.'Current Standard Version', "no standard set")
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.'Current Standard Version'), AppTheme.Faint, AppTheme.Fg)
                  - lblDocCount:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =70
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =17
                        Align: =Align.Right
                        Text: =CountRows(Filter(TB_References, Product.Id = ThisItem.ID, IsBlank(Customer))) & " documents"
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galModelsHit:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblDocsHeadingCat:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Parent.Height - Gutter - 240
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =24
                  Text: ="Documents"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Bold
                  Visible: =!IsBlank(varExpandedModel) && varExpandedModel <> 0
            - galModelDocs:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =If(scrCatalogue.Size >= ScreenSize.Large, galModels.X + galModels.Width + Gutter, Gutter)
                  Y: =If(scrCatalogue.Size >= ScreenSize.Large, galModels.Y, Parent.Height - Gutter - 208)
                  Width: =If(scrCatalogue.Size >= ScreenSize.Large, Parent.Width - (galModels.X + galModels.Width + (Gutter * 2)), Parent.Width - (Gutter * 2))
                  Height: =If(scrCatalogue.Size >= ScreenSize.Large, galModels.Height, 208)
                  TemplateSize: =52
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Visible: =!IsBlank(varExpandedModel) && varExpandedModel <> 0
                  Items: |
                    =SortByColumns(
                        Filter(TB_References, Product.Id = varExpandedModel, IsBlank(Customer)),
                        "Title",
                        SortOrder.Ascending
                    )
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - rectDocRow:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =0
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =44
                        BorderThickness: =1
                        Text: =""
                        Fill: =AppTheme.Surface
                        HoverFill: =AppTheme.Sunken
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =AppTheme.LineSoft
                        HoverBorderColor: =AppTheme.Line
                        PressedBorderColor: =AppTheme.Primary
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  - lblDocTitle:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =4
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =18
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppTheme.Faint, AppTheme.Fg)
                        Text: =ThisItem.Title
                  - lblDocMeta:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =22
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.6
                        Height: =16
                        Font: =AppFont
                        Size: =AppType.Micro
                        Color: =AppTheme.Muted
                        Text: =ThisItem.Section.Value & "  •  " & ThisItem.'Reference Type'.Value
                  - lblDocChecked:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter + ((Parent.TemplateWidth - (Gutter * 2)) * 0.6)
                        Y: =22
                        Width: =(Parent.TemplateWidth - (Gutter * 2)) * 0.4
                        Height: =16
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Micro
                        Text: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              "never checked",
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              "not checked in " & DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) & " months",
                              "checked " & Text(ThisItem.'Last Checked', "dd mmm yyyy")
                          )
                        Color: |
                          =If(
                              IsBlank(ThisItem.'Last Checked'),
                              AppTheme.Muted,
                              DateDiff(ThisItem.'Last Checked', Today(), TimeUnit.Months) >= 12,
                              AppTheme.Warn,
                              AppTheme.Ok
                          )
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galModelDocsHit:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblNoModelDocs:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Parent.Height - Gutter - 208
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No universal documents are on file for this model."
                  Visible: =!IsBlank(varExpandedModel) && varExpandedModel <> 0 && CountRows(galModelDocs.AllItems) = 0
            - lblNoModels:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Gutter + 140
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No models match your search."
                  Visible: =CountRows(galModels.AllItems) = 0
