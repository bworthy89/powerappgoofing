# Generated by scripts/gen_admin.py - admin record picker.
# One gallery per list, toggled by varAdminList. Each row is a single
# Classic/Button so the whole row is the tap target and the text is the
# button's own Text - no separate label to keep aligned.
Screens:
  scrAdmin:
    Properties:
      Fill: =AppTheme.Bg
      OnVisible: |
        =If(!varIsAdmin, Navigate(scrHome, ScreenTransition.UnCoverRight))
    Children:
      - conRootAdm:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =AppTheme.Bg
            Height: =Parent.Height
            Width: =ContentWidth
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
          Children:
            - btnBackAdm:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  BorderThickness: =0
                  Color: =AppTheme.Primary
                  Font: =AppFont
                  Height: =28
                  OnSelect: =Navigate(scrHome, ScreenTransition.CoverRight)
                  Size: =AppType.Small
                  Text: ="Home"
                  Width: =Gutter * 8
                  X: =Gutter
                  Y: =Gutter
            - lblTitleAdm:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Font: =AppFont
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =AppType.Title
                  Text: ="Admin"
                  Wrap: =false
                  AutoHeight: =false
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =Gutter + 34
            - btnListCust:
                Control: ModernButton
                Properties:
                  Appearance: =If(varAdminList = "Cust", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Customers"
                  Color: =If(varAdminList = "Cust", AppTheme.OnPrimary, AppTheme.Fg)
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =34
                  Width: =(ContentWidth - (Gutter * 2) - 24) / 4
                  X: =Gutter + (((ContentWidth - (Gutter * 2) - 24) / 4) + 8) * 0
                  Y: =Gutter + 80
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Cust")
            - btnListProd:
                Control: ModernButton
                Properties:
                  Appearance: =If(varAdminList = "Prod", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Products"
                  Color: =If(varAdminList = "Prod", AppTheme.OnPrimary, AppTheme.Fg)
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =34
                  Width: =(ContentWidth - (Gutter * 2) - 24) / 4
                  X: =Gutter + (((ContentWidth - (Gutter * 2) - 24) / 4) + 8) * 1
                  Y: =Gutter + 80
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Prod")
            - btnListInst:
                Control: ModernButton
                Properties:
                  Appearance: =If(varAdminList = "Inst", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Installations"
                  Color: =If(varAdminList = "Inst", AppTheme.OnPrimary, AppTheme.Fg)
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =34
                  Width: =(ContentWidth - (Gutter * 2) - 24) / 4
                  X: =Gutter + (((ContentWidth - (Gutter * 2) - 24) / 4) + 8) * 2
                  Y: =Gutter + 80
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Inst")
            - btnListRef:
                Control: ModernButton
                Properties:
                  Appearance: =If(varAdminList = "Ref", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="References"
                  Color: =If(varAdminList = "Ref", AppTheme.OnPrimary, AppTheme.Fg)
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =34
                  Width: =(ContentWidth - (Gutter * 2) - 24) / 4
                  X: =Gutter + (((ContentWidth - (Gutter * 2) - 24) / 4) + 8) * 3
                  Y: =Gutter + 80
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Ref")
            - txtSearchAdm:
                Control: ModernTextInput
                Properties:
                  Type: =TextInputType.Search
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Default: =""
                  Font: =AppFont
                  Height: =40
                  Placeholder: ="Search"
                  Size: =AppType.Body
                  Width: =ContentWidth - (Gutter * 2) - 130
                  X: =Gutter
                  Y: =Gutter + 126
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblAdminOpen:
                Control: ModernText
                Properties:
                  Text: |
                    ="Anyone can reach Admin: TB_Admins is empty. Add yourself to it to lock this down."
                  Color: =AppTheme.Warn
                  Fill: =AppTheme.WarnLight
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  Wrap: =true
                  AutoHeight: =false
                  PaddingTop: =6
                  PaddingBottom: =6
                  X: =Gutter
                  Y: =Gutter + 74
                  Height: =28
                  Width: =ContentWidth - (Gutter * 2)
                  Visible: =CountRows(TB_Admins) = 0
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - btnGuidedSetup:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Outline
                  Icon: ="People"
                  Layout: =ButtonLayout.IconBefore
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Guided setup"
                  Tooltip: ="Add a customer with its solutions and components"
                  Color: =AppTheme.Primary
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =40
                  Width: =150
                  X: =ContentWidth - Gutter - 118 - 8 - 150
                  Y: =Gutter + 126
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  Visible: =varAdminList = "Cust"
                  OnSelect: =Navigate(scrOnboard, ScreenTransition.Cover)
            - btnAddNew:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Primary
                  Icon: ="Add"
                  Layout: =ButtonLayout.IconBefore
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Add new"
                  BorderThickness: =0
                  Height: =40
                  Width: =118
                  X: =ContentWidth - Gutter - 118
                  Y: =Gutter + 126
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: |
                    =Set(varAdminNew, true);
                    Switch(varAdminList,
                        "Cust", Set(varRecCust, Defaults(TB_Customers)),
                        "Prod", Set(varRecProd, Defaults(TB_Products)),
                        "Inst", Set(varRecInst, Defaults(TB_Installations)),
                        "Ref", Set(varRecRef, Defaults(TB_References))
                    );
                    Navigate(scrEditForm, ScreenTransition.Cover)
            - galAdmCust:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_Customers, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
                    )
                  Visible: =varAdminList = "Cust"
                  X: =Gutter
                  Y: =Gutter + 180
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 180) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowCust:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.Description, "no description")
                        OnSelect: |
                          =Set(varRecCust, ThisItem);
                          Set(varAdminNew, false);
                          Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        BorderColor: =AppTheme.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
            - galAdmProd:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_Products, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
                    )
                  Visible: =varAdminList = "Prod"
                  X: =Gutter
                  Y: =Gutter + 180
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 180) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowProd:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.'Product Type'.Value, "no type") & "  |  standard " & Coalesce(ThisItem.'Current Standard Version', "not set")
                        OnSelect: |
                          =Set(varRecProd, ThisItem);
                          Set(varAdminNew, false);
                          Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        BorderColor: =AppTheme.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
            - galAdmInst:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_Installations, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
                    )
                  Visible: =varAdminList = "Inst"
                  X: =Gutter
                  Y: =Gutter + 180
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 180) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowInst:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.Customer.Value, "no customer") & If(IsBlank(ThisItem.'Parent'), "  |  SOLUTION", "  |  unit of " & ThisItem.'Parent'.Value)
                        OnSelect: |
                          =Set(varRecInst, ThisItem);
                          Set(varAdminNew, false);
                          Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        BorderColor: =AppTheme.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
            - galAdmRef:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_References, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
                    )
                  Visible: =varAdminList = "Ref"
                  X: =Gutter
                  Y: =Gutter + 180
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 180) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowRef:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.Product.Value, "no product") & "  |  " & Coalesce(ThisItem.Section.Value, "no section")
                        OnSelect: |
                          =Set(varRecRef, ThisItem);
                          Set(varAdminNew, false);
                          Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        BorderColor: =AppTheme.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
            - lblAdmEmpty:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Align: =Align.Center
                  Color: =AppTheme.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Nothing matches that search."
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =Gutter + 190
                  Visible: =(varAdminList = "Cust" && CountRows(galAdmCust.AllItems) = 0) || (varAdminList = "Prod" && CountRows(galAdmProd.AllItems) = 0) || (varAdminList = "Inst" && CountRows(galAdmInst.AllItems) = 0) || (varAdminList = "Ref" && CountRows(galAdmRef.AllItems) = 0)
