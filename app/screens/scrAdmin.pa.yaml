# Generated by scripts/gen_admin.py - admin record picker.
# One gallery per list, toggled by varAdminList. Each row is a single
# Classic/Button so the whole row is the tap target and the text is the
# button's own Text - no separate label to keep aligned.
Screens:
  scrAdmin:
    Properties:
      Fill: =AppDark.Bg
    Children:
      - lblNoAccessAdm:
          Control: ModernText
          Properties:
            PaddingTop: =0
            PaddingBottom: =0
            Text: ="This area is for administrators."
            Color: =AppDark.Muted
            Font: =AppFont
            Size: =AppType.Body
            Align: =Align.Center
            Wrap: =true
            AutoHeight: =false
            Height: =44
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height / 2 - 60
            Visible: =!varIsAdmin
      - btnNoAccessHomeAdm:
          Control: ModernButton
          Properties:
            Color: =AppDark.Fg
            Appearance: =ButtonAppearance.Outline
            Text: ="Back to home"
            BorderColor: =AppDark.Line
            BorderThickness: =1
            Font: =AppFont
            Size: =AppType.Body
            Height: =44
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =Parent.Height / 2
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Visible: =!varIsAdmin
            OnSelect: =Navigate(scrHome, ScreenTransition.UnCoverRight)
      - conRootAdm:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Visible: =varIsAdmin
            Fill: =AppDark.Bg
            Height: =Parent.Height
            Width: =ContentWidth
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
          Children:
            - recAdmBand:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =56
                  Fill: =AppDark.Brand
            - imgWordmarkAdm:
                Control: Image
                Properties:
                  X: =Parent.Width - Gutter - 96
                  Y: =20
                  Width: =96
                  Height: =15
                  Image: |
                    ="data:image/png;base64,"
            - btnBackAdm:
                Control: ModernButton
                Properties:
                  Color: =AppDark.Fg
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  Text: ="Home"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  BorderThickness: =0
                  X: =Gutter - 8
                  Y: =6
                  Width: =140
                  Height: =44
                  OnSelect: |
                    =Navigate(scrHome, ScreenTransition.CoverRight)
            - lblTitleAdm:
                Control: ModernText
                Properties:
                  Color: =AppDark.Fg
                  PaddingTop: =0
                  PaddingBottom: =0
                  Font: =AppFont
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =AppType.Title
                  Text: ="Admin"
                  Wrap: =false
                  AutoHeight: =false
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =56 + Gutter + 34
            - btnListCust:
                Control: ModernButton
                Properties:
                  Appearance: =If(varAdminList = "Cust", ButtonAppearance.Primary, ButtonAppearance.Outline)
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Customers"
                  Color: =If(varAdminList = "Cust", AppDark.OnBrand, AppDark.Fg)
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Height: =44
                  Width: =If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7)
                  X: =Gutter + (If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7) + 8) * If(IsNarrow, 0, 0)
                  Y: =56 + Gutter + 80 + If(IsNarrow, 0, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Cust")
            - btnListProd:
                Control: ModernButton
                Properties:
                  Appearance: =If(varAdminList = "Prod", ButtonAppearance.Primary, ButtonAppearance.Outline)
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Products"
                  Color: =If(varAdminList = "Prod", AppDark.OnBrand, AppDark.Fg)
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Height: =44
                  Width: =If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7)
                  X: =Gutter + (If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7) + 8) * If(IsNarrow, 1, 1)
                  Y: =56 + Gutter + 80 + If(IsNarrow, 0, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Prod")
            - btnListInst:
