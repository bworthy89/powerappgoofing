                  X: =Gutter + (If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7) + 8) * If(IsNarrow, 0, 4)
                  Y: =56 + Gutter + 80 + If(IsNarrow, 52, 0)
