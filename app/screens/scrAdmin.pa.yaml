                  BorderThickness: =1
                  Height: =44
                  Width: =If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7)
                  X: =Gutter + (If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7) + 8) * If(IsNarrow, 2, 6)
                  Y: =56 + Gutter + 80 + If(IsNarrow, 52, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Acc")
            - txtSearchAdm:
                Control: ModernTextInput
                Properties:
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
