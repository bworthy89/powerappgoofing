# Generated by scripts/gen_admin.py - admin record picker.
# One gallery per list, toggled by varAdminList. Each row is a single
# Classic/Button so the whole row is the tap target and the text is the
# button's own Text - no separate label to keep aligned.
Screens:
  scrAdmin:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRootAdm:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =AppTheme.Bg
            Height: =Parent.Height
            Width: =ContentWidth
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
          Children:
            - btnBackAdm:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =AppTheme.Primary
                  Fill: =AppTheme.Bg
                  Font: =AppFont
                  Height: =28
                  HoverColor: =AppTheme.PrimaryDark
                  HoverFill: =AppTheme.Sunken
                  OnSelect: =Navigate(scrHome, ScreenTransition.CoverRight)
                  Size: =AppType.Small
                  Text: ="<  Home"
                  Width: =Gutter * 8
                  X: =Gutter
                  Y: =Gutter
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
            - lblTitleAdm:
                Control: Label
                Properties:
                  Color: =AppTheme.Fg
                  Font: =AppFont
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =AppType.Title
                  Text: ="Admin"
                  Wrap: =false
                  AutoHeight: =false
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =Gutter + 34
            - btnListCust:
                Control: Classic/Button
                Properties:
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Customers"
                  Fill: =If(varAdminList = "Cust", AppTheme.Primary, AppTheme.Surface)
                  Color: =If(varAdminList = "Cust", AppTheme.OnPrimary, AppTheme.Fg)
                  HoverFill: =If(varAdminList = "Cust", AppTheme.PrimaryDark, AppTheme.Sunken)
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =34
                  Width: =(ContentWidth - (Gutter * 2) - 24) / 4
                  X: =Gutter + (((ContentWidth - (Gutter * 2) - 24) / 4) + 8) * 0
                  Y: =Gutter + 80
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Cust")
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
            - btnListProd:
                Control: Classic/Button
                Properties:
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Products"
                  Fill: =If(varAdminList = "Prod", AppTheme.Primary, AppTheme.Surface)
                  Color: =If(varAdminList = "Prod", AppTheme.OnPrimary, AppTheme.Fg)
                  HoverFill: =If(varAdminList = "Prod", AppTheme.PrimaryDark, AppTheme.Sunken)
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =34
                  Width: =(ContentWidth - (Gutter * 2) - 24) / 4
                  X: =Gutter + (((ContentWidth - (Gutter * 2) - 24) / 4) + 8) * 1
                  Y: =Gutter + 80
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Prod")
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
            - btnListInst:
                Control: Classic/Button
                Properties:
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Installations"
                  Fill: =If(varAdminList = "Inst", AppTheme.Primary, AppTheme.Surface)
                  Color: =If(varAdminList = "Inst", AppTheme.OnPrimary, AppTheme.Fg)
                  HoverFill: =If(varAdminList = "Inst", AppTheme.PrimaryDark, AppTheme.Sunken)
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =34
                  Width: =(ContentWidth - (Gutter * 2) - 24) / 4
                  X: =Gutter + (((ContentWidth - (Gutter * 2) - 24) / 4) + 8) * 2
                  Y: =Gutter + 80
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Inst")
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
            - btnListRef:
                Control: Classic/Button
                Properties:
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="References"
                  Fill: =If(varAdminList = "Ref", AppTheme.Primary, AppTheme.Surface)
                  Color: =If(varAdminList = "Ref", AppTheme.OnPrimary, AppTheme.Fg)
                  HoverFill: =If(varAdminList = "Ref", AppTheme.PrimaryDark, AppTheme.Sunken)
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Height: =34
                  Width: =(ContentWidth - (Gutter * 2) - 24) / 4
                  X: =Gutter + (((ContentWidth - (Gutter * 2) - 24) / 4) + 8) * 3
                  Y: =Gutter + 80
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Ref")
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
            - txtSearchAdm:
                Control: Classic/TextInput
                Properties:
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  Color: =AppTheme.Fg
                  Default: =""
                  Fill: =AppTheme.Surface
                  Font: =AppFont
                  Height: =40
                  HintText: ="Search"
                  Size: =AppType.Body
                  Width: =ContentWidth - (Gutter * 2) - 130
                  X: =Gutter
                  Y: =Gutter + 126
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - btnAddNew:
                Control: Classic/Button
                Properties:
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="+  Add new"
                  Fill: =AppTheme.Ok
                  Color: =AppTheme.OnPrimary
                  HoverFill: =AppTheme.Primary
                  BorderThickness: =0
                  Height: =40
                  Width: =118
                  X: =ContentWidth - Gutter - 118
                  Y: =Gutter + 126
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: |
                    =Set(varAdminNew, true);
                    Switch(varAdminList,
                        "Cust", Set(varRecCust, Defaults(TB_Customers)),
                        "Prod", Set(varRecProd, Defaults(TB_Products)),
                        "Inst", Set(varRecInst, Defaults(TB_Installations)),
                        "Ref", Set(varRecRef, Defaults(TB_References))
                    );
                    Navigate(scrEditForm, ScreenTransition.Cover)
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
            - galAdmCust:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_Customers, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
                    )
                  Visible: =varAdminList = "Cust"
                  X: =Gutter
                  Y: =Gutter + 180
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 180) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowCust:
                      Control: Classic/Button
                      Properties:
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.Description, "no description")
                        OnSelect: |
                          =Set(varRecCust, ThisItem);
                          Set(varAdminNew, false);
                          Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Fg
                        Fill: =AppTheme.Surface
                        HoverFill: =AppTheme.PrimaryLight
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =AppTheme.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
            - galAdmProd:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_Products, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
                    )
                  Visible: =varAdminList = "Prod"
                  X: =Gutter
                  Y: =Gutter + 180
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 180) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowProd:
                      Control: Classic/Button
                      Properties:
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.'Product Type'.Value, "no type") & "  |  standard " & Coalesce(ThisItem.'Current Standard Version', "not set")
                        OnSelect: |
                          =Set(varRecProd, ThisItem);
                          Set(varAdminNew, false);
                          Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Fg
                        Fill: =AppTheme.Surface
                        HoverFill: =AppTheme.PrimaryLight
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =AppTheme.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
            - galAdmInst:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_Installations, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
                    )
                  Visible: =varAdminList = "Inst"
                  X: =Gutter
                  Y: =Gutter + 180
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 180) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowInst:
                      Control: Classic/Button
                      Properties:
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.Customer.Value, "no customer") & If(IsBlank(ThisItem.'Parent'), "  |  SOLUTION", "  |  unit of " & ThisItem.'Parent'.Value)
                        OnSelect: |
                          =Set(varRecInst, ThisItem);
                          Set(varAdminNew, false);
                          Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Fg
                        Fill: =AppTheme.Surface
                        HoverFill: =AppTheme.PrimaryLight
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =AppTheme.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
            - galAdmRef:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_References, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
                    )
                  Visible: =varAdminList = "Ref"
                  X: =Gutter
                  Y: =Gutter + 180
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 180) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowRef:
                      Control: Classic/Button
                      Properties:
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.Product.Value, "no product") & "  |  " & Coalesce(ThisItem.Section.Value, "no section")
                        OnSelect: |
                          =Set(varRecRef, ThisItem);
                          Set(varAdminNew, false);
                          Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Fg
                        Fill: =AppTheme.Surface
                        HoverFill: =AppTheme.PrimaryLight
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =AppTheme.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
            - lblAdmEmpty:
                Control: Label
                Properties:
                  Align: =Align.Center
                  Color: =AppTheme.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Nothing matches that search."
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =Gutter + 190
                  Visible: =(varAdminList = "Cust" && CountRows(galAdmCust.AllItems) = 0) || (varAdminList = "Prod" && CountRows(galAdmProd.AllItems) = 0) || (varAdminList = "Inst" && CountRows(galAdmInst.AllItems) = 0) || (varAdminList = "Ref" && CountRows(galAdmRef.AllItems) = 0)
