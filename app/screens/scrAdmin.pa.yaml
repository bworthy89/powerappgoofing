                  Y: =56 + Gutter + 180 + If(IsNarrow, 52, 0)
                  Width: =ContentWidth - (Gutter * 2)
                  Height: =Parent.Height - (56 + Gutter + 180 + If(IsNarrow, 52, 0)) - Gutter
                  TemplateSize: =44
                  TemplatePadding: =6
                  ShowScrollbar: =true
                Children:
                  - btnRowCust:
                      Control: ModernButton
                      Properties:
                        Color: =AppDark.Fg
                        Appearance: =ButtonAppearance.Outline
                        Text: |
                          =ThisItem.Title & " - " & Coalesce(ThisItem.Description, "no description")
                        OnSelect: |
                          =Set(varRecCust, ThisItem);
                          Set(varAdminNew, false);
                          Set(varAdminReturn, scrAdmin); Set(varStCustomerInst, Blank()); Set(varStParentInst, Blank()); Set(varStProductInst, Blank()); Set(varStProductRef, Blank()); Set(varStProductSwVer, Blank()); Set(varStSolutionSolU, Blank()); Set(varStUnitSolU, Blank()); Navigate(scrEditForm, ScreenTransition.Cover)
                        Align: =Align.Left
                        Font: =AppFont
                        Size: =AppType.Small
                        BorderColor: =AppDark.LineSoft
                        BorderThickness: =1
                        PaddingLeft: =12
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
            - galAdmProd:
