                      Control: ModernButton
                      Properties:
                        Color: =AppDark.OnBrand
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =AppDark.Ok
                        OnSelect: |
                          =Patch(TB_Admins, ThisItem, { Status: { Value: "Approved" } })
                        Text: ="Approve"
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        BorderThickness: =0
                        X: =Parent.TemplateWidth - 200
                        Y: =8
                        Width: =92
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Visible: =ThisItem.Status.Value <> "Approved"
                  - btnAccDeny:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =AppDark.DangerSolid
                        OnSelect: |
                          =Patch(TB_Admins, ThisItem, { Status: { Value: "Denied" } })
                        Text: ="Deny"
                        Font: =AppFont
                        Size: =AppType.Small
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Danger
                        BorderColor: =AppDark.Danger
                        BorderThickness: =1
                        X: =Parent.TemplateWidth - 100
                        Y: =8
                        Width: =92
                        Height: =44
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Visible: =ThisItem.Status.Value <> "Denied"
            - lblAccEmpty:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="No access requests. The first admin is added to TB_Admins directly in SharePoint; everyone after that asks here."
                  Align: =Align.Center
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  Wrap: =true
                  AutoHeight: =false
                  X: =Gutter
                  Y: =56 + Gutter + 200 + If(IsNarrow, 52, 0)
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  Visible: =varAdminList = "Acc" && CountRows(TB_Admins) = 0
            - lblAdmEmpty:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Align: =Align.Center
                  Color: =AppDark.Muted
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Nothing matches that search."
                  Height: =40
                  Width: =ContentWidth - (Gutter * 2)
                  X: =Gutter
                  Y: =56 + Gutter + 190 + If(IsNarrow, 52, 0)
                  Visible: =(varAdminList = "Cust" && CountRows(galAdmCust.AllItems) = 0) || (varAdminList = "Prod" && CountRows(galAdmProd.AllItems) = 0) || (varAdminList = "Inst" && CountRows(galAdmInst.AllItems) = 0) || (varAdminList = "SolU" && CountRows(galAdmSolU.AllItems) = 0) || (varAdminList = "SwVer" && CountRows(galAdmSwVer.AllItems) = 0) || (varAdminList = "Ref" && CountRows(galAdmRef.AllItems) = 0)
