                  Height: =44
                  Width: =If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7)
                  X: =Gutter + (If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7) + 8) * If(IsNarrow, 2, 2)
                  Y: =56 + Gutter + 80 + If(IsNarrow, 0, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "Inst")
            - btnListSolU:
                Control: ModernButton
                Properties:
                  Appearance: =If(varAdminList = "SolU", ButtonAppearance.Primary, ButtonAppearance.Outline)
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Solution units"
                  Color: =If(varAdminList = "SolU", AppDark.OnBrand, AppDark.Fg)
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  Height: =44
                  Width: =If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7)
                  X: =Gutter + (If(IsNarrow, (ContentWidth - (Gutter * 2) - 24) / 4, (ContentWidth - (Gutter * 2) - 48) / 7) + 8) * If(IsNarrow, 3, 3)
                  Y: =56 + Gutter + 80 + If(IsNarrow, 0, 0)
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Set(varAdminList, "SolU")
            - btnListSwVer:
