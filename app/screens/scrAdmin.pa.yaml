            - btnAddNew:
                Control: ModernButton
                Properties:
                  BasePaletteColor: =AppDark.Accent
                  Color: =AppDark.OnBrand
                  Appearance: =ButtonAppearance.Primary
                  Icon: ="Add"
                  Layout: =ButtonLayout.IconBefore
                  Font: =AppFont
                  Size: =AppType.Small
                  Text: ="Add new"
                  BorderThickness: =0
                  Height: =40
                  Width: =118
                  X: =ContentWidth - Gutter - 118
                  Y: =56 + Gutter + 126 + If(IsNarrow, 52, 0)
                  Visible: =varAdminList <> "Acc"
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: |
                    =Set(varAdminNew, true);
                    Switch(varAdminList,
                        "Cust", Set(varRecCust, Defaults(TB_Customers)),
                        "Prod", Set(varRecProd, Defaults(TB_Products)),
                        "Inst", Set(varRecInst, Defaults(TB_Installations)),
                        "SolU", Set(varRecSolU, Defaults(TB_SolutionUnits)),
                        "SwVer", Set(varRecSwVer, Defaults(TB_SoftwareVersions)),
                        "Ref", Set(varRecRef, Defaults(TB_References))
                    );
                    Set(varAdminReturn, scrAdmin); Set(varStCustomerInst, Blank()); Set(varStParentInst, Blank()); Set(varStProductInst, Blank()); Set(varStProductRef, Blank()); Set(varStProductSwVer, Blank()); Set(varStSolutionSolU, Blank()); Set(varStUnitSolU, Blank()); Navigate(scrEditForm, ScreenTransition.Cover)
            - galAdmCust:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |
                    =SortByColumns(
                        Filter(TB_Customers, StartsWith(Title, Trim(txtSearchAdm.Text))),
                        "Title",
                        SortOrder.Ascending
