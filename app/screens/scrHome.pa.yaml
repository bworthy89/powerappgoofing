# Screen — Home
# The landing screen: reached from App.StartScreen, so it is the only screen that never
# has varCustomer or varInstallation pre-set from an incoming Navigate. It is built last
# because scrCustomerOverview, scrCatalogue, scrSolution and scrUnit must
# already exist for its formulas (and App.StartScreen naming this screen) to resolve —
# the same forward-reference condition already accepted for scrUnit in
# scrCustomerOverview and for scrHome itself in App.StartScreen.
#
# Two mutually exclusive regions share the same Y origin (realised below as
# lblSearchCustomersHead.Y): the three search-result galleries, visible only while
# txtSearchHome has at least two characters, and the action cards, visible the rest of
# the time.
#
# Home shows no data. A first attempt made it the customer list, which read as a
# dashboard - efficient for someone who already knows the app, silent for anyone who
# does not. It now names what a technician can do and explains each, and the customer
# list is back on its own screen. That costs one extra tap to reach a site, and is the
# deliberate trade.
#
# Setting up a new customer is not on here: it is an administrative job, and lives on
# scrAdmin's Customers list as "Guided setup".
# See plans/2026-08-21-home-as-customer-list-design.md.
# Every control in the dashboard region repeats
# "Len(Trim(txtSearchHome.Text)) < 2" in its own Visible so the two regions never render on
# top of each other — the same repeated-guard idiom scrCatalogue uses across
# lblDocsHeading / galModelDocs / lblNoModelDocs.
#
# All vertical positions below txtSearchHome are chained through cross-control property
# references (controlName.Y, controlName.Height, controlName.Visible) rather than by
# repeating the arithmetic that produces them. This environment forbids locally
# introduced names (no With/As/AddColumns), but a formula in one control reading a
# PROPERTY of another control is ordinary Power Fx and is already proven in the accepted
# screens (Parent.Height, CountRows(galSolutions.AllItems), CountRows(galModelDocs.AllItems)).
# Chaining this way means the vertical rhythm of the screen has exactly one author per
# offset, which is deliberately the opposite of the proportion bar below, where the
# environment leaves no such escape and the same CountRows(...) has to be retyped.
#
# Search — three sources, three galleries. Power Fx cannot union TB_Customers,
# TB_Products and TB_References without a locally-introduced name (no AddColumns, no
# With), so this is three separate, independently-scrolling galleries stacked with
# cumulative offsets, each Visible only once the search has two characters and that
# gallery actually has rows. Customers and products match StartsWith(Title, ...);
# documents match Trim(txtSearchHome.Text) in Title, exactly as briefed. Search rows are
# deliberately lighter than the full browse rows below and in scrCatalogue (no
# currency chip) — this is a way-finder, not a second copy of those screens, and every
# extra TB_Installations query here would be one more place the retired-row exclusion
# has to be re-verified for no real benefit.
#
# Backlog card — the three things this card must get right:
#   1. lblBacklogFigure counts INSTALLATION ROWS that are off standard (Status not
#      Retired, Installed Version not blank, and not equal to the product's Current
#      Standard Version). lblBacklogCaption spells out "installations", never
#      "machines" or "customers".
#   2. lblUnknownCount is its own line, counting rows with a blank Installed Version.
#      It is never added into the on-standard or off-standard side of anything. The
#      proportion bar below reflects this by construction, not by a written-out
#      "unknown" segment: rectOnStandard and rectOffStandard are each sized against the
#      SAME denominator (all non-retired installations), so whatever neither segment's
#      width accounts for is exactly the not-recorded count, and it stays the
#      background track colour (AppTheme.Sunken) rather than being painted into either
#      status colour.
#   3. Every one of the five TB_Installations queries on this screen (lblBacklogFigure,
#      lblBacklogCaption, lblUnknownCount, rectOnStandard.Width, rectOffStandard.Width)
#      opens with "Status.Value <> "Retired"" as its own Filter argument — checked
#      individually below, not inherited from a shared list, since nothing here is
#      shared except literal repeated text.
#
# rectOnStandard.Width and rectOffStandard.Width both divide by
# Max(CountRows(Filter(TB_Installations, Status.Value <> "Retired")), 1). On an empty
# TB_Installations (day one, before any data exists) that denominator evaluates to
# Max(0, 1) = 1, every numerator CountRows(...) is also 0, so both widths evaluate to
# (Parent.Width - 6) * 0 = 0 — no division by zero, and the bar renders as an empty
# track rather than erroring.
#
# The repeated CountRows(Filter(TB_Installations, Status.Value <> "Retired")) denominator
# appears three times (lblBacklogCaption, rectOnStandard.Width, rectOffStandard.Width)
# character-for-character identical by construction — it was typed once and copied, not
# retyped from memory each time, specifically to avoid the divergence-between-copies bug
# this workaround invites.
#
# conDashboard collapses to one column below the breakpoint the same proven way as
# every other responsive element on this screen: ManualLayout with an If(scrHome.Size = ScreenSize.Small, ...)
# on each card's X/Y/Width, exactly like the support-notes branch in
# scrCustomerOverview and the expanded-model branch in scrCatalogue. An AutoLayout
# GroupContainer (Variant: AutoLayout, formula-driven LayoutDirection) was tried first
# since the brief gave the LayoutDirection formula verbatim, but it was the one
# construct on this screen with no precedent in the other five accepted files and its
# Variant/LayoutGap property names were unverifiable against this environment — on
# review, flattened to ManualLayout, which costs one edit and removes the only
# first-screen-loaded gamble on the page.
#
Screens:
  scrHome:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRootHome:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
            Y: =0
            Width: =ContentWidth
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - lblTitleHome:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =Gutter
                  Width: =Parent.Width - (Gutter * 2) - If(IsNarrow, 60, 130)
                  Height: =40
                  Text: ="Technician Toolbox"
                  Font: =AppFont
                  Size: =AppType.Title
                  FontWeight: =FontWeight.Bold
            # Admin sits in the header, not on a card. It is not a technician task, and a
            # card would say it was.
            # Occupies the same slot as the Admin button, for whoever is not one. Home
            # gains nothing new to look at, and the app never shows a door that will
            # not open.
            - btnRequestAccess:
                Control: ModernButton
                Properties:
                  Visible: =!varIsAdmin
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="People"
                  Layout: =If(IsNarrow, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                  Text: ="Request access"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppTheme.Muted
                  BorderThickness: =0
                  Height: =32
                  Width: =If(IsNarrow, 44, 170)
                  X: =Parent.Width - Gutter - If(IsNarrow, 44, 170)
                  Y: =Gutter + 4
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Navigate(scrRequestAccess, ScreenTransition.Cover)
            - btnTileAdmin:
                Control: ModernButton
                Properties:
                  Visible: =varIsAdmin
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="Settings"
                  Layout: =If(IsNarrow, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                  Text: ="Admin"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppTheme.Muted
                  BorderThickness: =0
                  Height: =32
                  Width: =If(IsNarrow, 44, 110)
                  X: =Parent.Width - Gutter - If(IsNarrow, 44, 110)
                  Y: =Gutter + 4
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Navigate(scrAdmin, ScreenTransition.Cover)
            - txtSearchHome:
                Control: ModernTextInput
                Properties:
                  Type: =TextInputType.Search
                  X: =Gutter
                  Y: =lblTitleHome.Y + lblTitleHome.Height + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =44
                  Default: =""
                  Placeholder: ="Search customers, models, documents"
                  Font: =AppFont
                  Size: =AppType.Body
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblSearchCustomersHead:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="Customers"
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Muted
                  Visible: =galSearchCustomers.Visible
            - galSearchCustomers:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y + lblSearchCustomersHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =170
                  TemplateSize: =56
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Visible: =Len(Trim(txtSearchHome.Text)) >= 2 && CountRows(Self.AllItems) > 0
                  Items: =Filter(TB_Customers, Active = true, StartsWith(Title, Trim(txtSearchHome.Text)))
                  OnSelect: |
                    =Set(varCustomer, ThisItem);
                    Navigate(scrCustomerOverview, ScreenTransition.Cover)
                Children:
                  - lblSrchCustName:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =8
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                  - lblSrchCustDesc:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =true
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =32
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =34
                        Text: =Coalesce(ThisItem.Description, "No description")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galSearchCustomersHit:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblSearchProductsHead:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =lblSearchCustomersHead.Y + If(
                        galSearchCustomers.Visible,
                        lblSearchCustomersHead.Height + 4 + galSearchCustomers.Height + Gutter,
                        0
                    )
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="Models"
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Muted
                  Visible: =galSearchProducts.Visible
            - galSearchProducts:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: =lblSearchProductsHead.Y + lblSearchProductsHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =170
                  TemplateSize: =56
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Visible: =Len(Trim(txtSearchHome.Text)) >= 2 && CountRows(Self.AllItems) > 0
                  Items: =Filter(TB_Products, Active = true, StartsWith(Title, Trim(txtSearchHome.Text)))
                  OnSelect: |
                    =Set(varExpandedModel, ThisItem.ID);
                    Navigate(scrCatalogue, ScreenTransition.Cover)
                Children:
                  - lblSrchProdName:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =8
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                  - lblSrchProdMeta:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =32
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =18
                        Text: |
                          =ThisItem.'Product Type'.Value & "  •  " &
                          Coalesce(ThisItem.'Current Standard Version', "no standard set")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galSearchProductsHit:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblSearchDocsHead:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =lblSearchProductsHead.Y + If(
                        galSearchProducts.Visible,
                        lblSearchProductsHead.Height + 4 + galSearchProducts.Height + Gutter,
                        0
                    )
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="Documents"
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Muted
                  Visible: =galSearchDocs.Visible
            - galSearchDocs:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: =lblSearchDocsHead.Y + lblSearchDocsHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =170
                  TemplateSize: =56
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Visible: =Len(Trim(txtSearchHome.Text)) >= 2 && CountRows(Self.AllItems) > 0
                  # IsBlank(Customer.Value) restricts this search to universal documents only,
                  # the same reasoning scrCatalogue documents at its own document panel: this
                  # screen has no customer in context, so a customer-specific reference here
                  # would surface one customer's private procedure to every technician who
                  # types a matching word — a real disclosure problem, not a hypothetical one.
                  Items: =Filter(TB_References, Trim(txtSearchHome.Text) in Title, IsBlank(Customer))
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - lblSrchDocTitle:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =8
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppTheme.Faint, AppTheme.Fg)
                  - lblSrchDocMeta:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =32
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =18
                        Text: |
                          =If(!IsBlank(ThisItem.Product.Value), LookUp(TB_Products, ID = ThisItem.Product.Id).Title, "") &
                          If(!IsBlank(ThisItem.Customer.Value), "  •  " & LookUp(TB_Customers, ID = ThisItem.Customer.Id).Title, "")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galSearchDocsHit:
                      Control: Classic/Button
                      Properties:
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppTheme.Primary
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblNoSearchResults:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No matches for this search."
                  Visible: |
                    =Len(Trim(txtSearchHome.Text)) >= 2 &&
                    CountRows(galSearchCustomers.AllItems) = 0 &&
                    CountRows(galSearchProducts.AllItems) = 0 &&
                    CountRows(galSearchDocs.AllItems) = 0
            # The heading that makes this a home screen rather than a list: it names the
            # question the cards below answer.
            - lblPromptHome:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: |
                    ="Hi " & Coalesce(Match(User().FullName, ",\s*(?<fn>[^\s(,]+)").fn, Match(User().FullName, "^\s*(?<fn>[^\s(,]+)").fn, "there") & ", what do you need?"
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =26
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - btnActCustomers:
                Control: Classic/Button
                Properties:
                  Text: =""
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y + 38
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =88
                  Fill: =AppTheme.Surface
                  HoverFill: =AppTheme.Sunken
                  PressedFill: =AppTheme.PrimaryLight
                  BorderColor: =AppTheme.LineSoft
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - icoActCustomers:
                Control: ModernIcon
                Properties:
                  Icon: ="People"
                  IconColor: =AppTheme.Primary
                  IconStyle: =IconStyle.Outline
                  X: =Gutter + 20
                  Y: =lblSearchCustomersHead.Y + 38 + 28
                  Width: =32
                  Height: =32
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - lblActCustomersTitle:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Find a customer"
                  X: =Gutter + 72
                  Y: =lblSearchCustomersHead.Y + 38 + 22
                  Width: =Parent.Width - (Gutter * 2) - 96
                  Height: =24
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - lblActCustomersDesc:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="See what a site runs, and its documents"
                  X: =Gutter + 72
                  Y: =lblSearchCustomersHead.Y + 38 + 48
                  Width: =Parent.Width - (Gutter * 2) - 96
                  Height: =20
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - btnActCustomersHit:
                Control: Classic/Button
                Properties:
                  Text: =""
                  OnSelect: =Navigate(scrCustomers, ScreenTransition.Cover)
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y + 38
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =88
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0.04)
                  PressedFill: =RGBA(0, 87, 184, 0.10)
                  BorderThickness: =0
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - btnActCatalogue:
                Control: Classic/Button
                Properties:
                  Text: =""
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y + 138
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =88
                  Fill: =AppTheme.Surface
                  HoverFill: =AppTheme.Sunken
                  PressedFill: =AppTheme.PrimaryLight
                  BorderColor: =AppTheme.LineSoft
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - icoActCatalogue:
                Control: ModernIcon
                Properties:
                  Icon: ="Document"
                  IconColor: =AppTheme.Primary
                  IconStyle: =IconStyle.Outline
                  X: =Gutter + 20
                  Y: =lblSearchCustomersHead.Y + 138 + 28
                  Width: =32
                  Height: =32
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - lblActCatalogueTitle:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Browse the catalogue"
                  X: =Gutter + 72
                  Y: =lblSearchCustomersHead.Y + 138 + 22
                  Width: =Parent.Width - (Gutter * 2) - 96
                  Height: =24
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Semibold
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - lblActCatalogueDesc:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  Text: ="Manuals, guides and standard versions"
                  X: =Gutter + 72
                  Y: =lblSearchCustomersHead.Y + 138 + 48
                  Width: =Parent.Width - (Gutter * 2) - 96
                  Height: =20
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - btnActCatalogueHit:
                Control: Classic/Button
                Properties:
                  Text: =""
                  OnSelect: =Navigate(scrCatalogue, ScreenTransition.Cover)
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y + 138
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =88
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0.04)
                  PressedFill: =RGBA(0, 87, 184, 0.10)
                  BorderThickness: =0
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppTheme.Primary
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2