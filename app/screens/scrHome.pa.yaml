# Screen — Home  (GENERATED by scripts/gen_home.py — edit the generator, not this file)
#
# Generate scrHome as a dark, brand-led screen.
#
# See the generator's docstring for why this is a rebuild rather than a restyle, why the
# accent is not the brand colour, and how the SVG panels are constructed.
#
# Two mutually exclusive regions share one origin, exactly as before: the three search
# galleries when the box has two or more characters, and the action cards otherwise. Every
# control in both regions repeats its own Len(Trim(txtSearchHome.Text)) guard, because this
# environment has no shared-state construct that a Visible can read.

Screens:
  scrHome:
    Properties:
      Fill: =AppDark.Bg
      OnVisible: =Set(varExpandedModel, 0)
    Children:
      - conHomeRoot:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =AppDark.Bg
          Children:
            # ---- brand band
            # Full-bleed #111987 with the real wordmark on it. This is Glory's own lockup,
            # not a tint of it: the artwork is white-on-#111987 and so is this.
            - recBrandBand:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =72
                  Fill: =AppDark.Brand
            - imgWordmarkHome:
                Control: Image
                Properties:
                  X: =Gutter
                  Y: =27
                  Width: =112
                  Height: =18
                  Image: |
                    ="data:image/png;base64,"
            - lblAppNameHome:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter + 126
                  Y: =27
                  Width: =200
                  Height: =18
                  Text: ="TECHNICIAN TOOLBOX"
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(255, 255, 255, 0.62)
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =!IsNarrow
            - btnRequestAccess:
                Control: ModernButton
                Properties:
                  Visible: =!varIsAdmin
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="People"
                  Layout: =If(IsNarrow, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                  Text: ="Request access"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.OnBrand
                  BorderThickness: =0
                  Height: =44
                  Width: =If(IsNarrow, 44, 170)
                  X: =Parent.Width - Gutter - If(IsNarrow, 44, 170)
                  Y: =14
                  OnSelect: =Navigate(scrRequestAccess, ScreenTransition.Cover)
            - btnTileAdmin:
                Control: ModernButton
                Properties:
                  Visible: =varIsAdmin
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="Settings"
                  Layout: =If(IsNarrow, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                  Text: ="Admin"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.OnBrand
                  BorderThickness: =0
                  Height: =44
                  Width: =If(IsNarrow, 44, 110)
                  X: =Parent.Width - Gutter - If(IsNarrow, 44, 110)
                  Y: =14
                  OnSelect: =Navigate(scrAdmin, ScreenTransition.Cover)

            # ---- headline, in two tones
            # The name is the greeting and the question is the instruction, so they are
            # coloured differently rather than run together. The accent carries the half
            # that asks for an action.
            - lblGreetHome:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =72 + 34
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =41
                  Text: |
                    ="Hi " & Coalesce(Match(User().FullName, ",\s*(?<fn>[^\s(,]+)").fn, Match(User().FullName, "^\s*(?<fn>[^\s(,]+)").fn, "there") & ","
                  Font: =AppFont
                  Size: =If(IsNarrow, AppType.Title, AppType.Display)
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Fg
                  Wrap: =false
                  AutoHeight: =false
            - lblAskHome:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =lblGreetHome.Y + lblGreetHome.Height
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =41
                  Text: ="what do you need?"
                  Font: =AppFont
                  Size: =If(IsNarrow, AppType.Title, AppType.Display)
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Accent
                  Wrap: =false
                  AutoHeight: =false

            - txtSearchHome:
                Control: ModernTextInput
                Properties:
                  Type: =TextInputType.Search
                  X: =Gutter
                  Y: =lblAskHome.Y + lblAskHome.Height + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =48
                  Default: =""
                  Placeholder: ="Search customers, models, documents"
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6

            # ---- action card: Find a customer
            # The panel, the icon and the hit target are three separate controls stacked in
            # Z order. The panel is an Image because the shape is SVG; an Image cannot take
            # an OnSelect, so the transparent Classic/Button on top carries the tap.
            - imgCardCustBg:
                Control: Image
                Properties:
                  X: =Gutter
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =104
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
                  Image: |
                    ="data:image/svg+xml;utf8, " & EncodeUrl(
                        "<svg xmlns='http://www.w3.org/2000/svg' width='" & Round(Parent.Width - (Gutter * 2), 0) & "' height='104' viewBox='0 0 " & Round(Parent.Width - (Gutter * 2), 0) & " 104' preserveAspectRatio='none'>" &
                        "<path d='M0 0 H" & Round(Parent.Width - (Gutter * 2) - 18, 0) & " L" & Round(Parent.Width - (Gutter * 2), 0) & " 18 V104 H0 Z' fill='#171A21' stroke='#2A2F3A' stroke-width='1'/>" &
                        "<rect x='0' y='0' width='3' height='104' fill='#6A73E6'/>" 
                    )
            - imgCardCustIcon:
                Control: Image
                Properties:
                  X: =Gutter + 26
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8 + 37
                  Width: =30
                  Height: =30
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
                  Image: |
                    ="data:image/svg+xml;utf8, " & EncodeUrl(
                        "<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 24 24' fill='none' stroke='#6A73E6' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M3 21h18M5 21V8l7-4 7 4v13M9.5 21v-4.5h5V21M9 11.5h.01M15 11.5h.01'/></svg>" 
                    )
            - lblCardCustTitle:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter + 76
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8 + 28
                  Width: =Parent.Width - (Gutter * 2) - 100
                  Height: =26
                  Text: ="Find a customer"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Fg
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - lblCardCustDesc:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter + 76
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8 + 56
                  Width: =Parent.Width - (Gutter * 2) - 100
                  Height: =22
                  Text: ="See what a site runs, and its documents"
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.FgSecondary
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - btnCardCustHit:
                Control: Classic/Button
                Properties:
                  Text: =""
                  OnSelect: =Navigate(scrCustomers, ScreenTransition.Cover)
                  X: =Gutter
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =104
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(106, 115, 230, 0.10)
                  PressedFill: =RGBA(106, 115, 230, 0.18)
                  BorderThickness: =0
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppDark.Accent

            # ---- action card: Browse the catalogue
            # The panel, the icon and the hit target are three separate controls stacked in
            # Z order. The panel is an Image because the shape is SVG; an Image cannot take
            # an OnSelect, so the transparent Classic/Button on top carries the tap.
            - imgCardCatBg:
                Control: Image
                Properties:
                  X: =Gutter
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8 + 104 + 16
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =104
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
                  Image: |
                    ="data:image/svg+xml;utf8, " & EncodeUrl(
                        "<svg xmlns='http://www.w3.org/2000/svg' width='" & Round(Parent.Width - (Gutter * 2), 0) & "' height='104' viewBox='0 0 " & Round(Parent.Width - (Gutter * 2), 0) & " 104' preserveAspectRatio='none'>" &
                        "<path d='M0 0 H" & Round(Parent.Width - (Gutter * 2) - 18, 0) & " L" & Round(Parent.Width - (Gutter * 2), 0) & " 18 V104 H0 Z' fill='#171A21' stroke='#2A2F3A' stroke-width='1'/>" &
                        "<rect x='0' y='0' width='3' height='104' fill='#6A73E6'/>" 
                    )
            - imgCardCatIcon:
                Control: Image
                Properties:
                  X: =Gutter + 26
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8 + 104 + 16 + 37
                  Width: =30
                  Height: =30
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
                  Image: |
                    ="data:image/svg+xml;utf8, " & EncodeUrl(
                        "<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 24 24' fill='none' stroke='#6A73E6' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='7.5' height='7' rx='1'/><rect x='13.5' y='4' width='7.5' height='7' rx='1'/><rect x='3' y='13' width='7.5' height='7' rx='1'/><rect x='13.5' y='13' width='7.5' height='7' rx='1'/></svg>" 
                    )
            - lblCardCatTitle:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter + 76
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8 + 104 + 16 + 28
                  Width: =Parent.Width - (Gutter * 2) - 100
                  Height: =26
                  Text: ="Browse the catalogue"
                  Font: =AppFont
                  Size: =AppType.Heading
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Fg
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - lblCardCatDesc:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter + 76
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8 + 104 + 16 + 56
                  Width: =Parent.Width - (Gutter * 2) - 100
                  Height: =22
                  Text: ="Every model, its documents and firmware"
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.FgSecondary
                  Wrap: =false
                  AutoHeight: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
            - btnCardCatHit:
                Control: Classic/Button
                Properties:
                  Text: =""
                  OnSelect: =Navigate(scrCatalogue, ScreenTransition.Cover)
                  X: =Gutter
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8 + 104 + 16
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =104
                  Visible: =Len(Trim(txtSearchHome.Text)) < 2
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(106, 115, 230, 0.10)
                  PressedFill: =RGBA(106, 115, 230, 0.18)
                  BorderThickness: =0
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =AppDark.Accent

            - lblSearchCustomersHead:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =txtSearchHome.Y + txtSearchHome.Height + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="CUSTOMERS"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Bold
                  Color: =AppDark.Muted
                  Visible: =galSearchCustomers.Visible
            - galSearchCustomers:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y + lblSearchCustomersHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =Min(CountRows(galSearchCustomers.AllItems), 4) * 56
                  TemplateSize: =56
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) >= 2 && CountRows(galSearchCustomers.AllItems) > 0
                  Items: |
                    =Filter(TB_Customers, Active = true, StartsWith(Title, Trim(txtSearchHome.Text)))
                Children:
                  - lblSrchCustomersName:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =14
                        Y: =8
                        Width: =Parent.TemplateWidth - 28
                        Height: =22
                        Text: |
                          =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Fg
                        Wrap: =false
                        AutoHeight: =false
                  - lblSrchCustomersMeta:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =14
                        Y: =30
                        Width: =Parent.TemplateWidth - 28
                        Height: =18
                        Text: |
                          =Coalesce(ThisItem.Description, "No description")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppDark.Muted
                        Wrap: =false
                        AutoHeight: =false
                  - recSrchCustomersRule:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =55
                        Width: =Parent.TemplateWidth
                        Height: =1
                        Fill: =AppDark.Line
                  - galSearchCustomersHit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: |
                          =Set(varCustomer, ThisItem); Navigate(scrCustomerOverview, ScreenTransition.Cover)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(106, 115, 230, 0.10)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent

            - lblSearchProductsHead:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =lblSearchCustomersHead.Y + If(galSearchCustomers.Visible, galSearchCustomers.Height + 32, 0)
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="MODELS"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Bold
                  Color: =AppDark.Muted
                  Visible: =galSearchProducts.Visible
            - galSearchProducts:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: =lblSearchProductsHead.Y + lblSearchProductsHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =Min(CountRows(galSearchProducts.AllItems), 4) * 56
                  TemplateSize: =56
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) >= 2 && CountRows(galSearchProducts.AllItems) > 0
                  Items: |
                    =Filter(TB_Products, Active = true, StartsWith(Title, Trim(txtSearchHome.Text)))
                Children:
                  - lblSrchProductsName:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =14
                        Y: =8
                        Width: =Parent.TemplateWidth - 28
                        Height: =22
                        Text: |
                          =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Fg
                        Wrap: =false
                        AutoHeight: =false
                  - lblSrchProductsMeta:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =14
                        Y: =30
                        Width: =Parent.TemplateWidth - 28
                        Height: =18
                        Text: |
                          =ThisItem.'Product Type'.Value & "  ·  " & Coalesce(ThisItem.'Current Standard Version', "no standard")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppDark.Muted
                        Wrap: =false
                        AutoHeight: =false
                  - recSrchProductsRule:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =55
                        Width: =Parent.TemplateWidth
                        Height: =1
                        Fill: =AppDark.Line
                  - galSearchProductsHit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: |
                          =Set(varExpandedModel, ThisItem.ID); Navigate(scrCatalogue, ScreenTransition.Cover)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(106, 115, 230, 0.10)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent

            - lblSearchDocsHead:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: |
                    =lblSearchProductsHead.Y + If(galSearchProducts.Visible, galSearchProducts.Height + 32, 0)
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="DOCUMENTS"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Bold
                  Color: =AppDark.Muted
                  Visible: =galSearchDocs.Visible
            - galSearchDocs:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: =lblSearchDocsHead.Y + lblSearchDocsHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =Min(CountRows(galSearchDocs.AllItems), 4) * 56
                  TemplateSize: =56
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  Visible: =Len(Trim(txtSearchHome.Text)) >= 2 && CountRows(galSearchDocs.AllItems) > 0
                  Items: |
                    =Filter(TB_References, Trim(txtSearchHome.Text) in Title, IsBlank(Customer))
                Children:
                  - lblSrchDocsName:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =14
                        Y: =8
                        Width: =Parent.TemplateWidth - 28
                        Height: =22
                        Text: |
                          =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Fg
                        Wrap: =false
                        AutoHeight: =false
                  - lblSrchDocsMeta:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =14
                        Y: =30
                        Width: =Parent.TemplateWidth - 28
                        Height: =18
                        Text: |
                          =If(!IsBlank(ThisItem.Product.Value), LookUp(TB_Products, ID = ThisItem.Product.Id).Title, "")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppDark.Muted
                        Wrap: =false
                        AutoHeight: =false
                  - recSrchDocsRule:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =55
                        Width: =Parent.TemplateWidth
                        Height: =1
                        Fill: =AppDark.Line
                  - galSearchDocsHit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: |
                          =Launch(ThisItem.URL)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(106, 115, 230, 0.10)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent

            - lblNoSearchResults:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =txtSearchHome.Y + txtSearchHome.Height + Gutter + 8
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.Muted
                  Text: ="No matches for this search."
                  Visible: |
                    =Len(Trim(txtSearchHome.Text)) >= 2 &&
                    CountRows(galSearchCustomers.AllItems) = 0 &&
                    CountRows(galSearchProducts.AllItems) = 0 &&
                    CountRows(galSearchDocs.AllItems) = 0
