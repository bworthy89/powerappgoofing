# Screen — Customers
# The simplest screen in the rebuild: a searchable gallery of customers, each row
# showing a three-state currency summary (off standard / not recorded / all on standard).
# Selecting a row sets varCustomer and hands off to scrCustomerOverview. If this pastes
# and renders, the data path and formula idioms are proven for every later screen.
Screens:
  scrCustomers:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRoot:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
            Y: =0
            Width: =ContentWidth
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - btnBack:
                Control: Classic/Button
                Properties:
                  X: =Gutter
                  Y: =Gutter
                  Width: =Gutter * 10
                  Height: =28
                  Text: ="<  Home"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Fill: =AppTheme.Bg
                  HoverFill: =AppTheme.Sunken
                  PressedFill: =AppTheme.Sunken
                  Color: =AppTheme.Primary
                  HoverColor: =AppTheme.PrimaryDark
                  BorderThickness: =0
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Navigate(scrHome, ScreenTransition.CoverRight)
            - lblTitle:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =Gutter + 36
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Text: ="Customers"
                  Font: =AppFont
                  Size: =AppType.Title
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Fg
            - txtSearch:
                Control: Classic/TextInput
                Properties:
                  X: =Gutter
                  Y: =Gutter + 84
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =44
                  Default: =""
                  HintText: ="Search customers"
                  Font: =AppFont
                  Size: =AppType.Body
                  Fill: =AppTheme.Surface
                  Color: =AppTheme.Fg
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - galCustomers:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =Gutter
                  Y: =Gutter + 140
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 140) - Gutter
                  TemplateSize: =88
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_Customers,
                            Active = true,
                            StartsWith(Title, Trim(txtSearch.Text))
                        ),
                        "Title",
                        SortOrder.Ascending
                    )
                  # The four lines below feed scrHome's recently-viewed row (Task 8) —
                  # device-local only, no list involved. Dedupe is RemoveIf(colRecent,
                  # Id = ThisItem.ID), not Distinct: Distinct(Table, Formula) returns a
                  # single-column table named Result rather than the original row, which
                  # would have dropped Name and At and broken scrHome's
                  # Index(colRecent, n).Name references. RemoveIf preserves every column
                  # on every row; trimming to 3 removes the oldest At, not a ClearCollect
                  # of the collection from itself. FALLBACK if Studio rejects
                  # RemoveIf/SaveData here: delete these four lines (the Set line stays,
                  # and Navigate stays as the last line) and remove the recently-viewed
                  # block from scrHome. Navigate runs LAST, after the collection writes —
                  # Navigate unloads this screen, and anything after it in the same
                  # OnSelect would not be guaranteed to run.
                  OnSelect: |
                    =Set(varCustomer, ThisItem);
                    RemoveIf(colRecent, Id = ThisItem.ID);
                    Collect(colRecent, {Id: ThisItem.ID, Name: ThisItem.Title, At: Now()});
                    If(CountRows(colRecent) > 3,
                       RemoveIf(colRecent, At = First(Sort(colRecent, At, SortOrder.Ascending)).At));
                    SaveData(colRecent, "recent");
                    Navigate(scrCustomerOverview, ScreenTransition.Cover)
                Children:
                  - lblName:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =12
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Fg
                  - lblDesc:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =36
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =20
                        Text: =Coalesce(ThisItem.Description, "No description")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                  - rectChip:
                      Control: Rectangle
                      Properties:
                        X: =Gutter
                        Y: =60
                        Width: =Gutter * 8
                        Height: =22
                        BorderThickness: =0
                        RadiusTopLeft: =11
                        RadiusTopRight: =11
                        RadiusBottomLeft: =11
                        RadiusBottomRight: =11
                        Fill: |
                          =If(
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      !IsBlank('Installed Version'),
                                      !IsBlank(LookUp(TB_Products, ID = Product.Id).'Current Standard Version'),
                                      'Installed Version' <> LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                  )
                              ) > 0,
                              AppTheme.WarnLight,
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      IsBlank('Installed Version')
                                  )
                              ) > 0,
                              AppTheme.NeutralLight,
                              CountRows(Filter(TB_Installations, Customer.Id = ThisItem.ID, Status.Value <> "Retired")) = 0,
                              AppTheme.NeutralLight,
                              AppTheme.OkLight
                          )
                  - lblChip:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =60
                        Width: =Gutter * 8
                        Height: =22
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Fg
                        Text: |
                          =If(
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      !IsBlank('Installed Version'),
                                      !IsBlank(LookUp(TB_Products, ID = Product.Id).'Current Standard Version'),
                                      'Installed Version' <> LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                  )
                              ) > 0,
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      !IsBlank('Installed Version'),
                                      !IsBlank(LookUp(TB_Products, ID = Product.Id).'Current Standard Version'),
                                      'Installed Version' <> LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                  )
                              ) & " off standard",
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      IsBlank('Installed Version')
                                  )
                              ) > 0,
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      IsBlank('Installed Version')
                                  )
                              ) & " not recorded",
                              CountRows(Filter(TB_Installations, Customer.Id = ThisItem.ID, Status.Value <> "Retired")) = 0,
                              "nothing recorded",
                              "all on standard"
                          )
            - lblNoCustomers:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =Gutter + 140
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No customers match your search."
                  Visible: =CountRows(galCustomers.AllItems) = 0
