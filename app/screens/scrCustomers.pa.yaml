# Screen — Customers  (GENERATED by scripts/gen_customers.py — edit the generator)
#
# The site list. Rows warn when a site has machines nobody has verified lately and stay quiet
# otherwise - never a green "all good", because an unsurveyed site is indistinguishable from
# a current one in this data. See the generator docstring.
#
# Selecting a row sets varCustomer and hands off to scrCustomerOverview.

Screens:
  scrCustomers:
    Properties:
      Fill: =AppDark.Bg
    Children:
      - conRootCus:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =AppDark.Bg
          Children:
            - recCusBand:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =56
                  Fill: =AppDark.Brand
            - imgWordmarkCus:
                Control: Image
                Properties:
                  X: =Parent.Width - Gutter - 96
                  Y: =20
                  Width: =96
                  Height: =15
                  Image: |
                    ="data:image/png;base64,"
            - btnBackCus:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Icon: ="ChevronLeft"
                  Layout: =ButtonLayout.IconBefore
                  Text: ="Home"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.OnBrand
                  BorderThickness: =0
                  X: =Gutter - 8
                  Y: =6
                  Width: =140
                  Height: =44
                  OnSelect: |
                    =Navigate(scrHome, ScreenTransition.CoverRight)

            - btnAddCust:
                Control: ModernButton
                Properties:
                  Appearance: =ButtonAppearance.Outline
                  Text: ="+  Add a customer"
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Accent
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  X: |
                    =If(IsNarrow, Gutter + 0, Gutter + (Parent.Width - (Gutter * 2)) - 176)
                  Y: |
                    =lblTitleCus.Y + If(IsNarrow, 41, 0)
                  Width: |
                    =168
                  Height: =40
                  Visible: |
                    =varIsAdmin
                  OnSelect: |
                    =Set(varRecCust, Defaults(TB_Customers)); Set(varAdminList, "Cust"); Set(varAdminNew, true); Set(varAdminReturn, scrCustomers); Navigate(scrEditForm, ScreenTransition.Cover)
            - lblTitleCus:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =56 + 24
                  Width: =(Parent.Width - (Gutter * 2)) - If(varIsAdmin && !IsNarrow, 184, 0)
                  Height: =41 + If(varIsAdmin && IsNarrow, 48, 0)
                  Text: ="Customers"
                  Font: =AppFont
                  Size: =If(IsNarrow, AppType.Title, AppType.Display)
                  FontWeight: =FontWeight.Semibold
                  Color: =AppDark.Fg
                  Wrap: =false
                  AutoHeight: =false
            # Says how many rows the search is showing, so an empty-looking list reads as a
            # narrow search rather than as missing data.
            - lblSubtitleCus:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =lblTitleCus.Y + lblTitleCus.Height
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =22
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.FgSecondary
                  Wrap: =false
                  AutoHeight: =false
                  Text: |
                    =CountRows(galCustomers.AllItems) & If(Len(Trim(txtSearchCus.Text)) > 0, " matching", " active") & " site(s)"

            - txtSearchCus:
                Control: ModernTextInput
                Properties:
                  Type: =TextInputType.Search
                  X: =Gutter
                  Y: =lblSubtitleCus.Y + lblSubtitleCus.Height + Gutter
                  Width: =Min(Parent.Width - (Gutter * 2), 620)
                  Height: =48
                  Default: =""
                  Placeholder: ="Search customers"
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.Fg
                  Fill: =AppDark.Surface
                  BorderColor: =AppDark.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6

            - galCustomers:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =Gutter
                  Y: =txtSearchCus.Y + txtSearchCus.Height + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =Max(Parent.Height - (txtSearchCus.Y + txtSearchCus.Height + Gutter) - Gutter, 76)
                  TemplateSize: =86
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_Customers,
                            Active = true,
                            StartsWith(Title, Trim(txtSearchCus.Text))
                        ),
                        "Title",
                        SortOrder.Ascending
                    )
                  OnSelect: |
                    =Set(varCustomer, ThisItem);
                    Navigate(scrCustomerOverview, ScreenTransition.Cover)
                Children:
                  - imgCardCus:
                      Control: Image
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =76
                        Image: |
                          ="data:image/svg+xml;utf8, " & EncodeUrl(
                              "<svg xmlns='http://www.w3.org/2000/svg' width='" & Round(Parent.TemplateWidth, 0) & "' height='76' viewBox='0 0 " & Round(Parent.TemplateWidth, 0) & " 76' preserveAspectRatio='none'>" &
                              "<path d='M0 0 H" & Round(Parent.TemplateWidth - 14, 0) & " L" & Round(Parent.TemplateWidth, 0) & " 14 V76 H0 Z' fill='#171A21' stroke='#2A2F3A' stroke-width='1'/>" &
                              "</svg>"
                          )
                  # CHECK is a non-delegable Filter with a nested LookUp per installation,
                  # so it is evaluated ONCE per row here and read back by the two controls
                  # that need it. Referencing a sibling inside the same gallery template is
                  # row-scoped, which is the same hidden-label idiom used for ForAll over
                  # AllItems elsewhere in this app.
                  - lblCheckCalcCus:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =1
                        Height: =1
                        Visible: =false
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppDark.Muted
                        Text: |
                          =CountRows(Filter(TB_Installations As I, I.Customer.Id = ThisItem.ID, I.Status.Value <> "Retired", (IsBlank(If(!IsBlank(I.'Installed Version'), I.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = ThisItem.ID && Product.Id = I.Product.Id).'Last Verified')) || RoundDown(DateDiff(If(!IsBlank(I.'Installed Version'), I.'Last Verified', LookUp(TB_SoftwareVersions, Customer.Id = ThisItem.ID && Product.Id = I.Product.Id).'Last Verified'), Today(), TimeUnit.Days) / 30.4375, 0) >= 12)))

                  # Amber only when something is known to need checking. Neutral otherwise -
                  # never green, because a verified record and an unexamined one are the
                  # same shape here and only one of them deserves reassurance.
                  - recCardRailCus:
                      Control: Rectangle
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =4
                        Height: =76
                        Fill: |
                          =If(Value(lblCheckCalcCus.Text) > 0, AppDark.Warn, AppDark.Line)
                  - lblName:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =20
                        Y: =14
                        Width: =(Parent.TemplateWidth - 40) * 0.68
                        Height: =26
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Heading
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Fg
                        Wrap: =false
                        AutoHeight: =false
                  - lblDesc:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =20
                        Y: =42
                        Width: =(Parent.TemplateWidth - 40) * 0.68
                        Height: =20
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppDark.Muted
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =CountRows(Filter(TB_Installations, Customer.Id = ThisItem.ID, IsBlank(ThisRecord.'Parent'), Status.Value <> "Retired")) & " solution(s)" & If(IsBlank(ThisItem.Description), "", "  ·  " & ThisItem.Description)
                  # Conditional Text rather than Visible + Text: CHECK is a non-delegable
                  # Filter with a nested LookUp per installation, and a separate Visible
                  # would evaluate it a third time on every row for no visual difference.
                  - lblCheckCus:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        OnSelect: =Select(Parent)
                        X: =20 + ((Parent.TemplateWidth - 40) * 0.68)
                        Y: =28
                        Width: =(Parent.TemplateWidth - 40) * 0.32 - 10
                        Height: =22
                        Align: =Align.Right
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =AppDark.Warn
                        Wrap: =false
                        AutoHeight: =false
                        Text: |
                          =If(Value(lblCheckCalcCus.Text) > 0, lblCheckCalcCus.Text & " to check", "")
                  - galCustomersHit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =76
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(106, 115, 230, 0.10)
                        PressedFill: =RGBA(106, 115, 230, 0.18)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =2
                        FocusedBorderColor: =AppDark.Accent
            - lblNoCustomers:
                Control: ModernText
                Properties:
                  PaddingTop: =0
                  PaddingBottom: =0
                  X: =Gutter
                  Y: =galCustomers.Y
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Font: =AppFont
                  Size: =AppType.Body
                  Color: =AppDark.Muted
                  Visible: =CountRows(galCustomers.AllItems) = 0
                  Text: |
                    =If(Len(Trim(txtSearchCus.Text)) > 0, "No customers start with """ & Trim(txtSearchCus.Text) & """.", "No active customers are on file.")
