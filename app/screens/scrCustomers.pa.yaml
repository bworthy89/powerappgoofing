# Screen — Customers
# The simplest screen in the rebuild: a searchable gallery of customers, each row
# showing a three-state currency summary (off standard / not recorded / all on standard).
# Selecting a row sets varCustomer and hands off to scrCustomerOverview. If this pastes
# and renders, the data path and formula idioms are proven for every later screen.
Screens:
  scrCustomers:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRoot:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
            Y: =0
            Width: =ContentWidth
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - btnBack:
                Control: Classic/Button
                Properties:
                  X: =Gutter
                  Y: =Gutter
                  Width: =Gutter * 10
                  Height: =28
                  Text: ="<  Home"
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Fill: =AppTheme.Bg
                  HoverFill: =AppTheme.Sunken
                  PressedFill: =AppTheme.Sunken
                  Color: =AppTheme.Primary
                  HoverColor: =AppTheme.PrimaryDark
                  BorderThickness: =0
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Navigate(scrHome, ScreenTransition.CoverRight)
            - lblTitle:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =Gutter + 36
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Text: ="Customers"
                  Font: =AppFont
                  Size: =AppType.Title
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Fg
            - txtSearch:
                Control: Classic/TextInput
                Properties:
                  X: =Gutter
                  Y: =Gutter + 84
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =44
                  Default: =""
                  HintText: ="Search customers"
                  Font: =AppFont
                  Size: =AppType.Body
                  Fill: =AppTheme.Surface
                  Color: =AppTheme.Fg
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - galCustomers:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  WrapCount: =Switch(scrCustomers.Size, ScreenSize.Small, 1, ScreenSize.Medium, 1, ScreenSize.Large, 2, 3)
                  X: =Gutter
                  Y: =Gutter + 140
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =Parent.Height - (Gutter + 140) - Gutter
                  TemplateSize: =104
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_Customers,
                            Active = true,
                            StartsWith(Title, Trim(txtSearch.Text))
                        ),
                        "Title",
                        SortOrder.Ascending
                    )
                  # The four lines below feed scrHome's recently-viewed row (Task 8) —
                  # device-local only, no list involved. Dedupe is RemoveIf(colRecent,
                  # Id = ThisItem.ID), not Distinct: Distinct(Table, Formula) returns a
                  # single-column table named Result rather than the original row, which
                  # would have dropped Name and At and broken scrHome's
                  # Index(colRecent, n).Name references. RemoveIf preserves every column
                  # on every row; trimming to 3 removes the oldest At, not a ClearCollect
                  # of the collection from itself. FALLBACK if Studio rejects
                  # RemoveIf/SaveData here: delete these four lines (the Set line stays,
                  # and Navigate stays as the last line) and remove the recently-viewed
                  # block from scrHome. Navigate runs LAST, after the collection writes —
                  # Navigate unloads this screen, and anything after it in the same
                  # OnSelect would not be guaranteed to run.
                  OnSelect: |
                    =Set(varCustomer, ThisItem);
                    RemoveIf(colRecent, Id = ThisItem.ID);
                    Collect(colRecent, {Id: ThisItem.ID, Name: ThisItem.Title, At: Now()});
                    If(CountRows(colRecent) > 3,
                       RemoveIf(colRecent, At = First(Sort(colRecent, At, SortOrder.Ascending)).At));
                    IfError(SaveData(colRecent, "recent"), Blank());
                    Navigate(scrCustomerOverview, ScreenTransition.Cover)
                Children:
                  # A Label with a Fill, not a Rectangle: the archived kit used Labels for
                  # every coloured surface in a gallery template, and its rows were clickable.
                  # A Rectangle is a shape with its own OnSelect and swallows the tap. This
                  # also gives the row a full-width clickable surface - empty template area
                  # does not respond to clicks in Power Apps.
                  # The card is a Classic/Button, not a Label. Three reasons, all deliberate:
                  # it is the only control that accepts corner radius, so the rounded cards in
                  # the design survive; it has HoverFill and PressedFill, which no Label or
                  # Rectangle has; and its OnSelect forwards the tap to the gallery.
                  #
                  # Selection is drawn by hand. Canvas galleries have no automatic selected or
                  # hover state - Studio's own generated gallery styles it from
                  # ThisItem.IsSelected, and this follows that.
                  - btnCard:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =96
                        Text: =""
                        Fill: =If(ThisItem.IsSelected, AppTheme.PrimaryLight, AppTheme.Surface)
                        HoverFill: =AppTheme.Sunken
                        PressedFill: =AppTheme.PrimaryLight
                        BorderColor: =If(ThisItem.IsSelected, AppTheme.Primary, AppTheme.LineSoft)
                        HoverBorderColor: =AppTheme.Line
                        PressedBorderColor: =AppTheme.Primary
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                  # A 4px accent rail on the selected row - the same device the design deck
                  # uses to mark the lead row, and the same one Studio's browse gallery uses.
                  - lblAccent:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =4
                        Height: =96
                        Text: =""
                        Fill: =AppTheme.Primary
                        BorderThickness: =0
                        Visible: =ThisItem.IsSelected
                  - lblName:
                      Control: Label
                      Properties:
                        Wrap: =false
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =12
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Bold, FontWeight.Semibold)
                        Color: =AppTheme.Fg
                  - lblDesc:
                      Control: Label
                      Properties:
                        Wrap: =true
                        AutoHeight: =false
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =36
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =36
                        Text: =Coalesce(ThisItem.Description, "No description")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
                  - rectChip:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        Text: =""
                        X: =Gutter
                        Y: =60
                        Width: =Gutter * 8
                        Height: =22
                        BorderThickness: =0
                        Fill: |
                          =If(
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      !IsBlank('Installed Version'),
                                      !IsBlank(LookUp(TB_Products, ID = Product.Id).'Current Standard Version'),
                                      'Installed Version' <> LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                  )
                              ) > 0,
                              AppTheme.WarnLight,
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      IsBlank('Installed Version')
                                  )
                              ) > 0,
                              AppTheme.NeutralLight,
                              CountRows(Filter(TB_Installations, Customer.Id = ThisItem.ID, Status.Value <> "Retired")) = 0,
                              AppTheme.NeutralLight,
                              AppTheme.OkLight
                          )
                  - lblChip:
                      Control: Label
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =Gutter
                        Y: =60
                        Width: =Gutter * 8
                        Height: =22
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =AppFont
                        Size: =AppType.Micro
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Fg
                        Text: |
                          =If(
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      !IsBlank('Installed Version'),
                                      !IsBlank(LookUp(TB_Products, ID = Product.Id).'Current Standard Version'),
                                      'Installed Version' <> LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                  )
                              ) > 0,
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      !IsBlank('Installed Version'),
                                      !IsBlank(LookUp(TB_Products, ID = Product.Id).'Current Standard Version'),
                                      'Installed Version' <> LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                  )
                              ) & " off standard",
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      IsBlank('Installed Version')
                                  )
                              ) > 0,
                              CountRows(
                                  Filter(
                                      TB_Installations,
                                      Customer.Id = ThisItem.ID,
                                      Status.Value <> "Retired",
                                      IsBlank('Installed Version')
                                  )
                              ) & " not recorded",
                              CountRows(Filter(TB_Installations, Customer.Id = ThisItem.ID, Status.Value <> "Retired")) = 0,
                              "nothing recorded",
                              "all on standard"
                          )
                  # Full-item hit target, LAST so it sits on top of the labels. A button
                  # behind them leaves only the uncovered margins clickable, which is why
                  # rows previously needed a precise click. Transparent fills keep it
                  # invisible while carrying the hover and pressed feedback.
                  - galCustomersHit:
                      Control: Classic/Button
                      Properties:
                        OnSelect: =Select(Parent)
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Text: =""
                        Fill: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.04)
                        PressedFill: =RGBA(0, 87, 184, 0.10)
                        BorderThickness: =0
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
            - lblNoCustomers:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =Gutter + 140
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No customers match your search."
                  Visible: =CountRows(galCustomers.AllItems) = 0
