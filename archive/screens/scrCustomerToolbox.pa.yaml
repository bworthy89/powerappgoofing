# Screen 2 of 3 — Customer Toolbox
# Mimics the guide-viewer CustomerPlaybooksPage: centered 700px column, subtle back link,
# large title with dimmed count, then a single-column stack of hairline row cards.
# Column names come from the exported schema - see 00_Schema_Reference.md. Two to watch:
# 'Solution Famility' is misspelled on the list itself, and 'Deployment Status' still carries the
# placeholder choices Choice 1/2/3, so the status badge stays gray until those are configured.
Screens:
  scrCustomerToolbox:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conToolboxPage:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - 700) / 2, 0)
            Y: =0
            Width: =Min(Parent.Width, 700)
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - btnBackToCustomers:
                Control: Classic/Button
                Properties:
                  X: =26
                  Y: =28
                  Width: =180
                  Height: =32
                  Text: ="<  Back to customers"
                  Fill: =AppTheme.Bg
                  HoverFill: =AppTheme.Muted
                  PressedFill: =AppTheme.Muted
                  Color: =AppTheme.Primary
                  HoverColor: =AppTheme.PrimaryDark
                  BorderThickness: =0
                  Size: =11
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  OnSelect: =Navigate(scrCustomers, ScreenTransition.Fade)
            - lblToolboxCustomerName:
                Control: Label
                Properties:
                  X: =32
                  Y: =72
                  Width: =Parent.Width - 64
                  Height: =34
                  Text: =varCustomer.Title
                  Color: =AppTheme.Fg
                  Size: =20
                  FontWeight: =FontWeight.Bold
            - lblSolutionCount:
                Control: Label
                Properties:
                  X: =32
                  Y: =106
                  Width: =Parent.Width - 64
                  Height: =22
                  Text: =CountRows(galSolutions.AllItems) & If(CountRows(galSolutions.AllItems) = 1, " solution", " solutions")
                  Color: =AppTheme.MutedFg
                  Size: =12
            - lblNotesCard:
                Control: Label
                Properties:
                  X: =32
                  Y: =144
                  Width: =Parent.Width - 64
                  Height: =84
                  Text: =""
                  Fill: =AppTheme.BgSecondary
                  BorderColor: =AppTheme.Border
                  BorderThickness: =1
                  Visible: =!IsBlank(varCustomer.'Support Notes')
            - lblNotesLabel:
                Control: Label
                Properties:
                  X: =48
                  Y: =156
                  Width: =Parent.Width - 96
                  Height: =18
                  Text: ="SUPPORT NOTES"
                  Color: =AppTheme.MutedFg
                  Size: =9
                  FontWeight: =FontWeight.Bold
                  Visible: =!IsBlank(varCustomer.'Support Notes')
            - lblNotesBody:
                Control: Label
                Properties:
                  X: =48
                  Y: =176
                  Width: =Parent.Width - 96
                  Height: =44
                  Text: =varCustomer.'Support Notes'
                  Color: =AppTheme.Fg
                  Size: =11
                  Visible: =!IsBlank(varCustomer.'Support Notes')
            - lblSolutionsLabel:
                Control: Label
                Properties:
                  X: =32
                  Y: =If(IsBlank(varCustomer.'Support Notes'), 152, 248)
                  Width: =400
                  Height: =20
                  Text: ="SOLUTIONS"
                  Color: =AppTheme.MutedFg
                  Size: =10
                  FontWeight: =FontWeight.Bold
            - galSolutions:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =32
                  Y: =If(IsBlank(varCustomer.'Support Notes'), 178, 274)
                  Width: =Parent.Width - 64
                  Height: =Parent.Height - If(IsBlank(varCustomer.'Support Notes'), 210, 306)
                  TemplateSize: =92
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Items: |
                    =SortByColumns(
                        Filter(
                            TB_CustomerSolutions,
                            Customer.Id = varCustomer.ID &&
                            Active = true
                        ),
                        "Sort Order",
                        SortOrder.Ascending,
                        "Title",
                        SortOrder.Ascending
                    )
                  OnSelect: |
                    =Set(varSolution, ThisItem);
                    Set(varComponent, Blank());
                    Set(varSelectedSection, "Overview");
                    Navigate(scrSolutionDetails, ScreenTransition.Fade)
                Children:
                  - lblSolutionCard:
                      Control: Label
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =84
                        Text: =""
                        Fill: =AppTheme.Card
                        BorderColor: =AppTheme.Border
                        BorderThickness: =1
                  - lblSolutionName:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =12
                        Width: =Parent.TemplateWidth - 190
                        Height: =24
                        Text: =ThisItem.Title
                        Color: =AppTheme.Fg
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                  - lblBadgeModel:
                      Control: Label
                      Properties:
                        X: =16
                        Y: =44
                        Width: =108
                        Height: =24
                        Text: =ThisItem.'Solution Model'
                        Fill: =AppTheme.PrimaryLight
                        Color: =AppTheme.PrimaryDark
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                  - lblBadgeFamily:
                      Control: Label
                      Properties:
                        X: =130
                        Y: =44
                        Width: =116
                        Height: =24
                        Text: =ThisItem.'Solution Famility'.Value
                        Fill: =AppTheme.GrayLight
                        Color: =AppTheme.GrayDark
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =!IsBlank(ThisItem.'Solution Famility'.Value)
                  - lblBadgeStatus:
                      Control: Label
                      Properties:
                        X: =Parent.TemplateWidth - 168
                        Y: =30
                        Width: =152
                        Height: =24
                        Text: =ThisItem.'Deployment Status'.Value
                        Fill: |
                          =Switch(
                              ThisItem.'Deployment Status'.Value,
                              "Current Standard", AppTheme.SuccessLight,
                              "Installed", AppTheme.SuccessLight,
                              "Upgrade Planned", AppTheme.WarningLight,
                              "Upgrade Required", AppTheme.WarningLight,
                              AppTheme.GrayLight
                          )
                        Color: |
                          =Switch(
                              ThisItem.'Deployment Status'.Value,
                              "Current Standard", AppTheme.SuccessDark,
                              "Installed", AppTheme.SuccessDark,
                              "Upgrade Planned", AppTheme.WarningDark,
                              "Upgrade Required", AppTheme.WarningDark,
                              AppTheme.GrayDark
                          )
                        Size: =10
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
            - lblNoSolutions:
                Control: Label
                Properties:
                  X: =32
                  Y: =320
                  Width: =Parent.Width - 64
                  Height: =24
                  Text: ="No active solutions are recorded for this customer."
                  Color: =AppTheme.MutedFg
                  Size: =11
                  Align: =Align.Center
                  Visible: =CountRows(galSolutions.AllItems) = 0
