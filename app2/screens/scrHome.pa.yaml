# Screen — Home
# The landing screen: reached from App.StartScreen, so it is the only screen that never
# has varCustomer or varInstallation pre-set from an incoming Navigate. It is built last
# because scrCustomers, scrCustomerOverview, scrCatalogue, scrSolution and scrUnit must
# already exist for its formulas (and App.StartScreen naming this screen) to resolve —
# the same forward-reference condition already accepted for scrUnit in
# scrCustomerOverview and for scrHome itself in App.StartScreen.
#
# Two mutually exclusive regions share the same Y origin (contentY, realised below as
# lblSearchCustomersHead.Y): the three search-result galleries, visible only while
# txtSearch has at least two characters, and the dashboard (currency card, the two count
# tiles, the two entry tiles, and the recently-viewed row), visible the rest of the time.
# Every control in the dashboard region repeats
# "Len(Trim(txtSearch.Text)) < 2" in its own Visible so the two regions never render on
# top of each other — the same repeated-guard idiom scrCatalogue uses across
# lblDocsHeading / galModelDocs / lblNoModelDocs.
#
# All vertical positions below txtSearch are chained through cross-control property
# references (controlName.Y, controlName.Height, controlName.Visible) rather than by
# repeating the arithmetic that produces them. This environment forbids locally
# introduced names (no With/As/AddColumns), but a formula in one control reading a
# PROPERTY of another control is ordinary Power Fx and is already proven in the accepted
# screens (Parent.Height, CountRows(galSolutions.AllItems), CountRows(galModelDocs.AllItems)).
# Chaining this way means the vertical rhythm of the screen has exactly one author per
# offset, which is deliberately the opposite of the proportion bar below, where the
# environment leaves no such escape and the same CountRows(...) has to be retyped.
#
# Search — three sources, three galleries. Power Fx cannot union TB_Customers,
# TB_Products and TB_References without a locally-introduced name (no AddColumns, no
# With), so this is three separate, independently-scrolling galleries stacked with
# cumulative offsets, each Visible only once the search has two characters and that
# gallery actually has rows. Customers and products match StartsWith(Title, ...);
# documents match Trim(txtSearch.Text) in Title, exactly as briefed. Search rows are
# deliberately lighter than the full browse rows in scrCustomers/scrCatalogue (no
# currency chip) — this is a way-finder, not a second copy of those screens, and every
# extra TB_Installations query here would be one more place the retired-row exclusion
# has to be re-verified for no real benefit.
#
# Backlog card — the three things this card must get right:
#   1. lblBacklogFigure counts INSTALLATION ROWS that are off standard (Status not
#      Retired, Installed Version not blank, and not equal to the product's Current
#      Standard Version). lblBacklogCaption spells out "installations", never
#      "machines" or "customers".
#   2. lblUnknownCount is its own line, counting rows with a blank Installed Version.
#      It is never added into the on-standard or off-standard side of anything. The
#      proportion bar below reflects this by construction, not by a written-out
#      "unknown" segment: rectOnStandard and rectOffStandard are each sized against the
#      SAME denominator (all non-retired installations), so whatever neither segment's
#      width accounts for is exactly the not-recorded count, and it stays the
#      background track colour (AppTheme.Sunken) rather than being painted into either
#      status colour.
#   3. Every one of the five TB_Installations queries on this screen (lblBacklogFigure,
#      lblBacklogCaption, lblUnknownCount, rectOnStandard.Width, rectOffStandard.Width)
#      opens with "Status.Value <> "Retired"" as its own Filter argument — checked
#      individually below, not inherited from a shared list, since nothing here is
#      shared except literal repeated text.
#
# rectOnStandard.Width and rectOffStandard.Width both divide by
# Max(CountRows(Filter(TB_Installations, Status.Value <> "Retired")), 1). On an empty
# TB_Installations (day one, before any data exists) that denominator evaluates to
# Max(0, 1) = 1, every numerator CountRows(...) is also 0, so both widths evaluate to
# (Parent.Width - 6) * 0 = 0 — no division by zero, and the bar renders as an empty
# track rather than erroring.
#
# The repeated CountRows(Filter(TB_Installations, Status.Value <> "Retired")) denominator
# appears three times (lblBacklogCaption, rectOnStandard.Width, rectOffStandard.Width)
# character-for-character identical by construction — it was typed once and copied, not
# retyped from memory each time, specifically to avoid the divergence-between-copies bug
# this workaround invites.
#
# conDashboard is the one construct on this screen with no precedent in the other five
# accepted files: an AutoLayout GroupContainer (Variant: AutoLayout) whose
# LayoutDirection formula — =If(IsNarrow, LayoutDirection.Vertical,
# LayoutDirection.Horizontal) — is given verbatim by the brief. Its three children
# (cardBacklog, cardCustomerCount, cardModelCount) carry Width and Height but
# deliberately no X/Y: those are exactly the properties an AutoLayout parent is supposed
# to own, mirroring how Gallery children never carry X either. This is the construct
# named as least-confident in the final report — nothing else on this screen relies on
# it, and everywhere else (identity bar, entry tiles, recently-viewed row) responsive
# stacking is done the proven way, with ManualLayout and an If(IsNarrow, ...) on each
# position, exactly like the support-notes branch in scrCustomerOverview and the
# expanded-model branch in scrCatalogue.
#
# Recently opened — device-local, no list involved. galCustomers.OnSelect in
# scrCustomers (Task 3) now also writes colRecent via Collect + Distinct + SaveData;
# App.OnStart now also calls LoadData(colRecent, "recent", true). Both are flagged
# inline at their call sites below. FALLBACK, if Studio rejects the Distinct/SaveData/
# LoadData chain: delete lblRecentHeading, btnRecent1, btnRecent2 and btnRecent3 from
# this file, delete the two colRecent lines from scrCustomers' galCustomers.OnSelect,
# and delete the LoadData line from App.OnStart. Nothing else on this screen reads
# colRecent, so removing it is a clean subtraction — the brief calls this the least
# load-bearing element on the screen, and it is written that way on purpose: btnRecent1
# through btnRecent3 each guard their own Index(colRecent, n) behind
# CountRows(colRecent) >= n, both in Text and in OnSelect, so an empty or partially
# populated colRecent (the normal state on day one, before anyone has opened a customer)
# never evaluates an out-of-range Index.
Screens:
  scrHome:
    Properties:
      Fill: =AppTheme.Bg
    Children:
      - conRoot:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =Max((Parent.Width - ContentWidth) / 2, Gutter)
            Y: =0
            Width: =ContentWidth
            Height: =Parent.Height
            Fill: =AppTheme.Bg
          Children:
            - lblTitle:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Text: ="Technician Toolbox"
                  Font: =AppFont
                  Size: =AppType.Title
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Fg
            - lblGreeting:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =If(IsNarrow, lblTitle.Y + lblTitle.Height, lblTitle.Y + 8)
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =24
                  Align: =If(IsNarrow, Align.Left, Align.Right)
                  Text: ="Hi, " & Coalesce(User().FullName, "there")
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
            - txtSearch:
                Control: Classic/TextInput
                Properties:
                  X: =Gutter
                  Y: |
                    =If(
                        IsNarrow,
                        lblGreeting.Y + lblGreeting.Height,
                        lblTitle.Y + lblTitle.Height
                    ) + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =44
                  Default: =""
                  HintText: ="Search customers, models, documents"
                  Font: =AppFont
                  Size: =AppType.Body
                  Fill: =AppTheme.Surface
                  Color: =AppTheme.Fg
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblSearchCustomersHead:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =txtSearch.Y + txtSearch.Height + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="Customers"
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Muted
                  Visible: =galSearchCustomers.Visible
            - galSearchCustomers:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y + lblSearchCustomersHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =170
                  TemplateSize: =56
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Visible: =Len(Trim(txtSearch.Text)) >= 2 && CountRows(Self.AllItems) > 0
                  Items: =Filter(TB_Customers, Active = true, StartsWith(Title, Trim(txtSearch.Text)))
                  OnSelect: |
                    =Set(varCustomer, ThisItem);
                    Navigate(scrCustomerOverview, ScreenTransition.Cover)
                Children:
                  - lblSrchCustName:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =8
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Fg
                  - lblSrchCustDesc:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =32
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =18
                        Text: =Coalesce(ThisItem.Description, "No description")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
            - lblSearchProductsHead:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: |
                    =lblSearchCustomersHead.Y + If(
                        galSearchCustomers.Visible,
                        lblSearchCustomersHead.Height + 4 + galSearchCustomers.Height + Gutter,
                        0
                    )
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="Models"
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Muted
                  Visible: =galSearchProducts.Visible
            - galSearchProducts:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =Gutter
                  Y: =lblSearchProductsHead.Y + lblSearchProductsHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =170
                  TemplateSize: =56
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Visible: =Len(Trim(txtSearch.Text)) >= 2 && CountRows(Self.AllItems) > 0
                  Items: =Filter(TB_Products, Active = true, StartsWith(Title, Trim(txtSearch.Text)))
                  OnSelect: |
                    =Set(varExpandedModel, ThisItem.ID);
                    Navigate(scrCatalogue, ScreenTransition.Cover)
                Children:
                  - lblSrchProdName:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =8
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =AppTheme.Fg
                  - lblSrchProdMeta:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =32
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =18
                        Text: |
                          =ThisItem.'Product Type'.Value & "  •  " &
                          Coalesce(ThisItem.'Current Standard Version', "no standard set")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
            - lblSearchDocsHead:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: |
                    =lblSearchProductsHead.Y + If(
                        galSearchProducts.Visible,
                        lblSearchProductsHead.Height + 4 + galSearchProducts.Height + Gutter,
                        0
                    )
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="Documents"
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Muted
                  Visible: =galSearchDocs.Visible
            - galSearchDocs:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  X: =Gutter
                  Y: =lblSearchDocsHead.Y + lblSearchDocsHead.Height + 4
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =170
                  TemplateSize: =56
                  TemplatePadding: =6
                  ShowScrollbar: =true
                  Visible: =Len(Trim(txtSearch.Text)) >= 2 && CountRows(Self.AllItems) > 0
                  Items: =Filter(TB_References, Trim(txtSearch.Text) in Title)
                  OnSelect: =If(!IsBlank(ThisItem.URL), Launch(ThisItem.URL))
                Children:
                  - lblSrchDocTitle:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =8
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =22
                        Text: =ThisItem.Title
                        Font: =AppFont
                        Size: =AppType.Body
                        FontWeight: =FontWeight.Semibold
                        Color: =If(IsBlank(ThisItem.URL), AppTheme.Faint, AppTheme.Fg)
                  - lblSrchDocMeta:
                      Control: Label
                      Properties:
                        X: =Gutter
                        Y: =32
                        Width: =Parent.TemplateWidth - (Gutter * 2)
                        Height: =18
                        Text: |
                          =If(!IsBlank(ThisItem.Product.Value), LookUp(TB_Products, ID = ThisItem.Product.Id).Title, "") &
                          If(!IsBlank(ThisItem.Customer.Value), "  •  " & LookUp(TB_Customers, ID = ThisItem.Customer.Id).Title, "")
                        Font: =AppFont
                        Size: =AppType.Small
                        Color: =AppTheme.Muted
            - lblNoSearchResults:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =40
                  Align: =Align.Center
                  Font: =AppFont
                  Size: =AppType.Small
                  Color: =AppTheme.Muted
                  Text: ="No matches for this search."
                  Visible: |
                    =Len(Trim(txtSearch.Text)) >= 2 &&
                    CountRows(galSearchCustomers.AllItems) = 0 &&
                    CountRows(galSearchProducts.AllItems) = 0 &&
                    CountRows(galSearchDocs.AllItems) = 0
            - conDashboard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  X: =Gutter
                  Y: =lblSearchCustomersHead.Y
                  Width: =Parent.Width - (Gutter * 2)
                  Height: |
                    =If(
                        IsNarrow,
                        cardBacklog.Height + Gutter + cardCustomerCount.Height + Gutter + cardModelCount.Height,
                        cardBacklog.Height
                    )
                  Fill: =AppTheme.Bg
                  LayoutDirection: =If(IsNarrow, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =Gutter
                  Visible: =Len(Trim(txtSearch.Text)) < 2
                Children:
                  - cardBacklog:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        Width: =If(IsNarrow, Parent.Width, Parent.Width * 0.5)
                        Height: =190
                        Fill: =AppTheme.Surface
                        BorderColor: =AppTheme.Line
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                      Children:
                        - lblBacklogHeading:
                            Control: Label
                            Properties:
                              X: =Gutter
                              Y: =16
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =14
                              Text: ="BACKLOG"
                              Font: =AppFont
                              Size: =AppType.Micro
                              FontWeight: =FontWeight.Bold
                              Color: =AppTheme.Muted
                        - lblBacklogFigure:
                            Control: Label
                            Properties:
                              X: =Gutter
                              Y: =32
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =44
                              Font: =AppFont
                              Size: =AppType.Display
                              FontWeight: =FontWeight.Bold
                              Color: =AppTheme.Fg
                              Text: |
                                =CountRows(
                                    Filter(
                                        TB_Installations,
                                        Status.Value <> "Retired",
                                        !IsBlank('Installed Version'),
                                        'Installed Version' <> LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                    )
                                )
                        - lblBacklogCaption:
                            Control: Label
                            Properties:
                              X: =Gutter
                              Y: =80
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =18
                              Font: =AppFont
                              Size: =AppType.Small
                              Color: =AppTheme.Muted
                              Text: |
                                ="of " & CountRows(Filter(TB_Installations, Status.Value <> "Retired")) & " installations off standard"
                        - conProportionBar:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =Gutter
                              Y: =112
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =10
                              Fill: =AppTheme.Bg
                            Children:
                              - rectBarTrack:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Fill: =AppTheme.Sunken
                                    BorderThickness: =0
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                              - rectOnStandard:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Height: =Parent.Height
                                    Fill: =AppTheme.Ok
                                    BorderThickness: =0
                                    Width: |
                                      =(Parent.Width - 6) * (
                                          CountRows(
                                              Filter(
                                                  TB_Installations,
                                                  Status.Value <> "Retired",
                                                  !IsBlank('Installed Version'),
                                                  'Installed Version' = LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                              )
                                          ) / Max(CountRows(Filter(TB_Installations, Status.Value <> "Retired")), 1)
                                      )
                              - rectOffStandard:
                                  Control: Rectangle
                                  Properties:
                                    X: =rectOnStandard.Width
                                    Y: =0
                                    Height: =Parent.Height
                                    Fill: =AppTheme.Warn
                                    BorderThickness: =0
                                    Width: |
                                      =(Parent.Width - 6) * (
                                          CountRows(
                                              Filter(
                                                  TB_Installations,
                                                  Status.Value <> "Retired",
                                                  !IsBlank('Installed Version'),
                                                  'Installed Version' <> LookUp(TB_Products, ID = Product.Id).'Current Standard Version'
                                              )
                                          ) / Max(CountRows(Filter(TB_Installations, Status.Value <> "Retired")), 1)
                                      )
                        - lblUnknownCount:
                            Control: Label
                            Properties:
                              X: =Gutter
                              Y: =134
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =16
                              Font: =AppFont
                              Size: =AppType.Micro
                              Color: =AppTheme.Neutral
                              Text: |
                                =CountRows(
                                    Filter(TB_Installations, Status.Value <> "Retired", IsBlank('Installed Version'))
                                ) & " not recorded"
                  - cardCustomerCount:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        Width: =If(IsNarrow, Parent.Width, Parent.Width * 0.25)
                        Height: =If(IsNarrow, 96, cardBacklog.Height)
                        Fill: =AppTheme.Surface
                        BorderColor: =AppTheme.Line
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                      Children:
                        - lblCustomerCountFigure:
                            Control: Label
                            Properties:
                              X: =Gutter
                              Y: =(Parent.Height - 54) / 2
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =36
                              Align: =Align.Center
                              Font: =AppFont
                              Size: =AppType.Title
                              FontWeight: =FontWeight.Bold
                              Color: =AppTheme.Fg
                              Text: =CountRows(Filter(TB_Customers, Active = true))
                        - lblCustomerCountCaption:
                            Control: Label
                            Properties:
                              X: =Gutter
                              Y: =lblCustomerCountFigure.Y + lblCustomerCountFigure.Height + 4
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =18
                              Align: =Align.Center
                              Font: =AppFont
                              Size: =AppType.Small
                              Color: =AppTheme.Muted
                              Text: ="active customers"
                  - cardModelCount:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        Width: =If(IsNarrow, Parent.Width, Parent.Width * 0.25)
                        Height: =If(IsNarrow, 96, cardBacklog.Height)
                        Fill: =AppTheme.Surface
                        BorderColor: =AppTheme.Line
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                      Children:
                        - lblModelCountFigure:
                            Control: Label
                            Properties:
                              X: =Gutter
                              Y: =(Parent.Height - 54) / 2
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =36
                              Align: =Align.Center
                              Font: =AppFont
                              Size: =AppType.Title
                              FontWeight: =FontWeight.Bold
                              Color: =AppTheme.Fg
                              Text: =CountRows(Filter(TB_Products, Active = true))
                        - lblModelCountCaption:
                            Control: Label
                            Properties:
                              X: =Gutter
                              Y: =lblModelCountFigure.Y + lblModelCountFigure.Height + 4
                              Width: =Parent.Width - (Gutter * 2)
                              Height: =18
                              Align: =Align.Center
                              Font: =AppFont
                              Size: =AppType.Small
                              Color: =AppTheme.Muted
                              Text: ="active models"
            - btnTileCustomers:
                Control: Classic/Button
                Properties:
                  X: =Gutter
                  Y: =conDashboard.Y + conDashboard.Height + Gutter
                  Width: =(Parent.Width - (Gutter * 3)) / 2
                  Height: =72
                  Text: ="Customers"
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  Fill: =AppTheme.Surface
                  HoverFill: =AppTheme.PrimaryLight
                  PressedFill: =AppTheme.PrimaryLight
                  Color: =AppTheme.Primary
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Visible: =Len(Trim(txtSearch.Text)) < 2
                  OnSelect: =Navigate(scrCustomers, ScreenTransition.Cover)
            - btnTileCatalogue:
                Control: Classic/Button
                Properties:
                  X: =btnTileCustomers.X + btnTileCustomers.Width + Gutter
                  Y: =btnTileCustomers.Y
                  Width: =btnTileCustomers.Width
                  Height: =72
                  Text: ="Catalogue"
                  Font: =AppFont
                  Size: =AppType.Body
                  FontWeight: =FontWeight.Semibold
                  Fill: =AppTheme.Surface
                  HoverFill: =AppTheme.PrimaryLight
                  PressedFill: =AppTheme.PrimaryLight
                  Color: =AppTheme.Primary
                  BorderColor: =AppTheme.Line
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Visible: =Len(Trim(txtSearch.Text)) < 2
                  OnSelect: =Navigate(scrCatalogue, ScreenTransition.Cover)
            - lblRecentHeading:
                Control: Label
                Properties:
                  X: =Gutter
                  Y: =btnTileCustomers.Y + btnTileCustomers.Height + Gutter
                  Width: =Parent.Width - (Gutter * 2)
                  Height: =20
                  Text: ="Recently viewed"
                  Font: =AppFont
                  Size: =AppType.Micro
                  FontWeight: =FontWeight.Bold
                  Color: =AppTheme.Muted
                  Visible: =Len(Trim(txtSearch.Text)) < 2 && CountRows(colRecent) > 0
            - btnRecent1:
                Control: Classic/Button
                Properties:
                  X: =Gutter
                  Y: =lblRecentHeading.Y + lblRecentHeading.Height + 4
                  Width: =If(IsNarrow, Parent.Width - (Gutter * 2), (Parent.Width - (Gutter * 4)) / 3)
                  Height: =56
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Fill: =AppTheme.Surface
                  HoverFill: =AppTheme.Sunken
                  PressedFill: =AppTheme.Sunken
                  Color: =AppTheme.Fg
                  BorderColor: =AppTheme.LineSoft
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Text: =If(CountRows(colRecent) >= 1, Index(colRecent, 1).Name, "")
                  Visible: =Len(Trim(txtSearch.Text)) < 2 && CountRows(colRecent) >= 1
                  OnSelect: |
                    =Set(varCustomer, LookUp(TB_Customers, ID = Index(colRecent, 1).Id));
                    Navigate(scrCustomerOverview, ScreenTransition.Cover)
            - btnRecent2:
                Control: Classic/Button
                Properties:
                  X: =If(IsNarrow, Gutter, btnRecent1.X + btnRecent1.Width + Gutter)
                  Y: =If(IsNarrow, btnRecent1.Y + btnRecent1.Height + 8, btnRecent1.Y)
                  Width: =btnRecent1.Width
                  Height: =56
                  Font: =AppFont
                  Size: =AppType.Small
                  FontWeight: =FontWeight.Semibold
                  Fill: =AppTheme.Surface
                  HoverFill: =AppTheme.Sunken
                  PressedFill: =AppTheme.Sunken
                  Color: =AppTheme.Fg
                  BorderColor: =AppTheme.LineSoft
                  BorderThickness: =1
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Text: =If(CountRows(colRecent) >= 2, Index(colRecent, 2).Name, "")
